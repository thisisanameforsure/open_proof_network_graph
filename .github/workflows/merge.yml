# The merge actor (F07-T25; D-4, F07-Q16, C8): "when steps 1-8 are green and step 9 is satisfied,
# the merge happens with no person pressing a button" (D-4, since v3.11). Until this file, a person
# pressed it: a gate-green proposal sat unmerged for half an hour while its author could do nothing
# (the 2026-09-19 primes run), because nothing on the network merged anything.
#
# What it may merge is decided elsewhere: the required checks are read from the `main` ruleset on
# every run, by their exact names, never written here, so this file cannot drift from what GitHub
# enforces on everyone else. Green is every one of them finished and passed on the head commit —
# the sandbox gate, and step 9 where the pinned gate asks it (a proof that settles a root waits for
# its reviewer exactly as before) — and, the ruleset being strict, a branch that is up to date.
# It decides nothing about mathematics and reads nothing a contributor wrote: no checkout, no gate
# code, no pull request content — only the host's own facts about a pull request.
#
# Said plainly, because the first draft of this comment claimed more: the token is the owner's,
# the ruleset lets the repository's admin role bypass it (that is how a 27-target re-pin is pushed),
# and so GitHub would NOT refuse a merge this workflow got wrong. The check above is the guard on
# the merge. The guard on the *record* is the post-merge job, which re-derives the verdict on the
# merge commit and attests nothing that fails or lacks a review it needed; a node with no
# attestation is never proved (F03-Q7). A defect here could land a commit that should not have
# landed; it could not make a false statement read as proved.
#
# Only branches the service opened (propose/, append/, submit/), oldest first, and one lane per
# target (F07-T56, the owner's request 2026-10-02). A submission touches exactly one target (D-2,
# D-3), so a merge on erdos-402 cannot change the verdict on erdos-69: the ruleset's up-to-date rule
# is kept per target. A pull request is stale only if main's commits since its merge base touched
# its own target, or a shared input (curators.json, policy.json, keys/, schemas/, the workflows);
# what the post-merge job renders (graph.json, CONTEXT.json, the tag cache, frontier.json and the
# rest) and the guides never count. A stale one is updated; any other merges behind main, as appends
# already did. So lanes go in parallel, one run acting in each, and within a lane it is one at a
# time, which is the safe choice now that a proof may import another node's proved lemma (F08-R16).
# A pull request this file cannot place in one target (policy.json, or a history it cannot read)
# goes in no lane: it waits until it is first, and then holds every lane, as the whole queue was
# held before. The post-merge re-check on the merge commit stays the guard on the record.
#
# Appends merge in batches (F07-T45, the owner's ruling 2026-09-29), now within their lane. An append is one
# new file under a target, earns no attestation and builds nothing, so the up-to-date rebuild buys
# it nothing, and on 2026-09-27 every fifteen-second append still cost a whole round and a
# three-minute post-merge job (20 pull requests, 7 merged in 45 minutes). When the oldest pull
# request the actor would act on is a green append, it merges it behind main, with every following
# green append that does not conflict, in queue order, up to MAX_BATCH; the batch ends at the first
# green building pull request (first in, first out) and at an up-to-date one whose gate is running
# (T31). A building pull request is never in a batch and is still updated before it merges. One
# post-merge run then records the whole batch (gate.yml, F07-T45). The token's bypass is what lets
# a pull request merge behind main; if the host ever refuses, the acting step updates it instead.
#
# A lane holds (F07-T31). A pull request that is up to date and whose gate is running is next in
# its lane, and nothing in that lane is merged past it: its target may not move under a gate run
# this workflow started. Without that, the pull request it had just updated read as "not green", the
# next green one (always a fifteen-second append) was merged, and the updated one was behind again;
# on 2026-09-21 green Mathlib pull requests waited 13 to 33 minutes behind appends that took one. A
# hold older than HOLD_S is ignored, so a run that never reports holds nothing. Nothing waits for a
# post-merge job any more (F07-T56): F07-T33 held the whole queue until the job had committed,
# because a merge in between used to cost the job its push and its record (#125, #132, #133, #145);
# the job now catches up on main as it is instead (gate.yml, F07-T55), and the queue stopped
# waiting five to eight minutes per merge. A run updates or merges in every lane at once (the gate
# re-runs on an updated branch and wakes this workflow again; a run that merged dispatches it once
# more). Each merge names the head commit it saw, so a push in between refuses the merge rather than
# landing unchecked.
#
# Every way a run can stop has a wake after it (F07-T32). The first draft said "a hold here is
# always woken", and on 2026-09-23 the queue froze twice with green pull requests waiting: the host
# reports a check done seconds to minutes after it is (#148 was read pending 19 s after its gate
# finished), a push run `in_progress` for eight minutes after its jobs had ended, and `mergeable`
# null while it computes (#150 was updated in that state, the update failed, and a failed run wakes
# nothing); the concurrency group drops older pending wakes, and the cron below fired four times in
# seventeen hours. So a hold is not the end of a run: it is decided again every SETTLE_EVERY_S until
# it resolves or SETTLE_CAP_S passes, unless some other lane has something to act on. The post-merge
# job dispatches this workflow when it ends, however it ends; a run here that failed or merged
# dispatches it once more. The cron is a last resort, nothing more.
#
# A hold on an unknown mergeability is right while the host computes it and wrong when the host's
# record of the pull request is stale (F07-T46). On 2026-09-30 run 1094 updated #306's branch, the
# push landed, and the host never synchronised the pull request: it went on reporting the old head,
# green checks on that head and `mergeable: null`, and nine runs held on it for six hours with
# fourteen green pull requests behind it, nothing red anywhere. The fact that tells the two apart
# is the branch's tip: a pull request whose recorded head is not its branch's tip cannot be merged
# at that head (the merge names the head it saw) and its checks are not the branch's, so it is
# passed over with a notice, as a conflict is, and the queue moves. A branch that is gone is the
# same case. Nothing is pushed to nudge the host: a push it does not register would repeat every
# run; the notice names the pull request for a person.
#
# The token is a fine-grained one on this repository alone, contents and pull requests write, an
# Actions secret read by the one step that acts. `GITHUB_TOKEN` cannot stand in: a merge or a branch
# update made with it starts no workflow, so neither the post-merge job nor the re-gate would run.
# Without the secret the workflow is a dry run: it says what it would have done and changes nothing,
# so a missing permission never reads as a passing merge (C7).
name: merge

on:
  workflow_run:
    workflows: [gate]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *" # a last resort only: Actions crons are a hope, not a schedule
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: merge
  cancel-in-progress: false

jobs:
  merge:
    name: merge what the ruleset allows, one lane per target
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # above SETTLE_CAP_S, so a hold ends on its own terms
    permissions:
      pull-requests: read
      checks: read
      contents: read
    outputs:
      merged: ${{ steps.act.outputs.merged }}  # F07-T56: how many merged, for the rewake job
    steps:
      - name: Pick what to do in each lane, from the host's own facts
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > pick.py <<'PY'
          """Pick what to do in each lane — one target's pull requests — and say it. Pure functions
          over the host's JSON, so the network repo's tests run this file as it stands (F07-T25)."""
          import json
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime, timedelta, timezone

          SERVICE_PREFIXES = ("propose/", "append/", "submit/")
          #: The service's append routes and nothing else push to this prefix (api/opn_api/appends.py).
          APPEND_PREFIX = "append/"
          #: At most this many appends in one run (F07-T45): one post-merge job records them all,
          #: and this bounds its work and the damage of a batch the host half-refuses.
          MAX_BATCH = 8
          #: How long an up-to-date pull request whose gate has not reported holds the queue. The
          #: gate's own cap is well under it; a run that never reports must not hold forever.
          HOLD_S = 45 * 60
          #: A hold is decided again this often, from fresh reads, until it resolves (F07-T32).
          SETTLE_EVERY_S = 20
          #: and for at most this long in one run; the job's timeout sits above it.
          SETTLE_CAP_S = 15 * 60
          #: The one check that may never be `skipped`: a gate that did not run checked nothing.
          MUST_SUCCEED_PREFIX = "gate ("
          #: F07-T56: what the post-merge job renders from the tree (F03, F07-R12, F14-R12). A change
          #: to one of these never changes what a pull request is gated against.
          PRODUCT_FILES = ("frontier.json", "info.json", "claims.json", "targets/index.json",
                           "THIRD_PARTY_NOTICES.md")
          PRODUCT_DIRS = ("attestations/", "ledger/")
          TARGET_PRODUCTS = ("graph.json", ".tags-cache.json")  # targets/<id>/<name>
          NODE_PRODUCTS = ("CONTEXT.json",)  # targets/<id>/nodes/<node>/<name>
          #: How far back along main's first-parent line a pull request's staleness is read; past
          #: it, and past the host's own cap on a commit's file list, the branch is updated (C7).
          WALK_LIMIT = 100
          MAX_FILE_PAGES = 30
          UNREADABLE = 10**6
          #: The lane a pull request in no single target closes: every one.
          EVERY_LANE = "*"


          def required_checks(rules):
              """The exact check names the branch's ruleset requires, and whether it is strict
              (an up-to-date branch). No such rule means nothing may be merged by this file."""
              names, strict = [], False
              for rule in rules:
                  if rule.get("type") == "required_status_checks":
                      params = rule.get("parameters") or {}
                      names += [c["context"] for c in params.get("required_status_checks") or []]
                      strict = strict or bool(params.get("strict_required_status_checks_policy"))
              return sorted(set(names)), strict


          def candidates(pulls):
              """Open, non-draft pull requests on branches the service opened, oldest first."""
              out = []
              for pr in sorted(pulls, key=lambda pr: pr["number"]):
                  head, base = pr["head"], pr["base"]
                  same_repo = (head.get("repo") or {}).get("full_name") == base["repo"]["full_name"]
                  if pr.get("draft") or not same_repo or base["ref"] != "main":
                      continue
                  if head["ref"].startswith(SERVICE_PREFIXES):
                      out.append((pr["number"], head["sha"]))
              return out


          def verdict(check_runs, required):
              """green: every required check finished; the gate succeeded, and the rest succeeded or
              were not asked (GitHub counts a skipped required check as passed). Anything
              unfinished or absent is pending; anything else is red. No required checks: red."""
              if not required or not any(n.startswith(MUST_SUCCEED_PREFIX) for n in required):
                  return "red"  # a ruleset that requires no gate is not one this file merges under
              latest = {}
              for run in sorted(check_runs, key=lambda r: r["id"]):
                  latest[run["name"]] = run  # a re-run job replaces its earlier attempt
              ok = True
              for name in required:
                  run = latest.get(name)
                  if run is None or run["status"] != "completed":
                      return "pending"
                  must = name.startswith(MUST_SUCCEED_PREFIX)
                  ok = ok and run["conclusion"] in (("success",) if must else ("success", "skipped"))
              return "green" if ok else "red"


          def gate_started(check_runs):
              """When the newest gate check run on a commit started, or None if none has."""
              runs = [r for r in check_runs if r["name"].startswith(MUST_SUCCEED_PREFIX)]
              stamp = max(runs, key=lambda r: r["id"]).get("started_at") if runs else None
              return datetime.fromisoformat(stamp.replace("Z", "+00:00")) if stamp else None


          def holds_the_line(state, runs, sha, strict, behind_of, now):
              """F07-T31: an up-to-date pull request whose gate is running is next in line, and
              nothing is merged past it — unless its run has not reported for HOLD_S."""
              if state != "pending" or not strict or behind_of(sha) != 0:
                  return False
              started = gate_started(runs)
              return started is None or now - started < timedelta(seconds=HOLD_S)


          def stale_head(number, sha, ref, tip_of):
              """F07-T46: whether the host's record of a pull request is stale — its branch's tip is
              not the head it records (an update it never synchronised, #306 on 2026-09-30), or the
              branch is gone (an empty tip). ``tip_of`` answers None when it was not asked, and
              then nothing is stale: the older callers and tests decide as before."""
              tip = tip_of(ref)
              if tip is None or tip == sha:
                  return False
              if tip:
                  print(f"#{number}: its branch is at {tip[:12]}, not the {sha[:12]} the host records: passed over (F07-T46)")
              else:
                  print(f"#{number}: its branch {ref} no longer exists: passed over (F07-T46)")
              return True


          def more_appends(
              rest, refs, required, strict, checks_of, behind_of, conflicted, now,
              tip_of=lambda ref: None, limit=MAX_BATCH - 1,
          ):
              """F07-T45: the green appends after the first, in queue order, that go with it: up
              to the first green building pull request, the first that holds the line (T31) or
              the first whose mergeability is still unknown (T32), and never past `limit`.
              Red, conflicting, and behind-and-pending ones are passed over, as at the head.
              F07-T56: `rest` is the rest of the first one's lane, and `limit` what is left of
              the run's MAX_BATCH."""
              out = []
              for number, sha in rest:
                  if len(out) >= limit:
                      break
                  runs = checks_of(sha)
                  state = verdict(runs, required)
                  if holds_the_line(state, runs, sha, strict, behind_of, now):
                      print(f"#{number} is up to date and its gate is running: the batch ends before it")
                      break
                  if state != "green":
                      continue
                  if not refs[number].startswith(APPEND_PREFIX):
                      print(f"#{number} is green and builds: the batch ends before it (first in, first out)")
                      break
                  if stale_head(number, sha, refs[number], tip_of):
                      continue
                  conflict = conflicted(number)
                  if conflict is None:
                      print(f"#{number}: the host is still computing whether it conflicts: the batch ends before it")
                      break
                  if conflict:
                      print(f"#{number} is green but conflicts with main: passed over")
                      continue
                  out.append((number, sha))
              return out


          # --- F07-T56: one lane per target ---------------------------------------------------------


          def gates_on(path, lane):
              """Whether a change to `path` on main can change what a pull request in `lane` is
              gated against. A submission touches one target (D-2, D-3), so another target's files
              cannot; nor can what the post-merge job renders from the tree (F03), nor the guides.
              Anything else outside targets/ is shared (curators.json, policy.json, keys/,
              schemas/, the workflows) and reaches every lane. `lane` None is a pull request this
              file could not place in one target: everything but the products reaches it."""
              if path in PRODUCT_FILES or path.startswith(PRODUCT_DIRS):
                  return False
              parts = path.split("/")
              if parts[0] == "targets" and len(parts) > 2:
                  if len(parts) == 3 and parts[2] in TARGET_PRODUCTS:
                      return False
                  if len(parts) == 5 and parts[2] == "nodes" and parts[4] in NODE_PRODUCTS:
                      return False
                  return lane is None or parts[1] == lane
              if len(parts) == 1 and path.endswith(".md"):
                  return False  # prose for people and agents; no gate reads it
              return True


          def lane_of_paths(paths):
              """The one target a pull request touches, or None: no target, several, or a file
              outside targets/ (policy.json is a curator's pull request that touches none)."""
              targets = {p.split("/")[1] for p in paths if p.startswith("targets/") and p.count("/") >= 2}
              if len(targets) != 1 or any(not p.startswith("targets/") for p in paths):
                  return None
              return targets.pop()


          def stale_count(walk, lane):
              """How many of main's commits since a pull request's merge base touched what it is
              gated against. `walk` is their changed paths, one list per commit on main's
              first-parent line, or None when it could not be read; then every commit counts, so
              an unreadable history updates the branch rather than merging it behind (C7)."""
              if walk is None:
                  return UNREADABLE
              return sum(1 for paths in walk if any(gates_on(path, lane) for path in paths))


          def main_since(base, head, commit_of, limit=WALK_LIMIT):
              """The changed paths of each commit on main's first-parent line from `head` back to
              `base`, newest first; None past `limit` commits or if the line never reaches `base`.
              A merge commit's paths are its first-parent diff: exactly what it put on main."""
              out, sha = [], head
              while sha != base:
                  if len(out) >= limit:
                      return None
                  paths, parents = commit_of(sha)
                  if paths is None or not parents:
                      return None
                  out.append(paths)
                  sha = parents[0]
              return out


          def decide(
              pulls,
              rules,
              checks_of,
              behind_of,
              conflicted=lambda number: False,
              *,
              now=None,
              tip_of=lambda ref: None,
              lane_of=lambda number: None,
          ):
              """F07-T56: a list of (number, sha, action), action one of "merge", "update",
              "hold" (a lane waits for it) or "wait" (nothing waits for it, but the run reads
              its gate again before it ends), for at most one step in each lane: a lane is the target a pull request
              touches (`lane_of`), and `behind_of` counts only main's commits that touched what
              that lane is gated against. Lanes are independent: a merge on one target cannot
              change the verdict on another (D-2, D-3), so a pull request merges behind main
              unless its own target or a shared input moved, and lanes go in parallel. Within a
              lane everything is as it was for the whole queue: oldest first, T31's line, T32's
              unknown mergeability, T45's batches of appends (MAX_BATCH across the whole run),
              T46's stale heads. A pull request in no single lane (`lane_of` None) waits until it
              is first, and then closes every lane; with no `lane_of` at all every pull request is
              such a one, and the queue is the single line it was before T56.

              A green pull request the host says cannot be merged (a conflict with main) is
              passed over: acting on it would fail on every run and hold everything behind it,
              and a person has to look at it either way. `conflicted` may answer None, the host
              still computing: that is a hold, never an update (#150, F07-T32)."""
              required, strict = required_checks(rules)
              now = now or datetime.now(timezone.utc)
              refs = {pr["number"]: pr["head"]["ref"] for pr in pulls}
              queue = candidates(pulls)
              lanes = {number: lane_of(number) for number, _sha in queue}
              decided, closed, batched = [], set(), 0

              def close(lane):
                  closed.add(EVERY_LANE if lane is None else lane)

              for index, (number, sha) in enumerate(queue):
                  lane = lanes[number]
                  if EVERY_LANE in closed:
                      break
                  if lane in closed or (lane is None and closed):
                      continue
                  runs = checks_of(sha)
                  state = verdict(runs, required)
                  if state == "pending" and strict:
                      started = gate_started(runs)
                      recent = started is None or now - started < timedelta(seconds=HOLD_S)
                      if behind_of(sha) == 0 and recent:
                          print(f"#{number} is up to date and its gate is running: holding its lane for it")
                          decided.append((number, sha, "hold"))
                          close(lane)
                          continue
                      if recent:
                          # F07-T56: behind on its own lane while its gate runs (a merge's own bot
                          # commit can do that now that nothing waits for it). It holds nothing,
                          # as T31 says, but its run's end must still be read: the wake for it
                          # can come before the host reports the check (T32), and a run that
                          # decided "nothing" would leave it until some other wake.
                          print(f"#{number} is behind on its lane and its gate is running: waiting on it, holding nothing")
                          decided.append((number, sha, "wait"))
                      else:
                          print(f"#{number} has been pending for over {HOLD_S} s: not held for")
                  if state != "green":
                      continue
                  if stale_head(number, sha, refs[number], tip_of):
                      continue
                  conflict = conflicted(number)
                  if conflict is None:
                      print(f"#{number} is green; the host is still computing whether it conflicts: holding its lane")
                      decided.append((number, sha, "hold"))
                      close(lane)
                      continue
                  if conflict:
                      print(f"#{number} is green but conflicts with main: passed over")
                      continue
                  if refs[number].startswith(APPEND_PREFIX):
                      if batched >= MAX_BATCH:
                          print(f"#{number}: this run has merged {MAX_BATCH} appends; the next run takes it")
                          close(lane)
                          continue
                      rest = [(n, s) for n, s in queue[index + 1 :] if lanes[n] == lane]
                      batch = [(number, sha)] + more_appends(
                          rest, refs, required, strict, checks_of, behind_of, conflicted, now,
                          tip_of, limit=MAX_BATCH - batched - 1,
                      )
                      decided += [(n, s, "merge") for n, s in batch]
                      batched += len(batch)
                      close(lane)
                      continue
                  decided.append((number, sha, "update" if strict and behind_of(sha) > 0 else "merge"))
                  close(lane)
              return decided


          def acts(decided):
              """The decisions the acting step carries out: everything but the holds and waits."""
              return [d for d in decided if d[2] not in ("hold", "wait")]


          def settle(step, sleep, *, clock=time.monotonic):
              """Decide, and while every lane is holding or waiting decide again from fresh reads, every
              SETTLE_EVERY_S for at most SETTLE_CAP_S. A hold used to end the run, and nothing
              woke it when what it held for had already happened (F07-T32). A run with anything
              to act on acts at once; a lane still holding is decided again by the run its act
              wakes (F07-T56)."""
              started = clock()
              while True:
                  decided = step()
                  if acts(decided) or not decided or clock() - started >= SETTLE_CAP_S:
                      return decided
                  sleep(SETTLE_EVERY_S)


          def mergeability(pull):
              """True for a conflict, False for none, None while the host computes it."""
              mergeable = pull.get("mergeable")
              return None if mergeable is None else mergeable is False


          def api(path):
              out = subprocess.run(["gh", "api", path], check=True, capture_output=True, text=True)
              return json.loads(out.stdout)


          def paged_files(path, read=None):
              """Every changed path the host lists for a pull request or a commit, page by page,
              and the first page as read; the paths are None past the host's own cap, which is
              read as unreadable rather than as complete."""
              read = read or api
              out, first = [], None
              for page in range(1, MAX_FILE_PAGES + 1):
                  doc = read(f"{path}?per_page=100&page={page}")
                  first = doc if first is None else first
                  files = doc if isinstance(doc, list) else doc.get("files") or []
                  for entry in files:
                      out.append(entry["filename"])
                      if entry.get("previous_filename"):
                          out.append(entry["previous_filename"])  # a rename leaves its old path too
                  if len(files) < 100:
                      return out, first
              return None, first


          if __name__ == "__main__":
              repo = os.environ["REPO"]
              rules = api(f"repos/{repo}/rules/branches/main")
              commits = {}  # a commit's paths and parents never change: read each once per run
              pr_files = {}

              def commit_of(sha):
                  if sha not in commits:
                      paths, first = paged_files(f"repos/{repo}/commits/{sha}")
                      commits[sha] = (paths, [p["sha"] for p in (first or {}).get("parents") or []])
                  return commits[sha]

              def tip(ref):
                  # F07-T46: the branch's tip, or "" when the branch is gone; a failed run wakes
                  # nothing, so a 404 here is an answer, never an exception
                  try:
                      return api(f"repos/{repo}/git/ref/heads/{ref}")["object"]["sha"]
                  except subprocess.CalledProcessError:
                      return ""

              def step():
                  # every read is fresh: a hold is decided again on what the host says now
                  pulls = api(f"repos/{repo}/pulls?state=open&base=main&per_page=100")
                  number_of = {pr["head"]["sha"]: pr["number"] for pr in pulls}
                  main = api(f"repos/{repo}/git/ref/heads/main")["object"]["sha"]

                  def lane_of(number):
                      head = next(pr["head"]["sha"] for pr in pulls if pr["number"] == number)
                      if (number, head) not in pr_files:
                          files, _first = paged_files(f"repos/{repo}/pulls/{number}/files")
                          pr_files[(number, head)] = lane_of_paths(files) if files else None
                      return pr_files[(number, head)]

                  def behind_of(sha):
                      compare = api(f"repos/{repo}/compare/{sha}...{main}?per_page=1")
                      # a compare's own commit list is capped; its counts and merge base are not
                      if int(compare["ahead_by"]) == 0:
                          return 0
                      base = compare["merge_base_commit"]["sha"]
                      return stale_count(main_since(base, main, commit_of), lane_of(number_of[sha]))

                  return decide(
                      pulls,
                      rules,
                      lambda s: api(f"repos/{repo}/commits/{s}/check-runs?per_page=100")["check_runs"],
                      behind_of,
                      lambda n: mergeability(api(f"repos/{repo}/pulls/{n}")),
                      tip_of=tip,
                      lane_of=lane_of,
                  )

              decided = acts(settle(step, time.sleep))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"number={' '.join(str(n) for n, _s, _a in decided)}\n")
                  out.write(f"sha={' '.join(s for _n, s, _a in decided)}\n")
                  out.write(f"action={' '.join(a for _n, _s, a in decided)}\n")
              said = ", ".join(f"{a} #{n}" for n, _s, a in decided)
              print(f"merge actor: {said or 'nothing to do'}")
              sys.exit(0)
          PY
          python3 pick.py

      - name: Act (the only step that sees the token)
        id: act
        if: steps.pick.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.OPN_GRAPH_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pick.outputs.number }}
          SHA: ${{ steps.pick.outputs.sha }}
          ACTION: ${{ steps.pick.outputs.action }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::dry run: would $ACTION #$NUMBER at $SHA; OPN_GRAPH_MERGE_TOKEN is not set, so nothing was changed"
            exit 0
          fi
          # F07-T56: one entry per pull request, numbers, heads and actions aligned, in queue order:
          # at most one step per lane, or a lane's batch of appends (F07-T45). Each merge names the
          # head it saw, so a push in between refuses it rather than landing unchecked. A refused
          # merge (a conflict that appeared since the decision, or a host that refuses to merge
          # behind main) is updated instead, as before T45, and the rest go on: lanes are
          # independent. A failed update fails the run, and the rewake job starts another.
          read -r -a numbers <<< "$NUMBER"
          read -r -a shas <<< "$SHA"
          read -r -a actions <<< "$ACTION"
          if [ "${#numbers[@]}" -eq 0 ] || [ "${#numbers[@]}" -ne "${#shas[@]}" ] \
            || [ "${#numbers[@]}" -ne "${#actions[@]}" ]; then
            echo "::error::${#numbers[@]} numbers, ${#shas[@]} heads and ${#actions[@]} actions"; exit 1
          fi
          merged=0
          failed=0
          for i in "${!numbers[@]}"; do
            n="${numbers[$i]}"
            s="${shas[$i]}"
            if [ "${actions[$i]}" = "merge" ] \
              && gh api -X PUT "repos/$REPO/pulls/$n/merge" -f sha="$s" -f merge_method=merge >/dev/null; then
              merged=$((merged + 1))
              echo "merged #$n at $s"
              continue
            fi
            [ "${actions[$i]}" = "merge" ] && echo "::warning::the host refused to merge #$n; updating its branch instead"
            if gh api -X PUT "repos/$REPO/pulls/$n/update-branch" -f expected_head_sha="$s" >/dev/null; then
              echo "updated the branch of #$n; the gate re-runs on it and wakes this workflow"
            else
              echo "::warning::#$n was neither merged nor updated"
              failed=$((failed + 1))
            fi
          done
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "merged $merged; each merge's post-merge job records it, catching up if main moved (F07-T55)"
          [ "$failed" -eq 0 ] || exit 1

  # F07-T32: a failed run wakes nothing, so the queue froze at 17:51 on 2026-09-23 after an update
  # of #150 failed. This job starts one more run when the acting job fails. F07-T56: and when it
  # merged anything, since a merge no longer waits for its post-merge job and that job's wake comes
  # minutes later: the next pull request in a lane whose head merged is updated at once. Its own
  # token may start this repository's workflows and do nothing else; the acting job still only reads.
  rewake:
    name: wake the merge actor after a failed run or a merge
    needs: merge
    if: failure() || (needs.merge.outputs.merged != '' && needs.merge.outputs.merged != '0')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch this workflow once more
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sleep 30 # let the host settle whatever made the act fail, or register the merge
          gh workflow run merge.yml --repo "$REPO" --ref main
          echo "dispatched the merge actor again"
