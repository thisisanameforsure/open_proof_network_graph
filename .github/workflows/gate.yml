# The gate (D-4, D-35): the only thing with authority to say a proof counts.
#
# Two jobs, never sharing a secret:
#   gate       on every pull request — checks out the `network` commit
#              this graph pins in its gate-spec.json, asks that pinned gate what the diff *is*
#              (F07-R3, F08-R2, R8: proof, partial, append, explainer, proposal or curator) and
#              then does what that mode needs. A proof or a partial runs steps 1, 2 and 4 to 8
#              inside the step-3 sandbox. A proposal — one new node directory, or a witness for
#              a hole's empty slot — runs F08-R1's admission inside the same sandbox and needs no
#              review (D-29: nobody approves structure). An append or an explainer gets the path
#              and schema checks the classifier itself runs and no Lean build at all (F07-R9,
#              R10) — unless it carries a Lean exhibit (a revision request or a defect claim,
#              F08-R6, R7), which elaborates in the sandbox or fails the pull request. A
#              curator record is classified the same way, its author checked against
#              curators.json (F08-R8), and reviewed by a second listed identity when there is
#              one. No secret, no write permission (C8). Its check status is what the main
#              ruleset requires. It no longer asks for a review: it exports what step 9 needs.
#   step 9     after the gate job, on the same pull request run (F07-T8, D-4's order): step 9 is a
#              property of the statement (v3.11) — the tutorial node needs no review; a node under a
#              root with no certificate or registry provenance needs a non-author approving review,
#              and this job stays red until one exists. It reads the reviews and nothing else
#              (pull-requests: read). A submitted or dismissed review re-runs this job in place
#              through step9-refresh.yml, so the build is never repeated and no stale red run is
#              left on the pull request. The ruleset requires this job's check by its exact name.
#   postmerge  on every push to main — if the commit merged a pull request that touched a target,
#              classifies the merged diff with the pinned gate, and for the modes that build a
#              proof (proof, partial) re-derives the verdict on the merge commit, records what
#              satisfied step 9 (the `review` block) and signs the attestation with the gate key
#              (in a step of its own). For every merged mode it then refreshes claims.json from
#              the service if one is configured (F05-R10; the committed snapshot stands when it
#              is not reachable), regenerates the merge products (frontier.json, info.json,
#              targets/index.json, every graph.json and each node's META status — F03, D-25,
#              D-35; a merged proposal enters the frontier here, F08-R13) and commits them all,
#              with the attestation when there is one, in one commit `gate: #<pr> <verdict>`,
#              pushing with a write deploy key (the main ruleset lets deploy keys bypass the
#              review requirement; nothing else does). A proof that used native_decide under a
#              waiver (F02) is attested only if an approving review's body contains the line
#              `waiver: native_decide`; the approvals' bodies are handed to the gate for that
#              check. F07-T45: one run records every merge that has no gate commit yet. The merge
#              actor merges appends in batches, so a run that finds a later merge on main leaves
#              its merge to that push's run, and the run at the head records the batch (appends
#              pinned to one gate) in one commit `gate: #A #B #C pass`: each merge classified on
#              its own diff, one ledger call each in order, the products once. Anything else it
#              finds unrecorded — a building merge, another pin, a diff the gate refuses — is
#              replayed on its own after it commits, never dropped.
#
# The pinned `network` commit is read from targets/<target>/gate-spec.json (network_commit).
# Every field this file reads from the classifier is read with a default, and the pull request's
# author reaches the classifier as OPN_PR_AUTHOR rather than as a flag, so the file works on a
# pin that predates F08 and the F08 behaviour switches on with the re-pin (F08-Q8).
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # F07-T33: replay the post-merge job for one merged pull request whose job was lost, from main
  # as it now is. A job that finds main moved under it dispatches this itself; the owner may too.
  workflow_dispatch:
    inputs:
      replay_pr:
        description: "the merged pull request whose post-merge job to replay"
        required: true
        type: string

permissions: {}

env:
  UV_VERSION: "0.12.10"

jobs:
  gate:
    name: gate (steps 1, 2 and 4-8 in the sandbox)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # F07-T8: the step-9 job has no checkout, so everything it needs comes out of this job.
    outputs:
      needs_review: ${{ steps.classify.outputs.needs_review }}
      tutorial: ${{ steps.classify.outputs.tutorial }}
      reviewers: ${{ steps.classify.outputs.reviewers }}
    steps:
      - name: Check out the graph at the pull request's merge commit
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      # Which target, and so which `network` commit — the only thing this shell decides. It
      # cannot ask the gate, because the gate is the pinned commit it is about to check out.
      # What the diff *is* (F07-R3) is decided by that pinned gate, one step below.
      - name: Find the target this pull request touches and the network commit it pins
        id: pin
        run: |
          set -euo pipefail
          # The diff base is the first parent of the merge ref checked out above, which GitHub
          # recomputes whenever main moves — never github.event.pull_request.base.sha, which is
          # frozen at the moment the pull request was opened. Under the strict up-to-date rule a
          # pull request that is BEHIND diffs against that stale base, so everything merged since
          # reads as part of this submission and the one-target step below refuses it (F11-Q29).
          base="$(git rev-parse HEAD^1)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "gate: diffing from HEAD^1 $base (the base branch tip this merge ref carries)"
          git diff --name-only "$base...HEAD" > changed.txt
          target="$(sed -n 's#^targets/\([^/]*\)/.*#\1#p' changed.txt | sort -u)"
          # F15-R3 (Q2): policy.json is the steward rule's switch, a curator's pull request that
          # touches no target. It is gated all the same — classified as a curator record by the
          # pinned gate — so its pin is read from any target's gate-spec.json (every target agrees
          # on one, or the pin step of a target's own pull request would already have refused).
          if [ -z "$target" ] && grep -qx 'policy.json' changed.txt; then
            target="$(ls -d targets/*/ 2>/dev/null | head -n 1 | xargs -r basename)"
            echo "gate: policy.json changed; taking the network pin from targets/$target"
          fi
          if [ -z "$target" ]; then
            echo "gate: nothing under targets/ changed; nothing to gate (maintenance PR, review only)"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$target" | wc -l)" -ne 1 ]; then
            echo "gate: a submission touches exactly one target (D-2, D-3); found:"; cat changed.txt; exit 1
          fi
          pin="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['network_commit'])" "targets/$target/gate-spec.json")"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "gate: target $target; network pin $pin"

      - name: Check out the pinned network commit
        if: steps.pin.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ steps.pin.outputs.pin }}
          path: network
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        if: steps.pin.outputs.run == 'true'
        with:
          version: ${{ env.UV_VERSION }}

      # F07-R3: exactly one mode, decided from the touched paths by the pinned gate rather than
      # by this file — so the rule travels with the commit the graph pins (D-35), and a
      # submitter cannot choose which checks run by mislabelling the PR body (F07-Q9).
      # An append or an explainer is *finished* here: R9 and R10 give them the path and schema
      # checks and no Lean build at all, so `needs_gate` is false and the sandbox never starts.
      # A proposal's shape is checked here too, so a malformed one never costs a sandbox
      # (F08-R2); its admission is the step after step 9. A curator record's author is checked
      # against curators.json here (F08-R8) — the author is the one fact the host supplies.
      # A non-zero exit is the refusal — a PR fitting no mode, or one whose records fail their
      # schema — and it fails this job, which is the check the ruleset requires.
      - name: Classify the pull request and check what needs no sandbox
        id: classify
        if: steps.pin.outputs.run == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
          OPN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          uv sync --frozen --project network --quiet
          uv run --frozen --project network python -m opn_gate.cli classify \
            --graph . --base "$BASE" --head HEAD | tee classification.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          doc = json.loads(pathlib.Path("classification.json").read_text())
          for key, default in (("mode", None), ("node", None), ("needs_gate", False),
                               ("needs_review", False), ("needs_admission", False), ("admit", None),
                               ("needs_exhibits", False), ("needs_qa_rerun", False),
                               ("reviewers", None)):
              value = doc.get(key, default)
              print(f"{key}={json.dumps(value) if isinstance(value, (bool, list)) else (value or '')}")
          PY
          node="$(python3 -c "import json;print(json.load(open('classification.json')).get('node') or '')")"
          tutorial=false
          if [ -n "$node" ] && grep -q '^tutorial: true' "targets/${{ steps.pin.outputs.target }}/nodes/$node/META.yaml"; then
            tutorial=true
          fi
          echo "tutorial=$tutorial" >> "$GITHUB_OUTPUT"

      # F08-R2: the mechanical admission of a proposed node — F00's layout, F01's witness and
      # context, F02's hazards, F03's acyclicity and D-30's relation proof, in R1's order —
      # inside the step-3 sandbox, because a statement elaborates arbitrary code too (C9).
      # Nobody reviews the result (D-29). A curator's versioned node is admitted the same way.
      - name: Admit the proposed node inside the step-3 sandbox
        if: steps.classify.outputs.needs_admission == 'true'
        env:
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-out"
          uv run --frozen --project network python -m opn_gate.cli admit \
            "targets/${{ steps.pin.outputs.target }}/nodes/${{ steps.classify.outputs.admit }}" \
            --sandbox --out "$RUNNER_TEMP/gate-out" | tee "$RUNNER_TEMP/admission.txt"

      # F08-R6, R7: a revision request or a defect claim may carry a Lean exhibit. The record
      # merges as an append, but the exhibit is contributor Lean, so it elaborates inside the
      # step-3 sandbox (C9) or the pull request fails naming the file. Nothing else is built.
      - name: Elaborate the exhibits inside the step-3 sandbox
        if: steps.classify.outputs.needs_exhibits == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-out"
          uv run --frozen --project network python -m opn_gate.cli exhibits \
            --graph . --base "$BASE" --head HEAD --sandbox --out "$RUNNER_TEMP/gate-out" \
            | tee "$RUNNER_TEMP/exhibits.txt"

      # F12-T8 (finding D3): a clean screen and a compile leave no exhibit (F12-Q15), so a QA
      # record's `pass` rows read the same typed as run. The pinned gate re-runs, inside the step-3
      # sandbox on the tree at head, every compile and soundness screen the record says passed
      # without an exhibit, and fails the pull request naming each row the re-run does not also
      # pass. Brief and back-translation rows ask a model, and this job holds no key (C8): they
      # are listed as not re-run. No secret, no write permission. Inert on a pin that predates the
      # command: `needs_qa_rerun` then reads false and the step is skipped (F08-Q8's shape).
      - name: Re-run the screens a QA record claims inside the step-3 sandbox
        if: steps.classify.outputs.needs_qa_rerun == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-out"
          uv run --frozen --project network python -m opn_gate.cli qa-rerun \
            --graph . --base "$BASE" --head HEAD --sandbox --out "$RUNNER_TEMP/gate-out/qa-rerun" \
            | tee "$RUNNER_TEMP/qa-rerun.txt"

      - name: Run the gate
        if: steps.classify.outputs.needs_gate == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
          PR_BODY: ${{ github.event.pull_request.body }}
          OPN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OPN_RUNNER: hosted
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          uv run --frozen --project network python -m opn_gate.cli gate \
            --graph . --base "$BASE" --head HEAD \
            --target "${{ steps.pin.outputs.target }}" --node "${{ steps.classify.outputs.node }}" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" --out "$RUNNER_TEMP/gate-out" \
            | tee "$RUNNER_TEMP/verdict.txt"

      - name: Keep the verdict and attestation
        if: always() && (steps.classify.outputs.needs_gate == 'true' || steps.classify.outputs.needs_admission == 'true' || steps.classify.outputs.needs_exhibits == 'true' || steps.classify.outputs.needs_qa_rerun == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gate-out/*.json
            ${{ runner.temp }}/gate-out/qa-rerun/qa-rerun.json
          if-no-files-found: ignore

  # D-4 step 9 after steps 1-8 (F07-T8). For a proof or a partial any non-author may approve. For a
  # curator record the approver must be another listed curator (F08-R8; D-21's separation): the
  # classifier names who is eligible, and names nobody when the founder is the only curator — then
  # `needs_review` is false and the waiver is in the gate job's classification (D-22, F08-Q9).
  # Skipped (which reports as success) when no review is asked; blocked behind a failing gate job.
  step9:
    name: step 9 (a non-author approving review)
    needs: gate
    if: needs.gate.outputs.needs_review == 'true' && needs.gate.outputs.tutorial != 'true'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: A non-author approving review, unless the statement is certified
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWERS: ${{ needs.gate.outputs.reviewers }}
        run: |
          set -euo pipefail
          # F00 knows no certificates or registry provenance yet (F11 records them); every
          # non-tutorial node therefore needs the pr-approval form of step 9 for now.
          reviewer="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/reviews" | python3 -c "
          import json, os, sys
          author = sys.argv[1]
          raw = os.environ.get('REVIEWERS') or ''
          eligible = json.loads(raw) if raw else None
          ok = [r for r in json.load(sys.stdin) if r['state'] == 'APPROVED' and r['user']['login'] != author
                and (eligible is None or r['user']['login'] in eligible)]
          ok.sort(key=lambda r: r['submitted_at'])
          print(ok[-1]['user']['login'] if ok else '')" "$AUTHOR")"
          if [ -z "$reviewer" ]; then
            msg="step 9: this node's root has no fidelity certificate or registry provenance, so a non-author approving review is required before merge (D-4 v3.11; a curator record needs another listed curator's, F08-R8). Approving re-runs this check; the build above is not repeated."
            echo "::error::$msg"
            printf '### Step 9 — waiting for a review\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "gate: step 9 satisfied by approving review from $reviewer"
          printf '### Step 9 — satisfied\n\nApproved by @%s (D-4 step 9).\n' "$reviewer" >> "$GITHUB_STEP_SUMMARY"

  postmerge:
    name: postmerge (step 9 record, gate signature, attestation commit)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      id-token: write  # F10-R7: the olean cache upload assumes a role through OIDC (C8 item 4)
      actions: write  # F07-T32: dispatch the merge actor when this job ends
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the merged pull request, its author and the target it touched
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_PR: ${{ inputs.replay_pr }}
        run: |
          set -euo pipefail
          # F07-T45: which merges this run records, and the gate-commit matcher, as one program the
          # network repo's tests run as it stands (test_finding_postmerge_batch.py).
          helper="$RUNNER_TEMP/postmerge_batch.py"
          replay=""
          dispatch_replays() {  # F07-T45: merges this run cannot record, each replayed on its own
            for n in $replay; do
              if python3 "$helper" credited HEAD "$n"; then continue; fi
              gh workflow run gate.yml --repo "$GITHUB_REPOSITORY" --ref main -f replay_pr="$n" \
                && echo "postmerge: dispatched a replay of #$n" \
                || echo "::warning::a replay of #$n was not dispatched; dispatch gate.yml with replay_pr=$n"
            done
          }
          cat > "$helper" <<'PY'
          """Which merges this post-merge run records (F07-T45). Pure functions over the first-parent
          history of main, so the network repo's tests run this file as it stands; the commands at the
          bottom read that history with git and nothing else (no network, no secret, no contributor code).

          One run records every merge that has no `gate:` commit yet, not only its own: the merge actor
          merges a batch of appends in one go, so the runs of the earlier ones find a later merge on main
          and leave their merges to it (`later-merge`), and the run at the head records them all (`plan`)."""
          import json
          import re
          import subprocess
          import sys

          APPEND_PREFIX = "append/"
          #: How far back a run looks for the last gate commit before it records its own merge alone.
          WALK_LIMIT = 400
          MERGE_RE = re.compile(r"^Merge pull request #([0-9]+) from [^/\s]+/(\S+)$")
          CREDIT_RE = re.compile(r"^gate:((?: #[0-9]+)+)(?: |$)")
          TARGET_RE = re.compile(r"^targets/([^/]+)/")
          SAFE_TARGET_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*$")
          COMMIT_RE = re.compile(r"^[0-9a-f]{40}$")


          def credits(subject):
              """The pull requests a gate commit credits: `gate: #2 #3 pass` is [2, 3], and a number
              inside a longer one is not credited (`gate: #23 pass` credits neither 2 nor 3)."""
              found = CREDIT_RE.match(subject)
              return [int(n) for n in found.group(1).split("#") if n.strip()] if found else []


          def credited(subjects, number):
              return any(number in credits(subject) for subject in subjects)


          def merge_of(subject, parents):
              """(number, branch) for a pull request's merge commit, else None. Only the host writes
              this subject on main's first-parent line; a two-parent commit is required as well."""
              found = MERGE_RE.match(subject) if parents == 2 else None
              return (int(found.group(1)), found.group(2)) if found else None


          def uncredited(log):
              """The merges since the last gate commit that was not a replay, oldest first, as
              (number, sha, branch), less any a replay in between already credits. `log` is
              (sha, parents, subject) along the first-parent line, newest first. None when no such gate
              commit is within WALK_LIMIT: the run then records its own merge alone, as before.

              A replay's commit is walked past because it credits one old merge and says nothing of the
              merges before it; any other gate commit on this line rendered a tree that held every merge
              before it (its push is refused if main moved under it, F07-T29), so it credited them or
              dispatched their replays."""
              found, replayed = [], set()
              for sha, parents, subject in log[:WALK_LIMIT]:
                  numbers = credits(subject)
                  if numbers:
                      if "(replayed)" in subject:
                          replayed.update(numbers)
                          continue
                      return [merge for merge in reversed(found) if merge[0] not in replayed]
                  merge = merge_of(subject, parents)
                  if merge:
                      found.append((merge[0], sha, merge[1]))
              return None


          def later_merge(log):
              """Whether a pull request merged on this stretch of main's first-parent line: its push has
              a post-merge run of its own, and that run covers everything this one would have."""
              return any(merge_of(subject, parents) for _sha, parents, subject in log)


          def plan(merge, own, *, log, targets_of, pin_of):
              """What this run records, as output lines. `batch=false`: its own merge alone, exactly as
              before, and `replay` the other uncredited merges, each dispatched to a replay of its own
              after this run commits. `batch=true`: every uncredited merge in `numbers`, in order.

              A batch is appends only, each touching one target, all pinned to one gate: an append earns
              no attestation, so the run needs one classifier and no signature. A building merge is never
              batched (the actor never batches one; if one is here, a run was lost, and it is replayed on
              its own). A merge the run cannot record is named in `replay`, never dropped."""
              found = uncredited(log)
              single = {"batch": "false", "replay": ""}
              if not found or found[-1][:2] != (own, merge):
                  return single
              others = [number for number, _sha, _branch in found[:-1]]
              if not others:
                  return single
              if any(not branch.startswith(APPEND_PREFIX) for _n, _s, branch in found):
                  return {"batch": "false", "replay": " ".join(map(str, others))}
              records, bad = [], []
              for number, sha, _branch in found:
                  targets = targets_of(sha)
                  if not targets:
                      continue  # touched no target: nothing to record, as before
                  if len(targets) != 1 or not SAFE_TARGET_RE.match(targets[0]):
                      bad.append(number)
                      continue
                  try:
                      pin = pin_of(sha, targets[0])
                  except (KeyError, ValueError, subprocess.CalledProcessError):
                      bad.append(number)
                      continue
                  records.append((number, sha, targets[0], pin))
              if len({record[3] for record in records}) > 1:
                  return {"batch": "false", "replay": " ".join(map(str, others))}
              if [record[0] for record in records] in ([own], []):
                  return {"batch": "false", "replay": " ".join(str(n) for n in bad if n != own)}
              targets = list(dict.fromkeys(record[2] for record in records))
              return {
                  "batch": "true",
                  "numbers": " ".join(str(record[0]) for record in records),
                  "merges": " ".join(record[1] for record in records),
                  "targets": " ".join(targets),
                  "target": records[-1][2],
                  "pin": records[0][3],
                  "replay": " ".join(map(str, bad)),
              }


          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout


          def first_parent_log(rev, limit=None):
              count = [f"-n{limit}"] if limit else []
              rows = []
              for line in git("log", "--first-parent", *count, "--format=%H%x09%P%x09%s", rev).splitlines():
                  sha, parents, subject = line.split("\t", 2)
                  rows.append((sha, len(parents.split()), subject))
              return rows


          def targets_of(sha):
              names = git("diff", "--name-only", f"{sha}^", sha).splitlines()
              return sorted({found.group(1) for found in map(TARGET_RE.match, names) if found})


          def pin_of(sha, target):
              pin = str(json.loads(git("show", f"{sha}:targets/{target}/gate-spec.json"))["network_commit"])
              if not COMMIT_RE.match(pin):
                  raise ValueError(pin)
              return pin


          if __name__ == "__main__":
              command, args = sys.argv[1], sys.argv[2:]
              if command == "credited":  # credited <rev> <number>: exit 0 if a gate commit credits it
                  subjects = [subject for _sha, _p, subject in first_parent_log(args[0])]
                  sys.exit(0 if credited(subjects, int(args[1])) else 1)
              if command == "later-merge":  # later-merge <from> <to>: exit 0 if a merge is in between
                  sys.exit(0 if later_merge(first_parent_log(f"{args[0]}..{args[1]}")) else 1)
              if command == "plan":  # plan <merge> <number>: output lines for this run
                  log = first_parent_log(args[0], WALK_LIMIT + 1)
                  decided = plan(args[0], int(args[1]), log=log, targets_of=targets_of, pin_of=pin_of)
                  for key, value in decided.items():
                      print(f"{key}={value}")
                  sys.exit(0)
              sys.exit(f"unknown command {command!r}")
          PY
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # F07-T33: a replay. The merge commit is the pull request's, not this run's commit
            # (main's head), and every later step reads it from the `merge` output.
            if ! printf '%s' "$REPLAY_PR" | grep -Eq '^[0-9]+$'; then
              echo "::error::replay_pr must be a pull request number, not '$REPLAY_PR'"; exit 1
            fi
            number="$REPLAY_PR"
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}")"
            merge="$(printf '%s' "$pr" | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['merge_commit_sha'] if p.get('merged_at') else '')")"
            if [ -z "$merge" ]; then
              echo "::error::PR #$number is not merged; there is no post-merge job to replay"; exit 1
            fi
            # Idempotent: the ledger appends, so a merge that has its commit is never replayed.
            if python3 "$helper" credited HEAD "$number"; then
              echo "postmerge: PR #$number already has its gate commit; nothing to replay"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            author="$(printf '%s' "$pr" | python3 -c "import json,sys; print(json.load(sys.stdin)['user']['login'])")"
            echo "postmerge: replaying PR #$number (merge $merge) on main at ${GITHUB_SHA}"
          else
            merge="$GITHUB_SHA"
            pulls="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
            number="$(printf '%s' "$pulls" | python3 -c "import json,sys; ps=[p for p in json.load(sys.stdin) if p.get('merged_at')]; print(ps[0]['number'] if ps else '')")"
            if [ -z "$number" ]; then
              echo "postmerge: ${GITHUB_SHA} did not merge a pull request; nothing to record"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            author="$(printf '%s' "$pulls" | python3 -c "import json,sys; ps=[p for p in json.load(sys.stdin) if p.get('merged_at')]; print(ps[0]['user']['login'])")"
            # F07-T45 (a): the merge actor merges appends in batches, so main may already hold a
            # later merge. That merge is a push with a post-merge run of its own, which records
            # every merge since the last gate commit, this one included (b); this run renders
            # nothing, so it cannot race that run's push. If main has only moved by a commit that
            # merged nothing (a bot commit, an owner's push), no later run records this merge, and
            # this run records it as before.
            git fetch --quiet origin main
            if git merge-base --is-ancestor "$merge" origin/main \
              && python3 "$helper" later-merge "$merge" origin/main; then
              echo "postmerge: a later pull request merged on main after #$number; the post-merge run of that push records #$number with its own (F07-T45)"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # F07-T45 (b): every merge on main's first-parent line since the last gate commit that
            # was not a replay. Appends pinned to one gate are recorded here together; anything
            # else is replayed on its own after this run commits, and this merge is recorded alone.
            python3 "$helper" plan "$merge" "$number" > "$RUNNER_TEMP/plan.txt"
            cat "$RUNNER_TEMP/plan.txt"
            replay="$(sed -n 's/^replay=//p' "$RUNNER_TEMP/plan.txt")"
            if [ "$(sed -n 's/^batch=//p' "$RUNNER_TEMP/plan.txt")" = "true" ]; then
              numbers="$(sed -n 's/^numbers=//p' "$RUNNER_TEMP/plan.txt")"
              target="$(sed -n 's/^target=//p' "$RUNNER_TEMP/plan.txt")"
              authors=""
              for n in $numbers; do
                authors="$authors $(gh api "repos/${GITHUB_REPOSITORY}/pulls/$n" --jq '.user.login')"
              done
              render_pin="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['network_commit'])" "targets/$target/gate-spec.json")"
              {
                echo "run=true"; echo "number=$number"; echo "author=$author"; echo "merge=$merge"
                echo "authors=${authors# }"; echo "render_pin=$render_pin"
                grep -E '^(batch|numbers|merges|targets|target|pin|replay)=' "$RUNNER_TEMP/plan.txt"
              } >> "$GITHUB_OUTPUT"
              echo "postmerge: one run records #${numbers// / #}, appends merged in one batch (F07-T45)"
              exit 0
            fi
          fi
          git diff --name-only "${merge}^...${merge}" > changed.txt
          target="$(sed -n 's#^targets/\([^/]*\)/.*#\1#p' changed.txt | sort -u)"
          if [ -z "$target" ] && grep -qx 'policy.json' changed.txt; then
            # F15-R3: the policy switch merged; the products re-derive claimability under it.
            target="$(ls -d targets/*/ 2>/dev/null | head -n 1 | xargs -r basename)"
            echo "postmerge: policy.json changed; taking the network pin from targets/$target"
          fi
          if [ -z "$target" ]; then
            echo "postmerge: PR #$number touched no target; nothing to record"
            dispatch_replays
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$target" | wc -l)" -ne 1 ]; then
            dispatch_replays
            echo "::error::PR #$number touched more than one target (D-2, D-3):"; cat changed.txt; exit 1
          fi
          # F07-T33: the gate that re-derives and attests a merge is the one its own tree pinned (an
          # attestation names that pin, and runs its image); the products, the ledger and the cache
          # are rendered by the pin main carries now. On a push the two are the same commit.
          pin="$(git show "$merge:targets/$target/gate-spec.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['network_commit'])")"
          render_pin="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['network_commit'])" "targets/$target/gate-spec.json")"
          {
            echo "run=true"; echo "number=$number"; echo "author=$author"
            echo "target=$target"; echo "pin=$pin"; echo "merge=$merge"; echo "render_pin=$render_pin"
            echo "replay=$replay"  # F07-T45: dispatched once this run has committed
          } >> "$GITHUB_OUTPUT"
          echo "postmerge: PR #$number by $author; target $target; pin $pin"

      - name: Check out the pinned network commit
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ steps.pr.outputs.pin }}
          path: network
          persist-credentials: false

      - name: Check out the network commit main pins now, which renders (F07-T33)
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ steps.pr.outputs.render_pin }}
          path: network-render
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        if: steps.pr.outputs.run == 'true'
        with:
          version: ${{ env.UV_VERSION }}

      # The same classifier the gate job ran, over the merged diff: only the modes that build a
      # proof have a verdict to re-derive and attest; every other merge goes straight to the
      # products (F07-R9, F08-R13). A merged diff the pinned gate refuses fails the job here,
      # visibly — it can only have arrived by a bypass (C7).
      - name: Classify the merged diff with the pinned gate
        id: classify
        if: steps.pr.outputs.run == 'true'
        env:
          OPN_PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PYTHONPATH: network/gate
          MERGE: ${{ steps.pr.outputs.merge }}
          NUMBER: ${{ steps.pr.outputs.number }}
          BATCH: ${{ steps.pr.outputs.batch }}
          NUMBERS: ${{ steps.pr.outputs.numbers }}
          MERGES: ${{ steps.pr.outputs.merges }}
          AUTHORS: ${{ steps.pr.outputs.authors }}
          REPLAY: ${{ steps.pr.outputs.replay }}
        run: |
          set -euo pipefail
          uv sync --frozen --project network --quiet
          if [ "$BATCH" != "true" ]; then
            uv run --frozen --project network python -m opn_gate.cli classify \
              --graph . --base "${MERGE}^" --head "$MERGE" | tee classification.json
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          doc = json.loads(pathlib.Path("classification.json").read_text())
          for key, default in (("mode", None), ("node", None), ("needs_gate", False),
                               ("needs_review", False), ("needs_admission", False), ("admit", None),
                               ("review_kind", None), ("review_reference", None)):
              value = doc.get(key, default)
              print(f"{key}={json.dumps(value) if isinstance(value, bool) else (value or '')}")
          PY
            { echo "numbers=$NUMBER"; echo "merges=$MERGE"; echo "replay=$REPLAY"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # F07-T45: a batch of appends, each merge classified on its own diff against its first
          # parent with the pinned gate, exactly as a single merge is. One the gate refuses, or one
          # that builds after all, is left out of the batch and replayed on its own, where it fails
          # visibly (C7) — never recorded here, and never allowed to block the rest.
          read -r -a numbers <<< "$NUMBERS"
          read -r -a merges <<< "$MERGES"
          read -r -a authors <<< "$AUTHORS"
          if [ "${#numbers[@]}" -ne "${#merges[@]}" ] || [ "${#numbers[@]}" -ne "${#authors[@]}" ]; then
            echo "::error::a batch of ${#numbers[@]} numbers, ${#merges[@]} merges, ${#authors[@]} authors"; exit 1
          fi
          kept=(); kept_merges=(); replay="$REPLAY"
          for i in "${!numbers[@]}"; do
            n="${numbers[$i]}"; m="${merges[$i]}"
            out="$RUNNER_TEMP/classification-$n.json"
            if OPN_PR_AUTHOR="${authors[$i]}" uv run --frozen --project network python -m opn_gate.cli classify \
                --graph . --base "${m}^" --head "$m" > "$out" \
              && python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(1 if d.get("needs_gate") or d.get("needs_review") else 0)' "$out"; then
              kept+=("$n"); kept_merges+=("$m")
            else
              cat "$out" || true
              echo "::warning::PR #$n: the pinned gate refused its merged diff, or it needs a gate run or a review; left out of this batch and replayed on its own"
              replay="$replay $n"
            fi
          done
          {
            echo "mode=append"; echo "node="; echo "needs_gate=false"; echo "needs_review=false"
            echo "needs_admission=false"; echo "admit="; echo "review_kind="; echo "review_reference="
            echo "numbers=${kept[*]:-}"; echo "merges=${kept_merges[*]:-}"; echo "replay=${replay# }"
          } >> "$GITHUB_OUTPUT"
          echo "postmerge: the batch records #${kept[*]:-}; replayed on their own:${replay:- none}"

      # D-4 v3.11 (F07-T17, Mike 2026-09-14): step 9 is a property of the statement. A root certified
      # at screened-and-signed or above, or inherited from a D-10 registry with provenance recorded,
      # satisfies it with no person; the pinned gate says which in review_kind and review_reference,
      # and the attestation names that instead of a reviewer. Otherwise a non-author approving review
      # is required, as before. Runs for every building merge, since a certified one asks no review,
      # and for every merge that asked one (a curator record), so a bypass still fails here (C7).
      # The reviews are read in every case: a waived proof is attested only if an approving review
      # names the waiver (F02-R9), and a reviewer may still leave one where nobody had to. On a pin
      # that predates F07-T17 review_kind is empty and needs_review decides, exactly as before.
      # v3.20 (F07-T24): the review is asked only of a proof that settles the target's root, and
      # never on a calibration target; for everything else review_kind says why nobody was asked.
      - name: Record what satisfied step 9
        id: review
        if: steps.classify.outputs.needs_gate == 'true' || steps.classify.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          TARGET: ${{ steps.pr.outputs.target }}
          NODE: ${{ steps.classify.outputs.node }}
          NEEDS_REVIEW: ${{ steps.classify.outputs.needs_review }}
          REVIEW_KIND: ${{ steps.classify.outputs.review_kind }}
          REVIEW_REFERENCE: ${{ steps.classify.outputs.review_reference }}
          MODE: ${{ steps.classify.outputs.mode }}
        run: |
          set -euo pipefail
          reviews="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/reviews")"
          mkdir -p "$RUNNER_TEMP/approvals"
          reviewer="$(printf '%s' "$reviews" | python3 -c "
          import json, sys, pathlib
          author, out = sys.argv[1], pathlib.Path(sys.argv[2])
          eligible = json.loads(pathlib.Path('classification.json').read_text()).get('reviewers')
          ok = [r for r in json.load(sys.stdin) if r['state'] == 'APPROVED' and r['user']['login'] != author
                and (eligible is None or r['user']['login'] in eligible)]
          ok.sort(key=lambda r: r['submitted_at'])
          for i, r in enumerate(ok):  # bodies for the native_decide waiver check (F02-R9)
              (out / f'{i:03d}.md').write_text(r.get('body') or '', encoding='utf-8')
          print(ok[-1]['user']['login'] if ok else '')" "$AUTHOR" "$RUNNER_TEMP/approvals")"
          reference=""
          if [ -n "$NODE" ] && grep -q '^tutorial: true' "targets/$TARGET/nodes/$NODE/META.yaml"; then
            kind=tutorial; reviewer=""
          elif [ "$REVIEW_KIND" = "certificate" ] || [ "$REVIEW_KIND" = "provenance" ]; then
            if [ -z "$REVIEW_REFERENCE" ]; then
              echo "::error::PR #$NUMBER: the pinned gate says step 9 is satisfied by $REVIEW_KIND but names no reference"; exit 1
            fi
            kind="$REVIEW_KIND"; reference="$REVIEW_REFERENCE"; reviewer=""
          elif [ "$REVIEW_KIND" = "intermediate" ] || [ "$REVIEW_KIND" = "calibration" ]; then
            # D-4 v3.20 (F07-T24): step 9 was not asked at all — the artifact settles no root, or
            # the target is a known result — and the attestation says which, naming nobody, even
            # if someone approved anyway. A pin that predates v3.20 never emits these (F08-Q8).
            kind="$REVIEW_KIND"; reviewer=""
          elif [ "$MODE" = "alternate" ]; then
            # F07-T38: an alternate is never asked (D-4 v3.13) and says why, as v3.20's words do. A
            # pin whose classifier gives it no kind (every pin before network 0b474b9, and so every
            # replay of an older merge, F07-T33) would otherwise pass --review-kind "" and die.
            if grep -q '^calibration: true' "targets/$TARGET/target.yaml" 2>/dev/null; then
              kind=calibration
            else
              kind=intermediate
            fi
            reviewer=""
          elif [ -n "$reviewer" ]; then
            kind=pr-approval
          elif [ "$NEEDS_REVIEW" != "true" ]; then
            # No review asked and no basis named (an alternate, D-4 v3.13): nothing to record here.
            kind=""
          else
            echo "::error::PR #$NUMBER merged without a non-author approving review and its statement carries no certificate or provenance (D-4 step 9, v3.11)"; exit 1
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "reviewer=$reviewer" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "postmerge: step 9 = ${kind:-not asked} ${reviewer:+by $reviewer}${reference:+ ($reference)}"

      # F07-T14: every merged pull request's body, so the attestation records the submission block
      # (submitter, declared model and tooling) and the precheck it consumed. F07-R6 (F11-T4): a
      # merged partial's holes become child nodes, written into this checkout for the bot commit
      # below to carry, and the assembly is filed under attempts/ for the pseudonym the block names.
      # Only a partial is handed --apply-partial — an older pin never merged a partial (F08-Q8).
      - name: Fetch the merged pull request's body (the submission block names the proposer)
        if: steps.pr.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ steps.pr.outputs.number }}" --jq '.body // ""' \
            > "$RUNNER_TEMP/pr-body.md"

      - name: Re-derive the verdict on the merge commit (no secret in this step)
        if: steps.classify.outputs.needs_gate == 'true'
        env:
          OPN_RUNNER: hosted
          OPN_PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PYTHONPATH: network/gate
          MODE: ${{ steps.classify.outputs.mode }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          MERGE: ${{ steps.pr.outputs.merge }}
        run: |
          set -euo pipefail
          approvals=()
          for f in "$RUNNER_TEMP"/approvals/*.md; do
            [ -e "$f" ] && approvals+=(--approval-body-file "$f")
          done
          partial=()
          if [ "$MODE" = "partial" ]; then
            partial=(--apply-partial)
          fi
          uv run --frozen --project network python -m opn_gate.cli postmerge \
            --graph . --commit "$MERGE" --pr "${{ steps.pr.outputs.number }}" \
            --review-kind "${{ steps.review.outputs.kind }}" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" --author "$AUTHOR" \
            ${{ steps.review.outputs.reviewer && format('--reviewer {0}', steps.review.outputs.reviewer) || '' }} \
            ${{ steps.review.outputs.reference && format('--review-reference {0}', steps.review.outputs.reference) || '' }} \
            "${approvals[@]}" "${partial[@]}" \
            --target "${{ steps.pr.outputs.target }}" --node "${{ steps.classify.outputs.node }}" \
            --out "$RUNNER_TEMP/postmerge-out"

      - name: Sign with the gate key (the only step that sees it)
        if: steps.classify.outputs.needs_gate == 'true'
        env:
          OPN_GATE_SIGNING_KEY: ${{ secrets.OPN_GATE_SIGNING_KEY }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          uv run --frozen --project network python -m opn_gate.cli sign \
            --attestation "$RUNNER_TEMP/postmerge-out/attestation.json" \
            --public-key keys/gate.pub \
            --out "attestations/$(printf '%06d' "${{ steps.pr.outputs.number }}").json"

      - name: Regenerate the merge products from the committed facts (F03; no secret)
        if: steps.pr.outputs.run == 'true'
        id: products
        env:
          PYTHONPATH: network-render/gate
          # F05-R10: the service's claim snapshot. Unset or unreachable, the committed
          # claims.json stands and the merge proceeds (AC16) — never a block on the service.
          OPN_API_CLAIMS_URL: ${{ vars.OPN_API_CLAIMS_URL }}
          NEEDS_GATE: ${{ steps.classify.outputs.needs_gate }}
        run: |
          set -euo pipefail
          # the checkout's own commit: the merge on a push, main's head on a replay (F07-T33)
          uv sync --frozen --project network-render --quiet
          uv run --frozen --project network-render python -m opn_gate.cli products \
            --graph . --commit "$(git rev-parse HEAD)" \
            ${OPN_API_CLAIMS_URL:+--claims-url "$OPN_API_CLAIMS_URL"}
          if [ "$NEEDS_GATE" = "true" ]; then
            verdict="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['verdict'])" \
              "$RUNNER_TEMP/postmerge-out/attestation.json")"
          else
            verdict=pass  # the merged diff passed the pinned classifier's checks, above
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # F07-R12 (T15), F08-R13: what the merge earned — the proof line for a proof or a partial, the
      # attempts line for the first postmortem per route class, the statement line for a variant or
      # a speculative crux; nothing for the tutorial node, an alternate or a curator's own proof.
      # After signing, because it reads this merge's attestation for the declared tooling. The
      # ledger is derived from the merge, so it rides in the same bot commit as the products.
      - name: Write what the merge earned to the ledger (F07-R12, F08-R13; no secret)
        if: steps.pr.outputs.run == 'true'
        env:
          PYTHONPATH: network-render/gate
          MERGES: ${{ steps.classify.outputs.merges }}
        run: |
          set -euo pipefail
          # F07-T45: every merge this run records, oldest first (one, unless a batch of appends)
          for merge in $MERGES; do
            uv run --frozen --project network-render python -m opn_gate.cli ledger \
              --graph . --commit "$merge"
          done

      # F10-R7: build every proved node's oleans from the merged tree inside the step-3 image and
      # upload them keyed by this commit, so the next pregate.sh, devcontainer and gate run fetch
      # instead of compiling. Only when the repository variables name the bucket and the role;
      # unset, the step is skipped and a pinned gate that predates the command is never asked
      # (F08-Q8's shape). A failed upload is a warning: the next run builds (C7).
      - name: Assume the cache upload role (OIDC, no stored key)
        if: steps.pr.outputs.run == 'true' && steps.products.outputs.verdict == 'pass' && vars.OPN_CACHE_UPLOAD_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OPN_CACHE_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.OPN_AWS_REGION }}

      - name: Publish the olean cache for this commit (F10-R7; no gate secret in this step)
        if: steps.pr.outputs.run == 'true' && steps.products.outputs.verdict == 'pass' && vars.OPN_CACHE_UPLOAD_ROLE_ARN != ''
        env:
          PYTHONPATH: network-render/gate
          MERGE: ${{ steps.pr.outputs.merge }}
          TARGETS: ${{ steps.pr.outputs.targets || steps.pr.outputs.target }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do  # F07-T45: a batch may touch several targets
            uv run --frozen --project network-render python -m opn_gate.cli cache publish \
              --graph . --commit "$MERGE" --target "$target" \
              --sandbox --bucket "${{ vars.OPN_CACHE_BUCKET }}" --prefix "${{ vars.OPN_CACHE_PREFIX }}" \
              || echo "::warning::the olean cache was not published for ${MERGE} ($target); the next run builds (C7)"
          done

      - name: Commit the attestation and the products (pushed with the write deploy key, which the ruleset lets bypass)
        if: steps.pr.outputs.run == 'true'
        env:
          OPN_GRAPH_DEPLOY_KEY: ${{ secrets.OPN_GRAPH_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}  # F07-T33: only to dispatch a replay if main moved
          # F07-T45: the merges this commit records (one, unless a batch of appends), and the ones
          # this run could not, each replayed on its own once this run is done
          NUMBERS: ${{ steps.classify.outputs.numbers }}
          REPLAY: ${{ steps.classify.outputs.replay }}
          TARGETS: ${{ steps.pr.outputs.targets || steps.pr.outputs.target }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/deploy_key"' EXIT  # C8: on every path out of this step
          helper="$RUNNER_TEMP/postmerge_batch.py"  # written by the first step (F07-T45)
          replay_owed() {  # replay_owed <rev> "<numbers>": each not yet credited on rev, replayed
            for n in $2; do
              if python3 "$helper" credited "$1" "$n"; then continue; fi
              gh workflow run gate.yml --repo "$GITHUB_REPOSITORY" --ref main -f replay_pr="$n" \
                && echo "postmerge: dispatched a replay of #$n" \
                || echo "::warning::a replay of #$n was not dispatched; dispatch gate.yml with replay_pr=$n"
            done
          }
          if [ -z "$NUMBERS" ]; then
            echo "postmerge: nothing in this batch could be recorded here"
            rm -f "$RUNNER_TEMP/deploy_key"; replay_owed HEAD "$REPLAY"; exit 0
          fi
          printf '%s\n' "$OPN_GRAPH_DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          git config user.name "opn-gate"
          git config user.email "gate@openproof.network"
          git add attestations/ frontier.json info.json targets/
          [ -f claims.json ] && git add claims.json
          [ -d ledger ] && git add ledger/
          [ -f THIRD_PARTY_NOTICES.md ] && git add THIRD_PARTY_NOTICES.md  # F14-R12: a merge product
          if git diff --cached --quiet; then
            echo "postmerge: PR #${NUMBERS// / #} changed no product; nothing to commit"
            rm -f "$RUNNER_TEMP/deploy_key"; replay_owed HEAD "$REPLAY"; exit 0
          fi
          # F15-R12 (D-32 v3.17): mention each active steward of the target in the bot commit, so
          # they hear on GitHub whenever anything merges on it. The pinned gate lists them and
          # validates every login against GitHub's grammar; a pin that predates the command answers
          # nothing and the message is exactly as before (F08-Q8's shape). A batch mentions the
          # stewards of every target it touched (F07-T45).
          mention=""
          for target in $TARGETS; do
            said="$(PYTHONPATH=network-render/gate uv run --frozen --project network-render python -m opn_gate.cli stewards \
              --graph . --target "$target" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("mention", ""))' 2>/dev/null || true)"
            case "$mention" in *"$said"*) ;; *) mention="$mention$said" ;; esac
          done
          replayed=""
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && replayed=" (replayed)"
          credits="$(printf '#%s ' $NUMBERS)"; credits="${credits% }"  # F07-T45: `#A #B #C`
          git commit -m "gate: ${credits} ${{ steps.products.outputs.verdict }}${replayed}${mention}"
          # F07-T29: this push happens minutes after the merge it renders, and main can move in
          # between (an owner's re-pin or guide copy; found live on #130, whose products were lost
          # to a non-fast-forward). What landed is rebased over only if it touched nothing these
          # products derive from. Otherwise the render is of a tree that no longer exists, and
          # F07-T33: rather than ask for hands (five merges' records were lost waiting for them,
          # #145's attestation among them), this job dispatches its own replay, which renders
          # main as it then is; the merge actor waits for that run like any post-merge job.
          # F07-T45: unless what moved main credits these merges already, or is a later merge:
          # that push's post-merge run records every merge since the last gate commit, and this
          # one's commit never landed, so these are among them. A replay is never left to it.
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          remote="git@github.com:${GITHUB_REPOSITORY}.git"
          rendered_from="$(git rev-parse HEAD~1)"
          pushed=""
          for attempt in 1 2 3; do
            if git push "$remote" HEAD:main; then pushed=yes; break; fi
            git fetch "$remote" main
            moved="$(git diff --name-only "$rendered_from" FETCH_HEAD -- targets attestations frontier.json info.json claims.json ledger | head -5)"
            if [ -n "$moved" ]; then
              rm -f "$RUNNER_TEMP/deploy_key"
              owed=""
              for n in $NUMBERS; do
                python3 "$helper" credited FETCH_HEAD "$n" || owed="$owed $n"
              done
              if [ -z "$owed" ]; then
                echo "postmerge: main moved under this job, and a gate commit there records #${NUMBERS// / #} already"
                replay_owed FETCH_HEAD "$REPLAY"
              elif [ "$GITHUB_EVENT_NAME" = "push" ] \
                && python3 "$helper" later-merge "$rendered_from" FETCH_HEAD; then
                echo "::notice::main moved under this job by a later merge; the post-merge run of that push records${owed// / #} with its own (F07-T45)"
              else
                echo "::warning::PR$owed: main moved under the post-merge job and touched what its products derive from ($moved); dispatching replays"
                replay_owed FETCH_HEAD "$owed $REPLAY"
              fi
              exit 0
            fi
            echo "postmerge: main moved (attempt $attempt) without touching the products' inputs; rebasing"
            git rebase FETCH_HEAD
          done
          if [ -z "$pushed" ]; then
            echo "::error::PR #${NUMBERS// / #}: the products commit could not be pushed after three attempts"; exit 1
          fi
          replay_owed HEAD "$REPLAY"

      # F04-R12 (F04-Q10): ask the network repo's site-deploy to render what main now holds, so a
      # merge reaches the site in seconds instead of on GitHub's best-effort schedule. Skipped for
      # the bot's own `gate: #N pass` commit, whose merge already dispatched it; a direct push to
      # main (a re-pin, a workflow change) dispatches too. The token is a fine-grained token on the
      # network repository with Actions: read and write and nothing else (C8). Without it, or if
      # the dispatch fails, the five-minute schedule deploys and this job does not fail (C7).
      - name: Ask the site to deploy this commit
        if: github.event.head_commit.author.name != 'opn-gate'
        env:
          GH_TOKEN: ${{ secrets.OPN_SITE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if [ -z "$GH_TOKEN" ]; then
            echo "site: OPN_SITE_DEPLOY_TOKEN is not set; the schedule deploys $commit"; exit 0
          fi
          gh workflow run site-deploy.yml --repo thisisanameforsure/open_proof_network --ref main \
            -f graph_commit="$commit" \
            && echo "site: dispatched site-deploy for $commit" \
            || echo "::warning::site-deploy was not dispatched for $commit; the schedule deploys (C7)"

      # F07-T32: wake the merge actor now, however this job ended. Its own wake is this run
      # completing, which the host reported eight minutes after #147's post-merge jobs had ended on
      # 2026-09-23; a failed job (#145) woke nothing at all. `workflow_dispatch` is the one event
      # this job's own token may start a run with.
      - name: Wake the merge actor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run merge.yml --repo "$GITHUB_REPOSITORY" --ref main \
            && echo "dispatched the merge actor" \
            || echo "::warning::the merge actor was not dispatched; its gate wake and cron remain"
