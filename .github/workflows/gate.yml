# The gate (D-4, D-35): the only thing with authority to say a proof counts.
#
# Jobs that never share a secret:
#   gate       on every pull request — checks out the `network` commit
#              this graph pins in its gate-spec.json, asks that pinned gate what the diff *is*
#              (F07-R3, F08-R2, R8: proof, partial, append, explainer, proposal or curator) and
#              then does what that mode needs. A proof or a partial runs steps 1, 2 and 4 to 8
#              inside the step-3 sandbox. A proposal — one new node directory, or a witness for
#              a hole's empty slot — runs F08-R1's admission inside the same sandbox and needs no
#              review (D-29: nobody approves structure). An append or an explainer gets the path
#              and schema checks the classifier itself runs and no Lean build at all (F07-R9,
#              R10) — unless it carries a Lean exhibit (a revision request or a defect claim,
#              F08-R6, R7), which elaborates in the sandbox or fails the pull request. A
#              curator record is classified the same way, its author checked against
#              curators.json (F08-R8), and reviewed by a second listed identity when there is
#              one. No secret, no write permission (C8). Its check status is what the main
#              ruleset requires. It no longer asks for a review: it exports what step 9 needs.
#   step 9     after the gate job, on the same pull request run (F07-T8, D-4's order): step 9 is a
#              property of the statement (v3.11) — the tutorial node needs no review; a node under a
#              root with no certificate or registry provenance needs a non-author approving review,
#              and this job stays red until one exists. It reads the reviews and nothing else
#              (pull-requests: read). A submitted or dismissed review re-runs this job in place
#              through step9-refresh.yml, so the build is never repeated and no stale red run is
#              left on the pull request. The ruleset requires this job's check by its exact name.
#   postmerge  on every push to main — if the commit merged a pull request that touched a target,
#              classifies the merged diff with the pinned gate, and for the modes that build a
#              proof (proof, partial) re-derives the verdict on the merge commit, records what
#              satisfied step 9 (the `review` block) and signs the attestation with the gate key
#              (in a step of its own). For every merged mode it then refreshes claims.json from
#              the service if one is configured (F05-R10; the committed snapshot stands when it
#              is not reachable), regenerates the merge products (frontier.json, info.json,
#              targets/index.json, every graph.json and each node's META status — F03, D-25,
#              D-35; a merged proposal enters the frontier here, F08-R13) and commits them all,
#              with the attestation when there is one, in one commit `gate: #<pr> <verdict>`,
#              pushing with a write deploy key (the main ruleset lets deploy keys bypass the
#              review requirement; nothing else does). A proof that used native_decide under a
#              waiver (F02) is attested only if an approving review's body contains the line
#              `waiver: native_decide`; the approvals' bodies are handed to the gate for that
#              check. F07-T45: one run records every merge that has no gate commit yet. The merge
#              actor merges appends in batches, so a run that finds a later merge on main leaves
#              its merge to that push's run, and the run at the head records the batch (appends
#              pinned to one gate) in one commit `gate: #A #B #C pass`: each merge classified on
#              its own diff, one ledger call each in order, the products once. Anything else it
#              finds unrecorded — a building merge, another pin, a diff the gate refuses — is
#              replayed on its own after it commits, never dropped. F07-T55: only an append leaves
#              its merge to a later run; a building merge records itself, and a plan leaves one
#              whose run is still going to that run. Nothing waits for this job any more (the merge
#              actor, F07-T56), so main often moves before it pushes: it then catches up — drops
#              what a gate commit on main already credits, lays its own record (record.patch) on
#              main as it is, writes the ledger lines again and renders the products of that tree
#              — and pushes again, so one commit carries the products of every merge so far.
#   cache      F07-T57: after postmerge, for a merge that built and passed, builds and uploads the
#              olean cache (F10-R7). It used to run inside postmerge, before the commit, on every
#              merge: four to seven of a job's five to eight minutes.
#   outline    F19-T4: after postmerge, for the same merges, extracts the outline of every merged
#              proof artifact of the target that has none (F19-R1, R5, R6) in the step-3 sandbox
#              with no secret, and pushes them as a commit of their own `outline: ...`. Nothing
#              waits for it; a failed or lost run costs outlines the next run or the backfill makes.
#
# The pinned `network` commit is read from targets/<target>/gate-spec.json (network_commit).
# Every field this file reads from the classifier is read with a default, and the pull request's
# author reaches the classifier as OPN_PR_AUTHOR rather than as a flag, so the file works on a
# pin that predates F08 and the F08 behaviour switches on with the re-pin (F08-Q8).
name: gate
# F07-T58: a replay's run says which merge it replays, so a replay that is dispatched again (a merge
# no gate commit names yet) can be told from the first in the run list. Every other run keeps the
# host's own name: a run-name that is only whitespace falls back to it.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('gate: replay of #{0}', inputs.replay_pr) || ' ' }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # F07-T33: replay the post-merge job for one merged pull request whose job was lost, from main
  # as it now is. A job that finds main moved under it dispatches this itself; the owner may too.
  workflow_dispatch:
    inputs:
      replay_pr:
        description: "the merged pull request whose post-merge job to replay"
        required: true
        type: string

permissions: {}

env:
  UV_VERSION: "0.12.10"

jobs:
  gate:
    name: gate (steps 1, 2 and 4-8 in the sandbox)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # F07-T8: the step-9 job has no checkout, so everything it needs comes out of this job.
    outputs:
      needs_review: ${{ steps.classify.outputs.needs_review }}
      tutorial: ${{ steps.classify.outputs.tutorial }}
      reviewers: ${{ steps.classify.outputs.reviewers }}
    steps:
      - name: Check out the graph at the pull request's merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      # Which target, and so which `network` commit — the only thing this shell decides. It
      # cannot ask the gate, because the gate is the pinned commit it is about to check out.
      # What the diff *is* (F07-R3) is decided by that pinned gate, one step below.
      - name: Find the target this pull request touches and the network commit it pins
        id: pin
        env:
          OPN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}  # F07-T61: never interpolated
        run: |
          set -euo pipefail
          # The diff base is the first parent of the merge ref checked out above, which GitHub
          # recomputes whenever main moves — never github.event.pull_request.base.sha, which is
          # frozen at the moment the pull request was opened. Under the strict up-to-date rule a
          # pull request that is BEHIND diffs against that stale base, so everything merged since
          # reads as part of this submission and the one-target step below refuses it (F11-Q29).
          base="$(git rev-parse HEAD^1)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "gate: diffing from HEAD^1 $base (the base branch tip this merge ref carries)"
          git diff --name-only --no-renames "$base...HEAD" > changed.txt
          target="$(sed -n 's#^targets/\([^/]*\)/.*#\1#p' changed.txt | sort -u)"
          # F07-T61: fail closed. A submission changes files under targets/<id>/ and nothing else
          # (policy.json, F15-R3, is classified by the pinned gate below). Anything else — a
          # workflow, curators.json, a key, a schema, a product — is not a submission: the check
          # fails, unless the author is a curator listed in curators.json *as the base has it* (a
          # pull request cannot list itself), whose such pull request is review only, as before.
          outside="$(grep -Ev '^(targets/[^/]+/.+|policy\.json)$' changed.txt || true)"
          if [ -n "$outside" ]; then
            if git show "$base:curators.json" 2>/dev/null | python3 -c '
          import json, sys
          author = sys.argv[1]
          listed = {i.get("github_login") for i in json.load(sys.stdin).get("identities") or []}
          sys.exit(0 if author and author in listed else 1)' "${OPN_PR_AUTHOR:-}"; then
              curator=true
            else
              curator=false
            fi
            if [ "$curator" != "true" ]; then
              echo "::error::not a submission: this pull request changes files outside targets/<id>/ and policy.json, and its author is not a curator listed on the base (F07-T61):"
              printf '%s\n' "$outside"
              exit 1
            fi
            if [ -z "$target" ]; then
              echo "gate: a listed curator's pull request touches no target; nothing to gate (review only)"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          # F15-R3 (Q2): policy.json is the steward rule's switch, a curator's pull request that
          # touches no target. It is gated all the same — classified as a curator record by the
          # pinned gate — so its pin is taken from any target's on the base (every target agrees on
          # one, or the pin step of a target's own pull request would already have refused).
          if [ -z "$target" ] && grep -qx 'policy.json' changed.txt; then
            target="$(git ls-tree --name-only "$base" targets/ | sed -n 's#^targets/##p' | while read -r t; do
              git cat-file -e "$base:targets/$t/gate-spec.json" 2>/dev/null && { echo "$t"; break; }; done || true)"
            echo "gate: policy.json changed; taking the network pin from targets/$target on the base"
          fi
          if [ -z "$target" ]; then
            echo "gate: nothing under targets/ changed; nothing to gate"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$target" | wc -l)" -ne 1 ]; then
            echo "gate: a submission touches exactly one target (D-2, D-3); found:"; cat changed.txt; exit 1
          fi
          # F07-T61: the pin is the base's, never the pull request's own: a submission that rewrites
          # its target's gate-spec.json does not choose the gate that judges it (D-4). A new target
          # has no gate-spec.json on the base, and is gated by the pin the base's targets carry.
          spec="$base:targets/$target/gate-spec.json"
          if ! git cat-file -e "$spec" 2>/dev/null; then
            other="$(git ls-tree --name-only "$base" targets/ | sed -n 's#^targets/##p' | while read -r t; do
              git cat-file -e "$base:targets/$t/gate-spec.json" 2>/dev/null && { echo "$t"; break; }; done || true)"
            if [ -z "$other" ]; then
              echo "::error::targets/$target is new and the base carries no target's pin to gate it with"; exit 1
            fi
            echo "gate: targets/$target is new; taking the network pin from targets/$other on the base"
            spec="$base:targets/$other/gate-spec.json"
          fi
          pin="$(git show "$spec" | python3 -c "import json,sys; print(json.load(sys.stdin)['network_commit'])")"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "gate: target $target; network pin $pin (from the base)"

      - name: Check out the pinned network commit
        if: steps.pin.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ steps.pin.outputs.pin }}
          path: network
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.pin.outputs.run == 'true'
        with:
          version: ${{ env.UV_VERSION }}

      # F07-R3: exactly one mode, decided from the touched paths by the pinned gate rather than
      # by this file — so the rule travels with the commit the graph pins (D-35), and a
      # submitter cannot choose which checks run by mislabelling the PR body (F07-Q9).
      # An append or an explainer is *finished* here: R9 and R10 give them the path and schema
      # checks and no Lean build at all, so `needs_gate` is false and the sandbox never starts.
      # A proposal's shape is checked here too, so a malformed one never costs a sandbox
      # (F08-R2); its admission is the step after step 9. A curator record's author is checked
      # against curators.json here (F08-R8) — the author is the one fact the host supplies.
      # A non-zero exit is the refusal — a PR fitting no mode, or one whose records fail their
      # schema — and it fails this job, which is the check the ruleset requires.
      - name: Classify the pull request and check what needs no sandbox
        id: classify
        if: steps.pin.outputs.run == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
          OPN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          uv sync --frozen --project network --quiet
          uv run --frozen --project network python -m opn_gate.cli classify \
            --graph . --base "$BASE" --head HEAD | tee classification.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          doc = json.loads(pathlib.Path("classification.json").read_text())
          for key, default in (("mode", None), ("node", None), ("needs_gate", False),
                               ("needs_review", False), ("needs_admission", False), ("admit", None),
                               ("needs_exhibits", False), ("needs_qa_rerun", False),
                               ("reviewers", None)):
              value = doc.get(key, default)
              print(f"{key}={json.dumps(value) if isinstance(value, (bool, list)) else (value or '')}")
          PY
          node="$(python3 -c "import json;print(json.load(open('classification.json')).get('node') or '')")"
          tutorial=false
          if [ -n "$node" ] && grep -q '^tutorial: true' "targets/${{ steps.pin.outputs.target }}/nodes/$node/META.yaml"; then
            tutorial=true
          fi
          echo "tutorial=$tutorial" >> "$GITHUB_OUTPUT"

      # F07-T63: the submission block the attestation records (submitter, declared model and tooling,
      # the precheck consumed) is the body this run saw, not whatever the body says when the pull
      # request merges. It comes from this run's own event payload, through the environment, and is
      # kept as an artifact named for the head it was gated at; the post-merge job reads it back.
      - name: Keep the pull request's body as this run saw it (F07-T63; no secret)
        if: steps.pin.outputs.run == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/submission"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/submission/pr-body.md"

      - name: Upload it, named for the pull request and the head it was gated at
        if: steps.pin.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: submission-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/submission/pr-body.md
          if-no-files-found: error
          overwrite: true  # a re-run of this job on the same head saw the same event

      # F08-R2: the mechanical admission of a proposed node — F00's layout, F01's witness and
      # context, F02's hazards, F03's acyclicity and D-30's relation proof, in R1's order —
      # inside the step-3 sandbox, because a statement elaborates arbitrary code too (C9).
      # Nobody reviews the result (D-29). A curator's versioned node is admitted the same way.
      - name: Admit the proposed node inside the step-3 sandbox
        if: steps.classify.outputs.needs_admission == 'true'
        env:
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-out"
          uv run --frozen --project network python -m opn_gate.cli admit \
            "targets/${{ steps.pin.outputs.target }}/nodes/${{ steps.classify.outputs.admit }}" \
            --sandbox --out "$RUNNER_TEMP/gate-out" | tee "$RUNNER_TEMP/admission.txt"

      # F08-R6, R7: a revision request or a defect claim may carry a Lean exhibit. The record
      # merges as an append, but the exhibit is contributor Lean, so it elaborates inside the
      # step-3 sandbox (C9) or the pull request fails naming the file. Nothing else is built.
      - name: Elaborate the exhibits inside the step-3 sandbox
        if: steps.classify.outputs.needs_exhibits == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-out"
          uv run --frozen --project network python -m opn_gate.cli exhibits \
            --graph . --base "$BASE" --head HEAD --sandbox --out "$RUNNER_TEMP/gate-out" \
            | tee "$RUNNER_TEMP/exhibits.txt"

      # F12-T8 (finding D3): a clean screen and a compile leave no exhibit (F12-Q15), so a QA
      # record's `pass` rows read the same typed as run. The pinned gate re-runs, inside the step-3
      # sandbox on the tree at head, every compile and soundness screen the record says passed
      # without an exhibit, and fails the pull request naming each row the re-run does not also
      # pass. Brief and back-translation rows ask a model, and this job holds no key (C8): they
      # are listed as not re-run. No secret, no write permission. Inert on a pin that predates the
      # command: `needs_qa_rerun` then reads false and the step is skipped (F08-Q8's shape).
      - name: Re-run the screens a QA record claims inside the step-3 sandbox
        if: steps.classify.outputs.needs_qa_rerun == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-out"
          uv run --frozen --project network python -m opn_gate.cli qa-rerun \
            --graph . --base "$BASE" --head HEAD --sandbox --out "$RUNNER_TEMP/gate-out/qa-rerun" \
            | tee "$RUNNER_TEMP/qa-rerun.txt"

      - name: Run the gate
        if: steps.classify.outputs.needs_gate == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
          PR_BODY: ${{ github.event.pull_request.body }}
          OPN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OPN_RUNNER: hosted
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          uv run --frozen --project network python -m opn_gate.cli gate \
            --graph . --base "$BASE" --head HEAD \
            --target "${{ steps.pin.outputs.target }}" --node "${{ steps.classify.outputs.node }}" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" --out "$RUNNER_TEMP/gate-out" \
            | tee "$RUNNER_TEMP/verdict.txt"

      - name: Keep the verdict and attestation
        if: always() && (steps.classify.outputs.needs_gate == 'true' || steps.classify.outputs.needs_admission == 'true' || steps.classify.outputs.needs_exhibits == 'true' || steps.classify.outputs.needs_qa_rerun == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gate-out/*.json
            ${{ runner.temp }}/gate-out/qa-rerun/qa-rerun.json
          if-no-files-found: ignore

  # D-4 step 9 after steps 1-8 (F07-T8). For a proof or a partial any non-author may approve. For a
  # curator record the approver must be another listed curator (F08-R8; D-21's separation): the
  # classifier names who is eligible, and names nobody when the founder is the only curator — then
  # `needs_review` is false and the waiver is in the gate job's classification (D-22, F08-Q9).
  # Skipped (which reports as success) when no review is asked; blocked behind a failing gate job.
  step9:
    name: step 9 (a non-author approving review)
    needs: gate
    if: needs.gate.outputs.needs_review == 'true' && needs.gate.outputs.tutorial != 'true'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: A non-author approving review, unless the statement is certified
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWERS: ${{ needs.gate.outputs.reviewers }}
        run: |
          set -euo pipefail
          # F00 knows no certificates or registry provenance yet (F11 records them); every
          # non-tutorial node therefore needs the pr-approval form of step 9 for now.
          reviewer="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/reviews" | python3 -c "
          import json, os, sys
          author = sys.argv[1]
          raw = os.environ.get('REVIEWERS') or ''
          eligible = json.loads(raw) if raw else None
          ok = [r for r in json.load(sys.stdin) if r['state'] == 'APPROVED' and r['user']['login'] != author
                and (eligible is None or r['user']['login'] in eligible)]
          ok.sort(key=lambda r: r['submitted_at'])
          print(ok[-1]['user']['login'] if ok else '')" "$AUTHOR")"
          if [ -z "$reviewer" ]; then
            msg="step 9: this node's root has no fidelity certificate or registry provenance, so a non-author approving review is required before merge (D-4 v3.11; a curator record needs another listed curator's, F08-R8). Approving re-runs this check; the build above is not repeated."
            echo "::error::$msg"
            printf '### Step 9 — waiting for a review\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "gate: step 9 satisfied by approving review from $reviewer"
          printf '### Step 9 — satisfied\n\nApproved by @%s (D-4 step 9).\n' "$reviewer" >> "$GITHUB_STEP_SUMMARY"

  postmerge:
    name: postmerge (step 9 record, gate signature, attestation commit)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      actions: write  # F07-T32: dispatch the merge actor when this job ends
    # F07-T57: what the cache job needs, once this job's record is pushed
    outputs:
      cache: ${{ steps.classify.outputs.needs_gate == 'true' && steps.products.outputs.verdict == 'pass' }}
      merge: ${{ steps.pr.outputs.merge }}
      targets: ${{ steps.pr.outputs.targets || steps.pr.outputs.target }}
      render_pin: ${{ steps.pr.outputs.render_pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Find the merged pull request, its author and the target it touched
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_PR: ${{ inputs.replay_pr }}
          PUSH_BEFORE: ${{ github.event.before }}  # F07-T60: the push's range, for a re-pin
        run: |
          set -euo pipefail
          # F07-T45: which merges this run records, and the gate-commit matcher, as one program the
          # network repo's tests run as it stands (test_finding_postmerge_batch.py).
          helper="$RUNNER_TEMP/postmerge_batch.py"
          replay=""
          gh_api() {  # F22-T20: under a burst of merges the host has answered with an empty body
            local out attempt
            for attempt in 1 2 3 4 5; do
              if out="$(gh api "$@")" && [ -n "$out" ]; then printf '%s' "$out"; return 0; fi
              echo "::warning::gh api $1 answered nothing (attempt $attempt of 5)" >&2
              sleep "$(( ${OPN_GH_RETRY_SLEEP:-2} * attempt ))"
            done
            return 1
          }
          dispatch_replays() {  # F07-T45: merges this run cannot record, each replayed on its own
            for n in $replay; do
              if python3 "$helper" credited HEAD "$n"; then continue; fi
              gh workflow run gate.yml --repo "$GITHUB_REPOSITORY" --ref main -f replay_pr="$n" \
                && echo "postmerge: dispatched a replay of #$n" \
                || echo "::warning::a replay of #$n was not dispatched; dispatch gate.yml with replay_pr=$n"
            done
          }
          cat > "$helper" <<'PY'
          """Which merges this post-merge run records (F07-T45). Pure functions over the first-parent
          history of main, so the network repo's tests run this file as it stands; the commands at the
          bottom read that history with git and nothing else (no network, no secret, no contributor code).

          One run records every merge that has no `gate:` commit yet, not only its own: the merge actor
          merges a batch of appends in one go, so the runs of the earlier ones find a later merge on main
          and leave their merges to it (`later-merge`), and the run at the head records them all (`plan`).

          And how a run publishes what it recorded (F07-T55, `publish`): when its push is refused because
          main moved, it catches up on main as it now is instead of handing the merge to a replay."""
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          APPEND_PREFIX = "append/"
          #: How far back a run looks for the last gate commit before it records its own merge alone.
          WALK_LIMIT = 400
          MERGE_RE = re.compile(r"^Merge pull request #([0-9]+) from [^/\s]+/(\S+)$")
          CREDIT_RE = re.compile(r"^gate:((?: #[0-9]+)+)(?: |$)")
          TARGET_RE = re.compile(r"^targets/([^/]+)/")
          SAFE_TARGET_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*$")
          COMMIT_RE = re.compile(r"^[0-9a-f]{40}$")
          #: F07-T55: how many pushes a run makes before it gives up and replays. Each refusal means another
          #: run landed first, and is answered by a catch-up, not by waiting.
          PUBLISH_ATTEMPTS = 6
          #: What a gate commit stages: this run's record and the products (F03, F07-R12, F14-R12).
          STAGED = ("attestations", "frontier.json", "info.json", "targets", "claims.json", "ledger",
                    "THIRD_PARTY_NOTICES.md")
          TAGS_CACHE = ".tags-cache.json"


          def credits(subject):
              """The pull requests a gate commit credits: `gate: #2 #3 pass` is [2, 3], and a number
              inside a longer one is not credited (`gate: #23 pass` credits neither 2 nor 3)."""
              found = CREDIT_RE.match(subject)
              return [int(n) for n in found.group(1).split("#") if n.strip()] if found else []


          def credited(subjects, number):
              return any(number in credits(subject) for subject in subjects)


          def merge_of(subject, parents):
              """(number, branch) for a pull request's merge commit, else None. Only the host writes
              this subject on main's first-parent line; a two-parent commit is required as well."""
              found = MERGE_RE.match(subject) if parents == 2 else None
              return (int(found.group(1)), found.group(2)) if found else None


          def uncredited(log):
              """The merges in the walk window (the last WALK_LIMIT commits of `log`) that no gate
              commit in the window credits, oldest first, as (number, sha, branch). `log` is (sha,
              parents, subject) along the first-parent line, newest first. None when the window holds
              no gate commit at all: the run then records its own merge alone, as before.

              F07-T58: a merge counts as recorded only if some gate commit names it. The walk used to
              stop at the first gate commit that was not a replay, on the ground that its tree held
              every merge before it and so it credited them or dispatched their replays. A catch-up
              commit (F07-T55) breaks that: it is laid on main as it is, on top of merges it does not
              credit, and so does a single run's own commit and an append's run that left its merge to
              a later run (T45). So every gate commit in the window is read, replays included, and
              what none of them names is owed."""
              window = log[:WALK_LIMIT]
              named, found, gates = set(), [], 0
              for sha, parents, subject in window:
                  numbers = credits(subject)
                  if numbers:
                      named.update(numbers)
                      gates += 1
                      continue
                  merge = merge_of(subject, parents)
                  if merge:
                      found.append((merge[0], sha, merge[1]))
              if not gates:
                  return None
              return [merge for merge in reversed(found) if merge[0] not in named]


          def later_merge(log):
              """Whether a pull request merged on this stretch of main's first-parent line: its push has
              a post-merge run of its own, and that run covers everything this one would have."""
              return any(merge_of(subject, parents) for _sha, parents, subject in log)


          def plan(merge, own, *, log, targets_of, pin_of, in_flight=lambda sha: False):
              """What this run records, as output lines. `batch=false`: its own merge alone, exactly as
              before, and `replay` the other uncredited merges, each dispatched to a replay of its own
              after this run commits. `batch=true`: every uncredited merge in `numbers`, in order.

              A batch is appends only, each touching one target, all pinned to one gate: an append earns
              no attestation, so the run needs one classifier and no signature. A building merge is never
              batched (the actor never batches one; if one is here, a run was lost, and it is replayed on
              its own). A merge the run cannot record is named in `replay`, never dropped.

              F07-T55: a building merge records itself, and since the queue no longer waits for a post-merge
              run, a later merge often lands while that run is still going. Such a merge is left to its own
              run (`in_flight`); only one whose run has ended without crediting it is replayed."""
              found = uncredited(log)
              single = {"batch": "false", "replay": ""}
              if not found or found[-1][:2] != (own, merge):
                  return single
              found = [
                  m for m in found[:-1] if m[2].startswith(APPEND_PREFIX) or not in_flight(m[1])
              ] + found[-1:]
              # a merge that touched no target (a workflow change) has nothing to record and never gets a
              # gate commit; replaying it costs a run that says so (#321, replayed by #361's run)
              found = [m for m in found[:-1] if targets_of(m[1])] + found[-1:]
              others = [number for number, _sha, _branch in found[:-1]]
              if not others:
                  return single
              if any(not branch.startswith(APPEND_PREFIX) for _n, _s, branch in found):
                  return {"batch": "false", "replay": " ".join(map(str, others))}
              records, bad = [], []
              for number, sha, _branch in found:
                  targets = targets_of(sha)
                  if not targets:
                      continue  # touched no target: nothing to record, as before
                  if len(targets) != 1 or not SAFE_TARGET_RE.match(targets[0]):
                      bad.append(number)
                      continue
                  try:
                      pin = pin_of(sha, targets[0])
                  except (KeyError, ValueError, subprocess.CalledProcessError):
                      bad.append(number)
                      continue
                  records.append((number, sha, targets[0], pin))
              if len({record[3] for record in records}) > 1:
                  return {"batch": "false", "replay": " ".join(map(str, others))}
              if [record[0] for record in records] in ([own], []):
                  return {"batch": "false", "replay": " ".join(str(n) for n in bad if n != own)}
              targets = list(dict.fromkeys(record[2] for record in records))
              return {
                  "batch": "true",
                  "numbers": " ".join(str(record[0]) for record in records),
                  "merges": " ".join(record[1] for record in records),
                  "targets": " ".join(targets),
                  "target": records[-1][2],
                  "pin": records[0][3],
                  "replay": " ".join(map(str, bad)),
              }


          def owed(pairs, subjects):
              """F07-T55: the (number, merge) pairs no gate commit on main credits yet. A merge two runs both
              covered (its own, and a later one's batch) is credited by whichever pushes first; the other
              drops it here, so no merge is ever credited twice."""
              return [(number, merge) for number, merge in pairs if not credited(subjects, number)]


          def merged_cache(ours, theirs):
              """A tag cache maps a statement hash to its tags, one answer per hash, so the union loses
              nothing: main's entries stand, and this run's scans are kept rather than paid for again."""
              return {**ours, **theirs}


          def publish(pairs, *, attempts, push, fetch, subjects_of, pin_moved, rebuild, replay, render=False):
              """F07-T55: push this run's gate commit, and while main has moved under it, catch up and push
              again. The products are derived (F03-R11), so a render of a tree that no longer exists is
              thrown away and made again on main as it is; what is this run's own (its record, its ledger
              lines) is laid on that tree first. Answers `pushed`, `credited` (main records every merge
              already), `replayed` (the record does not apply, or a re-pin moved the rendering gate) or
              `gave-up` (refused every time; replayed as well, and the step fails).

              F07-T60: `render` is render.yml's commit, which credits no merge: having nothing owed is not
              the end of it, and it renders again on main as it is until it lands or a re-pin moves the
              gate it renders with."""
              for attempt in range(1, attempts + 1):
                  if push():
                      return "pushed"
                  new = fetch()
                  pairs = owed(pairs, subjects_of(new))
                  if not pairs and not render:
                      return "credited"
                  if pin_moved(new) or not rebuild(new, pairs):
                      replay(pairs)
                      return "replayed"
                  print(f"postmerge: main moved (attempt {attempt}); caught up on {new[:12]}", flush=True)
              replay(pairs)
              return "gave-up"


          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout


          def first_parent_log(rev, limit=None):
              count = [f"-n{limit}"] if limit else []
              rows = []
              for line in git("log", "--first-parent", *count, "--format=%H%x09%P%x09%s", rev).splitlines():
                  sha, parents, subject = line.split("\t", 2)
                  rows.append((sha, len(parents.split()), subject))
              return rows


          def targets_of(sha):
              names = git("diff", "--name-only", f"{sha}^", sha).splitlines()
              return sorted({found.group(1) for found in map(TARGET_RE.match, names) if found})


          def pin_of(sha, target):
              pin = str(json.loads(git("show", f"{sha}:targets/{target}/gate-spec.json"))["network_commit"])
              if not COMMIT_RE.match(pin):
                  raise ValueError(pin)
              return pin


          def in_flight(sha):
              """F07-T55: whether the gate workflow's run for this push is still going, from the host. A host
              that does not answer is read as not in flight: a replay then costs a run, and `owed` keeps
              it from crediting anything twice."""
              path = f"repos/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs?head_sha={sha}&event=push&per_page=20"
              try:
                  out = subprocess.run(["gh", "api", path], check=True, capture_output=True, text=True).stdout
                  runs = [run for run in json.loads(out)["workflow_runs"] if run.get("name") == "gate"]
              except (OSError, subprocess.CalledProcessError, ValueError, KeyError, TypeError):
                  return False
              return any(run.get("status") != "completed" for run in runs)


          def subjects_at(rev):
              return [subject for _sha, _p, subject in first_parent_log(rev, WALK_LIMIT + 1)]


          def run_publish(env):
              """The `publish` command: the pairs and commands come from the commit step's environment."""
              remote, record = env["REMOTE"], pathlib.Path(env["RECORD"])
              pairs = list(zip(env["NUMBERS"].split(), env["MERGES"].split(), strict=True))
              pairs = [(int(number), merge) for number, merge in pairs]

              def push():
                  done = subprocess.run(["git", "push", "-q", remote, "HEAD:main"], check=False)
                  return done.returncode == 0

              def fetch():
                  git("fetch", "-q", remote, "main")
                  return git("rev-parse", "FETCH_HEAD").strip()

              def pin_moved(new):
                  for target in env["TARGETS"].split():
                      try:
                          if pin_of(new, target) != env["RENDER_PIN"]:
                              print(f"postmerge: main re-pinned {target}; the products are not this run's to render")
                              return True
                      except (KeyError, ValueError, subprocess.CalledProcessError):
                          return True
                  return False

              def run(command, **extra):
                  subprocess.run(["bash", "-c", command], check=True, env={**os.environ, **extra})

              def rebuild(new, owed_pairs):
                  caches = {
                      path: json.loads(path.read_text(encoding="utf-8"))
                      for path in pathlib.Path("targets").glob(f"*/{TAGS_CACHE}")
                  }
                  git("checkout", "-q", "-f", "--detach", new)
                  if record.is_file() and record.stat().st_size:
                      applied = subprocess.run(
                          ["git", "apply", "--3way", "--index", str(record)], check=False,
                          capture_output=True, text=True,
                      )
                      if applied.returncode != 0:
                          print(f"::warning::this merge's record does not apply on main as it is: {applied.stderr.strip()}")
                          git("reset", "-q", "--hard", new)
                          return False
                  for path, ours in caches.items():
                      theirs = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
                      merged = merged_cache(ours, theirs)
                      if merged != theirs:
                          path.parent.mkdir(parents=True, exist_ok=True)
                          text = json.dumps(merged, sort_keys=True, indent=2, ensure_ascii=False) + "\n"
                          path.write_text(text, encoding="utf-8")
                  for _number, merge in owed_pairs:
                      run(env["LEDGER_CMD"], MERGE=merge)
                  run(env["PRODUCTS_CMD"], COMMIT=new)
                  git("add", "-A", "--", *[p for p in STAGED if pathlib.Path(p).exists()])
                  credits = " ".join(f"#{number}" for number, _merge in owed_pairs)
                  subject = env.get("SUBJECT") or f"gate: {credits} {env['SUFFIX']}"  # F07-T60: a render's
                  git("commit", "-q", "--allow-empty", "-m", subject)
                  return True

              def replay(owed_pairs):
                  for number, _merge in owed_pairs:
                      done = subprocess.run(
                          ["gh", "workflow", "run", "gate.yml", "--repo", env["GITHUB_REPOSITORY"],
                           "--ref", "main", "-f", f"replay_pr={number}"], check=False,
                      )
                      if done.returncode == 0:
                          print(f"postmerge: dispatched a replay of #{number}")
                      else:
                          print(f"::warning::a replay of #{number} was not dispatched; dispatch gate.yml with replay_pr={number}")

              attempts = int(env.get("PUBLISH_ATTEMPTS") or PUBLISH_ATTEMPTS)
              render = bool(env.get("RENDER"))
              outcome = publish(
                  pairs, attempts=attempts, push=push, fetch=fetch, subjects_of=subjects_at,
                  pin_moved=pin_moved, rebuild=rebuild, replay=replay, render=render,
              )
              print(f"postmerge: publish {outcome}")
              if render and outcome == "replayed":
                  print("render: main was re-pinned under this render; that push dispatches a render of its own")
              if outcome == "gave-up":
                  print(f"::error::the gate commit was refused {attempts} times; its merges are replayed")
                  return 1
              return 0


          if __name__ == "__main__":
              command, args = sys.argv[1], sys.argv[2:]
              if command == "credited":  # credited <rev> <number>: exit 0 if a gate commit credits it
                  subjects = [subject for _sha, _p, subject in first_parent_log(args[0])]
                  sys.exit(0 if credited(subjects, int(args[1])) else 1)
              if command == "later-merge":  # later-merge <from> <to>: exit 0 if a merge is in between
                  sys.exit(0 if later_merge(first_parent_log(f"{args[0]}..{args[1]}")) else 1)
              if command == "plan":  # plan <merge> <number>: output lines for this run
                  log = first_parent_log(args[0], WALK_LIMIT + 1)
                  decided = plan(
                      args[0], int(args[1]), log=log, targets_of=targets_of, pin_of=pin_of,
                      in_flight=in_flight,
                  )
                  for key, value in decided.items():
                      print(f"{key}={value}")
                  sys.exit(0)
              if command == "number-of":  # number-of <merge>: the pull request's number, or nothing
                  (sha, parents, subject), = first_parent_log(args[0], 1)
                  found = merge_of(subject, parents)
                  print(found[0] if found else "")
                  sys.exit(0)
              if command == "branch-of":  # branch-of <merge>: the pull request's branch, or nothing
                  (sha, parents, subject), = first_parent_log(args[0], 1)
                  found = merge_of(subject, parents)
                  print(found[1] if found else "")
                  sys.exit(0)
              if command == "publish":  # publish: push the gate commit, catching up while main moves
                  sys.exit(run_publish(os.environ))
              sys.exit(f"unknown command {command!r}")
          PY
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # F07-T33: a replay. The merge commit is the pull request's, not this run's commit
            # (main's head), and every later step reads it from the `merge` output.
            if ! printf '%s' "$REPLAY_PR" | grep -Eq '^[0-9]+$'; then
              echo "::error::replay_pr must be a pull request number, not '$REPLAY_PR'"; exit 1
            fi
            number="$REPLAY_PR"
            pr="$(gh_api "repos/${GITHUB_REPOSITORY}/pulls/${number}")"
            merge="$(printf '%s' "$pr" | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['merge_commit_sha'] if p.get('merged_at') else '')")"
            if [ -z "$merge" ]; then
              echo "::error::PR #$number is not merged; there is no post-merge job to replay"; exit 1
            fi
            # Idempotent: the ledger appends, so a merge that has its commit is never replayed.
            if python3 "$helper" credited HEAD "$number"; then
              echo "postmerge: PR #$number already has its gate commit; nothing to replay"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            author="$(printf '%s' "$pr" | python3 -c "import json,sys; print(json.load(sys.stdin)['user']['login'])")"
            echo "postmerge: replaying PR #$number (merge $merge) on main at ${GITHUB_SHA}"
          else
            merge="$GITHUB_SHA"
            if pulls="$(gh_api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"; then
              number="$(printf '%s' "$pulls" | python3 -c "import json,sys; ps=[p for p in json.load(sys.stdin) if p.get('merged_at')]; print(ps[0]['number'] if ps else '')")"
            else
              # F22-T20: the host never answered; the merge commit's subject names the pull request.
              number="$(python3 "$helper" number-of "$GITHUB_SHA")"
              pulls=""
              [ -n "$number" ] && echo "postmerge: the host did not answer; PR #$number read from the merge subject"
            fi
            if [ -z "$number" ]; then
              echo "postmerge: ${GITHUB_SHA} did not merge a pull request; nothing to record"
              # F07-T60: a re-pin is a direct push, so no merge renders the products under the new
              # gate; render.yml does. Any push that merged nothing and touched a pin (read over the
              # whole push, since the owner may push several commits), never the bot's own commits.
              from="${PUSH_BEFORE:-}"
              if ! printf '%s' "$from" | grep -Eq '^[0-9a-f]{40}$' || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
                from="${GITHUB_SHA}^"
              fi
              if [ "$(git log -1 --format=%an "$GITHUB_SHA")" != "opn-gate" ] \
                && git diff --name-only "$from" "$GITHUB_SHA" | grep -Eq '^targets/[^/]+/gate-spec\.json$'; then
                gh workflow run render.yml --repo "$GITHUB_REPOSITORY" --ref main \
                  && echo "postmerge: a pin changed with no merge; dispatched render.yml (F07-T60)" \
                  || echo "::warning::render.yml was not dispatched; dispatch it by hand so the products follow the pin"
              fi
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ -n "$pulls" ]; then
              author="$(printf '%s' "$pulls" | python3 -c "import json,sys; ps=[p for p in json.load(sys.stdin) if p.get('merged_at')]; print(ps[0]['user']['login'])")"
            else
              author="$(gh_api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.user.login')"
            fi
            # F07-T45 (a): the merge actor merges appends in batches, so main may already hold a
            # later merge. That merge is a push with a post-merge run of its own, which records
            # every merge since the last gate commit, this one included (b); this run renders
            # nothing, so it cannot race that run's push. If main has only moved by a commit that
            # merged nothing (a bot commit, an owner's push), no later run records this merge, and
            # this run records it as before. F07-T55: an append only. A building merge's record is
            # its own re-derive and signature, which a later run would only replay after it had
            # committed, so a building merge always records itself and catches up if main moved.
            # F07-T58: the later run records this append even when a gate commit lands between the
            # two (a catch-up credits only its own merges): a merge is owed until one names it.
            git fetch --quiet origin main
            branch="$(python3 "$helper" branch-of "$merge")"
            if [ "${branch#append/}" != "$branch" ] \
              && git merge-base --is-ancestor "$merge" origin/main \
              && python3 "$helper" later-merge "$merge" origin/main; then
              echo "postmerge: a later pull request merged on main after #$number; the post-merge run of that push records #$number with its own (F07-T45)"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # F07-T45 (b), F07-T58: every merge in the walk window that no gate commit names. Appends
            # pinned to one gate are recorded here together; anything else is replayed on its own
            # after this run commits, and this merge is recorded alone.
            python3 "$helper" plan "$merge" "$number" > "$RUNNER_TEMP/plan.txt"
            cat "$RUNNER_TEMP/plan.txt"
            replay="$(sed -n 's/^replay=//p' "$RUNNER_TEMP/plan.txt")"
            if [ "$(sed -n 's/^batch=//p' "$RUNNER_TEMP/plan.txt")" = "true" ]; then
              numbers="$(sed -n 's/^numbers=//p' "$RUNNER_TEMP/plan.txt")"
              target="$(sed -n 's/^target=//p' "$RUNNER_TEMP/plan.txt")"
              authors=""
              for n in $numbers; do
                authors="$authors $(gh_api "repos/${GITHUB_REPOSITORY}/pulls/$n" --jq '.user.login')"
              done
              render_pin="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['network_commit'])" "targets/$target/gate-spec.json")"
              {
                echo "run=true"; echo "number=$number"; echo "author=$author"; echo "merge=$merge"
                echo "authors=${authors# }"; echo "render_pin=$render_pin"
                grep -E '^(batch|numbers|merges|targets|target|pin|replay)=' "$RUNNER_TEMP/plan.txt"
              } >> "$GITHUB_OUTPUT"
              echo "postmerge: one run records #${numbers// / #}, appends merged in one batch (F07-T45)"
              exit 0
            fi
          fi
          git diff --name-only "${merge}^...${merge}" > changed.txt
          target="$(sed -n 's#^targets/\([^/]*\)/.*#\1#p' changed.txt | sort -u)"
          if [ -z "$target" ] && grep -qx 'policy.json' changed.txt; then
            # F15-R3: the policy switch merged; the products re-derive claimability under it.
            target="$(ls -d targets/*/ 2>/dev/null | head -n 1 | xargs -r basename)"
            echo "postmerge: policy.json changed; taking the network pin from targets/$target"
          fi
          if [ -z "$target" ]; then
            echo "postmerge: PR #$number touched no target; nothing to record"
            dispatch_replays
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$target" | wc -l)" -ne 1 ]; then
            dispatch_replays
            echo "::error::PR #$number touched more than one target (D-2, D-3):"; cat changed.txt; exit 1
          fi
          # F07-T33: the gate that re-derives and attests a merge is the one its own tree pinned (an
          # attestation names that pin, and runs its image); the products, the ledger and the cache
          # are rendered by the pin main carries now. On a push the two are the same commit.
          pin="$(git show "$merge:targets/$target/gate-spec.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['network_commit'])")"
          render_pin="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['network_commit'])" "targets/$target/gate-spec.json")"
          {
            echo "run=true"; echo "number=$number"; echo "author=$author"
            echo "target=$target"; echo "pin=$pin"; echo "merge=$merge"; echo "render_pin=$render_pin"
            echo "replay=$replay"  # F07-T45: dispatched once this run has committed
          } >> "$GITHUB_OUTPUT"
          echo "postmerge: PR #$number by $author; target $target; pin $pin"

      - name: Check out the pinned network commit
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ steps.pr.outputs.pin }}
          path: network
          persist-credentials: false

      - name: Check out the network commit main pins now, which renders (F07-T33)
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ steps.pr.outputs.render_pin }}
          path: network-render
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.pr.outputs.run == 'true'
        with:
          version: ${{ env.UV_VERSION }}

      # The same classifier the gate job ran, over the merged diff: only the modes that build a
      # proof have a verdict to re-derive and attest; every other merge goes straight to the
      # products (F07-R9, F08-R13). A merged diff the pinned gate refuses fails the job here,
      # visibly — it can only have arrived by a bypass (C7).
      - name: Classify the merged diff with the pinned gate
        id: classify
        if: steps.pr.outputs.run == 'true'
        env:
          OPN_PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PYTHONPATH: network/gate
          MERGE: ${{ steps.pr.outputs.merge }}
          NUMBER: ${{ steps.pr.outputs.number }}
          BATCH: ${{ steps.pr.outputs.batch }}
          NUMBERS: ${{ steps.pr.outputs.numbers }}
          MERGES: ${{ steps.pr.outputs.merges }}
          AUTHORS: ${{ steps.pr.outputs.authors }}
          REPLAY: ${{ steps.pr.outputs.replay }}
        run: |
          set -euo pipefail
          uv sync --frozen --project network --quiet
          if [ "$BATCH" != "true" ]; then
            uv run --frozen --project network python -m opn_gate.cli classify \
              --graph . --base "${MERGE}^" --head "$MERGE" | tee classification.json
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          doc = json.loads(pathlib.Path("classification.json").read_text())
          for key, default in (("mode", None), ("node", None), ("needs_gate", False),
                               ("needs_review", False), ("needs_admission", False), ("admit", None),
                               ("review_kind", None), ("review_reference", None)):
              value = doc.get(key, default)
              print(f"{key}={json.dumps(value) if isinstance(value, bool) else (value or '')}")
          PY
            { echo "numbers=$NUMBER"; echo "merges=$MERGE"; echo "replay=$REPLAY"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # F07-T45: a batch of appends, each merge classified on its own diff against its first
          # parent with the pinned gate, exactly as a single merge is. One the gate refuses, or one
          # that builds after all, is left out of the batch and replayed on its own, where it fails
          # visibly (C7) — never recorded here, and never allowed to block the rest.
          read -r -a numbers <<< "$NUMBERS"
          read -r -a merges <<< "$MERGES"
          read -r -a authors <<< "$AUTHORS"
          if [ "${#numbers[@]}" -ne "${#merges[@]}" ] || [ "${#numbers[@]}" -ne "${#authors[@]}" ]; then
            echo "::error::a batch of ${#numbers[@]} numbers, ${#merges[@]} merges, ${#authors[@]} authors"; exit 1
          fi
          kept=(); kept_merges=(); replay="$REPLAY"
          for i in "${!numbers[@]}"; do
            n="${numbers[$i]}"; m="${merges[$i]}"
            out="$RUNNER_TEMP/classification-$n.json"
            if OPN_PR_AUTHOR="${authors[$i]}" uv run --frozen --project network python -m opn_gate.cli classify \
                --graph . --base "${m}^" --head "$m" > "$out" \
              && python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(1 if d.get("needs_gate") or d.get("needs_review") else 0)' "$out"; then
              kept+=("$n"); kept_merges+=("$m")
            else
              cat "$out" || true
              echo "::warning::PR #$n: the pinned gate refused its merged diff, or it needs a gate run or a review; left out of this batch and replayed on its own"
              replay="$replay $n"
            fi
          done
          {
            echo "mode=append"; echo "node="; echo "needs_gate=false"; echo "needs_review=false"
            echo "needs_admission=false"; echo "admit="; echo "review_kind="; echo "review_reference="
            echo "numbers=${kept[*]:-}"; echo "merges=${kept_merges[*]:-}"; echo "replay=${replay# }"
          } >> "$GITHUB_OUTPUT"
          echo "postmerge: the batch records #${kept[*]:-}; replayed on their own:${replay:- none}"

      # D-4 v3.11 (F07-T17, Mike 2026-09-14): step 9 is a property of the statement. A root certified
      # at screened-and-signed or above, or inherited from a D-10 registry with provenance recorded,
      # satisfies it with no person; the pinned gate says which in review_kind and review_reference,
      # and the attestation names that instead of a reviewer. Otherwise a non-author approving review
      # is required, as before. Runs for every building merge, since a certified one asks no review,
      # and for every merge that asked one (a curator record), so a bypass still fails here (C7).
      # The reviews are read in every case: a waived proof is attested only if an approving review
      # names the waiver (F02-R9), and a reviewer may still leave one where nobody had to. On a pin
      # that predates F07-T17 review_kind is empty and needs_review decides, exactly as before.
      # v3.20 (F07-T24): the review is asked only of a proof that settles the target's root, and
      # never on a calibration target; for everything else review_kind says why nobody was asked.
      - name: Record what satisfied step 9
        id: review
        if: steps.classify.outputs.needs_gate == 'true' || steps.classify.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          TARGET: ${{ steps.pr.outputs.target }}
          NODE: ${{ steps.classify.outputs.node }}
          NEEDS_REVIEW: ${{ steps.classify.outputs.needs_review }}
          REVIEW_KIND: ${{ steps.classify.outputs.review_kind }}
          REVIEW_REFERENCE: ${{ steps.classify.outputs.review_reference }}
          MODE: ${{ steps.classify.outputs.mode }}
        run: |
          set -euo pipefail
          reviews="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/reviews")"
          mkdir -p "$RUNNER_TEMP/approvals"
          reviewer="$(printf '%s' "$reviews" | python3 -c "
          import json, sys, pathlib
          author, out = sys.argv[1], pathlib.Path(sys.argv[2])
          eligible = json.loads(pathlib.Path('classification.json').read_text()).get('reviewers')
          ok = [r for r in json.load(sys.stdin) if r['state'] == 'APPROVED' and r['user']['login'] != author
                and (eligible is None or r['user']['login'] in eligible)]
          ok.sort(key=lambda r: r['submitted_at'])
          for i, r in enumerate(ok):  # bodies for the native_decide waiver check (F02-R9)
              (out / f'{i:03d}.md').write_text(r.get('body') or '', encoding='utf-8')
          print(ok[-1]['user']['login'] if ok else '')" "$AUTHOR" "$RUNNER_TEMP/approvals")"
          reference=""
          if [ -n "$NODE" ] && grep -q '^tutorial: true' "targets/$TARGET/nodes/$NODE/META.yaml"; then
            kind=tutorial; reviewer=""
          elif [ "$REVIEW_KIND" = "certificate" ] || [ "$REVIEW_KIND" = "provenance" ]; then
            if [ -z "$REVIEW_REFERENCE" ]; then
              echo "::error::PR #$NUMBER: the pinned gate says step 9 is satisfied by $REVIEW_KIND but names no reference"; exit 1
            fi
            kind="$REVIEW_KIND"; reference="$REVIEW_REFERENCE"; reviewer=""
          elif [ "$REVIEW_KIND" = "intermediate" ] || [ "$REVIEW_KIND" = "calibration" ]; then
            # D-4 v3.20 (F07-T24): step 9 was not asked at all — the artifact settles no root, or
            # the target is a known result — and the attestation says which, naming nobody, even
            # if someone approved anyway. A pin that predates v3.20 never emits these (F08-Q8).
            kind="$REVIEW_KIND"; reviewer=""
          elif [ "$MODE" = "alternate" ]; then
            # F07-T38: an alternate is never asked (D-4 v3.13) and says why, as v3.20's words do. A
            # pin whose classifier gives it no kind (every pin before network 0b474b9, and so every
            # replay of an older merge, F07-T33) would otherwise pass --review-kind "" and die.
            if grep -q '^calibration: true' "targets/$TARGET/target.yaml" 2>/dev/null; then
              kind=calibration
            else
              kind=intermediate
            fi
            reviewer=""
          elif [ -n "$reviewer" ]; then
            kind=pr-approval
          elif [ "$NEEDS_REVIEW" != "true" ]; then
            # No review asked and no basis named (an alternate, D-4 v3.13): nothing to record here.
            kind=""
          else
            echo "::error::PR #$NUMBER merged without a non-author approving review and its statement carries no certificate or provenance (D-4 step 9, v3.11)"; exit 1
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "reviewer=$reviewer" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "postmerge: step 9 = ${kind:-not asked} ${reviewer:+by $reviewer}${reference:+ ($reference)}"

      # F07-T14: every merged pull request's body, so the attestation records the submission block
      # (submitter, declared model and tooling) and the precheck it consumed. F07-R6 (F11-T4): a
      # merged partial's holes become child nodes, written into this checkout for the bot commit
      # below to carry, and the assembly is filed under attempts/ for the pseudonym the block names.
      # Only a partial is handed --apply-partial — an older pin never merged a partial (F08-Q8).
      # F07-T63: the body the gate job kept for the head that merged (the newest gate run on it, an
      # expired artifact never), and the body as it reads now only when there is none — a merge gated
      # before this change, or an artifact past its retention — with a warning that says so.
      - name: Fetch the merged pull request's body as the gate saw it (the submission block names the proposer)
        if: steps.pr.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}")"
          head="$(printf '%s' "$pr" | python3 -c "import json,sys; print(json.load(sys.stdin)['head']['sha'])")"
          name="submission-${NUMBER}-${head}"
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | python3 -c "
          import json, sys
          kept = [a for a in json.load(sys.stdin).get('artifacts') or [] if not a.get('expired')]
          kept.sort(key=lambda a: a.get('created_at') or '')
          print(kept[-1]['workflow_run']['id'] if kept else '')" || true)"
          dir="$RUNNER_TEMP/submission"
          rm -rf "$dir"
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$dir" \
            && [ -f "$dir/pr-body.md" ]; then
            cp "$dir/pr-body.md" "$RUNNER_TEMP/pr-body.md"
            echo "postmerge: PR #$NUMBER's submission block as the gate saw it at ${head:0:12} (run $run_id)"
          else
            echo "::warning::PR #$NUMBER: the gate kept no body for ${head:0:12} (gated before F07-T63, or the artifact expired); recording the body as it reads now"
            printf '%s' "$pr" | python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin).get('body') or '')" \
              > "$RUNNER_TEMP/pr-body.md"
          fi

      - name: Re-derive the verdict on the merge commit (no secret in this step)
        if: steps.classify.outputs.needs_gate == 'true'
        env:
          OPN_RUNNER: hosted
          OPN_PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PYTHONPATH: network/gate
          MODE: ${{ steps.classify.outputs.mode }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          MERGE: ${{ steps.pr.outputs.merge }}
        run: |
          set -euo pipefail
          approvals=()
          for f in "$RUNNER_TEMP"/approvals/*.md; do
            [ -e "$f" ] && approvals+=(--approval-body-file "$f")
          done
          partial=()
          if [ "$MODE" = "partial" ]; then
            partial=(--apply-partial)
          fi
          uv run --frozen --project network python -m opn_gate.cli postmerge \
            --graph . --commit "$MERGE" --pr "${{ steps.pr.outputs.number }}" \
            --review-kind "${{ steps.review.outputs.kind }}" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" --author "$AUTHOR" \
            ${{ steps.review.outputs.reviewer && format('--reviewer {0}', steps.review.outputs.reviewer) || '' }} \
            ${{ steps.review.outputs.reference && format('--review-reference {0}', steps.review.outputs.reference) || '' }} \
            "${approvals[@]}" "${partial[@]}" \
            --target "${{ steps.pr.outputs.target }}" --node "${{ steps.classify.outputs.node }}" \
            --out "$RUNNER_TEMP/postmerge-out"

      - name: Sign with the gate key (the only step that sees it)
        if: steps.classify.outputs.needs_gate == 'true'
        env:
          OPN_GATE_SIGNING_KEY: ${{ secrets.OPN_GATE_SIGNING_KEY }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          uv run --frozen --project network python -m opn_gate.cli sign \
            --attestation "$RUNNER_TEMP/postmerge-out/attestation.json" \
            --public-key keys/gate.pub \
            --out "attestations/$(printf '%06d' "${{ steps.pr.outputs.number }}").json"

      # F07-T55: what this run wrote that is not a product — the attestation it signed, and the
      # hole children, the parent's Context and the attempts file a partial writes — taken before
      # any product is rendered. If main moves under this run, the commit step lays exactly this on
      # main as it then is and renders the products afresh; nothing derived is carried over.
      - name: Keep this merge's own record, for a catch-up (F07-T55; no secret)
        if: steps.pr.outputs.run == 'true'
        run: |
          set -euo pipefail
          git add -A -- attestations targets
          git diff --cached --binary > "$RUNNER_TEMP/record.patch"
          git reset -q

      - name: Regenerate the merge products from the committed facts (F03; no secret)
        if: steps.pr.outputs.run == 'true'
        id: products
        env:
          PYTHONPATH: network-render/gate
          # F05-R10: the service's claim snapshot. Unset or unreachable, the committed
          # claims.json stands and the merge proceeds (AC16) — never a block on the service.
          OPN_API_CLAIMS_URL: ${{ vars.OPN_API_CLAIMS_URL }}
          NEEDS_GATE: ${{ steps.classify.outputs.needs_gate }}
        run: |
          set -euo pipefail
          # the checkout's own commit: the merge on a push, main's head on a replay (F07-T33)
          uv sync --frozen --project network-render --quiet
          uv run --frozen --project network-render python -m opn_gate.cli products \
            --graph . --commit "$(git rev-parse HEAD)" \
            ${OPN_API_CLAIMS_URL:+--claims-url "$OPN_API_CLAIMS_URL"}
          if [ "$NEEDS_GATE" = "true" ]; then
            verdict="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['verdict'])" \
              "$RUNNER_TEMP/postmerge-out/attestation.json")"
          else
            verdict=pass  # the merged diff passed the pinned classifier's checks, above
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # F07-R12 (T15), F08-R13: what the merge earned — the proof line for a proof or a partial, the
      # attempts line for the first postmortem per route class, the statement line for a variant or
      # a speculative crux; nothing for the tutorial node, an alternate or a curator's own proof.
      # After signing, because it reads this merge's attestation for the declared tooling. The
      # ledger is derived from the merge, so it rides in the same bot commit as the products.
      - name: Write what the merge earned to the ledger (F07-R12, F08-R13; no secret)
        if: steps.pr.outputs.run == 'true'
        env:
          PYTHONPATH: network-render/gate
          MERGES: ${{ steps.classify.outputs.merges }}
        run: |
          set -euo pipefail
          # F07-T45: every merge this run records, oldest first (one, unless a batch of appends)
          for merge in $MERGES; do
            uv run --frozen --project network-render python -m opn_gate.cli ledger \
              --graph . --commit "$merge"
          done

      - name: Commit the attestation and the products (pushed with the write deploy key, which the ruleset lets bypass)
        if: steps.pr.outputs.run == 'true'
        env:
          OPN_GRAPH_DEPLOY_KEY: ${{ secrets.OPN_GRAPH_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}  # F07-T33: only to dispatch a replay if main moved
          # F07-T45: the merges this commit records (one, unless a batch of appends), and the ones
          # this run could not, each replayed on its own once this run is done
          NUMBERS: ${{ steps.classify.outputs.numbers }}
          REPLAY: ${{ steps.classify.outputs.replay }}
          TARGETS: ${{ steps.pr.outputs.targets || steps.pr.outputs.target }}
          MERGES: ${{ steps.classify.outputs.merges }}
          VERDICT: ${{ steps.products.outputs.verdict }}
          RENDER_PIN: ${{ steps.pr.outputs.render_pin }}
          PYTHONPATH: network-render/gate
          OPN_API_CLAIMS_URL: ${{ vars.OPN_API_CLAIMS_URL }}
          LEDGER_CMD: uv run --frozen --project network-render python -m opn_gate.cli ledger --graph . --commit "$MERGE"
          PRODUCTS_CMD: uv run --frozen --project network-render python -m opn_gate.cli products --graph . --commit "$COMMIT" ${OPN_API_CLAIMS_URL:+--claims-url "$OPN_API_CLAIMS_URL"}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/deploy_key"' EXIT  # C8: on every path out of this step
          helper="$RUNNER_TEMP/postmerge_batch.py"  # written by the first step (F07-T45)
          replay_owed() {  # replay_owed <rev> "<numbers>": each not yet credited on rev, replayed
            for n in $2; do
              if python3 "$helper" credited "$1" "$n"; then continue; fi
              gh workflow run gate.yml --repo "$GITHUB_REPOSITORY" --ref main -f replay_pr="$n" \
                && echo "postmerge: dispatched a replay of #$n" \
                || echo "::warning::a replay of #$n was not dispatched; dispatch gate.yml with replay_pr=$n"
            done
          }
          if [ -z "$NUMBERS" ]; then
            echo "postmerge: nothing in this batch could be recorded here"
            rm -f "$RUNNER_TEMP/deploy_key"; replay_owed HEAD "$REPLAY"; exit 0
          fi
          printf '%s\n' "$OPN_GRAPH_DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          git config user.name "opn-gate"
          git config user.email "gate@openproof.network"
          git add attestations/ frontier.json info.json targets/
          [ -f claims.json ] && git add claims.json
          [ -d ledger ] && git add ledger/
          [ -f THIRD_PARTY_NOTICES.md ] && git add THIRD_PARTY_NOTICES.md  # F14-R12: a merge product
          if git diff --cached --quiet; then
            echo "postmerge: PR #${NUMBERS// / #} changed no product; nothing to commit"
            rm -f "$RUNNER_TEMP/deploy_key"; replay_owed HEAD "$REPLAY"; exit 0
          fi
          # F15-R12 (D-32 v3.17): mention each active steward of the target in the bot commit, so
          # they hear on GitHub whenever anything merges on it. The pinned gate lists them and
          # validates every login against GitHub's grammar; a pin that predates the command answers
          # nothing and the message is exactly as before (F08-Q8's shape). A batch mentions the
          # stewards of every target it touched (F07-T45).
          mention=""
          for target in $TARGETS; do
            said="$(PYTHONPATH=network-render/gate uv run --frozen --project network-render python -m opn_gate.cli stewards \
              --graph . --target "$target" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("mention", ""))' 2>/dev/null || true)"
            case "$mention" in *"$said"*) ;; *) mention="$mention$said" ;; esac
          done
          replayed=""
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && replayed=" (replayed)"
          credits="$(printf '#%s ' $NUMBERS)"; credits="${credits% }"  # F07-T45: `#A #B #C`
          git commit -m "gate: ${credits} ${VERDICT}${replayed}${mention}"
          # F07-T55: this push happens minutes after the merge it renders, and since the queue no
          # longer waits for this job, main has often moved by then: another merge, another run's
          # gate commit, an owner's re-pin. A refused push used to dispatch a replay (F07-T33) or
          # leave the merges to a later run (F07-T45); now the job catches up. `publish` fetches
          # main, drops whatever a gate commit there already credits, lays this merge's own record
          # (record.patch) on main as it is, writes the ledger lines again on main's ledger, renders
          # the products of that tree and pushes again — so one commit carries the products of
          # every merge so far. A record that does not apply, or a re-pin of the rendering gate, is
          # replayed on its own; a push refused every time replays too, and fails this step (C7).
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          remote="git@github.com:${GITHUB_REPOSITORY}.git"
          status=0
          REMOTE="$remote" RECORD="$RUNNER_TEMP/record.patch" SUFFIX="${VERDICT}${replayed}${mention}" \
            python3 "$helper" publish || status=$?
          git fetch -q "$remote" main
          # what follows (the site's deploy) reads HEAD: leave it at main as the host has it, never at
          # a commit this run made and did not push
          git checkout -q -f --detach FETCH_HEAD
          replay_owed FETCH_HEAD "$REPLAY"
          exit "$status"

      # F04-R12 (F04-Q10): ask the network repo's site-deploy to render what main now holds, so a
      # merge reaches the site in seconds instead of on GitHub's best-effort schedule. Skipped for
      # the bot's own `gate: #N pass` commit, whose merge already dispatched it; a direct push to
      # main (a re-pin, a workflow change) dispatches too. The token is a fine-grained token on the
      # network repository with Actions: read and write and nothing else (C8). Without it, or if
      # the dispatch fails, the five-minute schedule deploys and this job does not fail (C7).
      - name: Ask the site to deploy this commit
        if: github.event.head_commit.author.name != 'opn-gate'
        env:
          GH_TOKEN: ${{ secrets.OPN_SITE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if [ -z "$GH_TOKEN" ]; then
            echo "site: OPN_SITE_DEPLOY_TOKEN is not set; the schedule deploys $commit"; exit 0
          fi
          gh workflow run site-deploy.yml --repo thisisanameforsure/open_proof_network --ref main \
            -f graph_commit="$commit" \
            && echo "site: dispatched site-deploy for $commit" \
            || echo "::warning::site-deploy was not dispatched for $commit; the schedule deploys (C7)"

      # F07-T32: wake the merge actor now, however this job ended. Its own wake is this run
      # completing, which the host reported eight minutes after #147's post-merge jobs had ended on
      # 2026-09-23; a failed job (#145) woke nothing at all. `workflow_dispatch` is the one event
      # this job's own token may start a run with.
      - name: Wake the merge actor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run merge.yml --repo "$GITHUB_REPOSITORY" --ref main \
            && echo "dispatched the merge actor" \
            || echo "::warning::the merge actor was not dispatched; its gate wake and cron remain"

  # F10-R7, F07-T57: build every proved node's oleans from a merge that built something and passed,
  # inside the step-3 image, and upload them keyed by that commit, so the next pregate.sh,
  # devcontainer and gate run fetch instead of compiling. A job of its own, after the post-merge job
  # has pushed: the upload took three and a half to seven minutes and ran before the commit on every
  # merge, so an annex's record waited for oleans it had not changed. A merge that builds nothing
  # publishes no cache; a fetch takes the newest cache at or before its commit, which holds every
  # proved node. Only when the repository variables name the bucket and the role; unset, the job is
  # skipped and a pinned gate that predates the command is never asked (F08-Q8's shape). It alone
  # holds the OIDC grant the role needs (C8, item 4); a failed upload is a warning: the next run
  # builds (C7). `cache publish` reads the merge commit's tree and nothing else, so one commit of
  # history is all it is given.
  cache:
    name: olean cache for a merge that built (F10-R7), after its record is pushed
    needs: postmerge
    if: needs.postmerge.outputs.cache == 'true' && vars.OPN_CACHE_UPLOAD_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # the upload assumes a role through OIDC (C8 item 4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.postmerge.outputs.merge }}

      - name: Check out the network commit main pins now, which builds the cache (F07-T33)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ needs.postmerge.outputs.render_pin }}
          path: network-render
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Assume the cache upload role (OIDC, no stored key)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.OPN_CACHE_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.OPN_AWS_REGION }}

      - name: Publish the olean cache for this merge (F10-R7; no gate secret in this job)
        env:
          PYTHONPATH: network-render/gate
          MERGE: ${{ needs.postmerge.outputs.merge }}
          TARGETS: ${{ needs.postmerge.outputs.targets }}
        run: |
          set -euo pipefail
          uv sync --frozen --project network-render --quiet
          for target in $TARGETS; do
            uv run --frozen --project network-render python -m opn_gate.cli cache publish \
              --graph . --commit "$MERGE" --target "$target" \
              --sandbox --bucket "${{ vars.OPN_CACHE_BUCKET }}" --prefix "${{ vars.OPN_CACHE_PREFIX }}" \
              || echo "::warning::the olean cache was not published for ${MERGE} ($target); the next run builds (C7)"
          done

  # F19-T4 (R6; Q2, decided 2026-10-04): the outline of each merged proof artifact — its named
  # steps, each with its claim, the goal it leaves and how it is closed — extracted by the pinned
  # gate in the step-3 sandbox and committed beside the products as targets/<id>/outlines/<hash>.json.
  # A job of its own after the post-merge job has pushed, as the cache is (F07-T57): the outline
  # elaborates the artifact a second time, and in the post-merge job a memory kill there would cost a
  # merge its record over a reading aid. Here a failure costs one outline, named in the report (R5),
  # and nothing waits for it (F07-T55-T57). For the merges that built and passed (the cache's own
  # condition): only they add a proof artifact.
  #
  # It reads main as it is when the job starts, not the commit the post-merge job pushed: an artifact
  # is outlined only once its merge's attestation is on main (graph.proofs_of), which is true of main
  # after the push and of anything newer, and `opn-gate outline` extracts every artifact of the target
  # that has no outline, so a newer main is a superset — it also catches up an outline a lost run
  # left behind. The network commit is the one main pins for the target now (F07-T33's render pin),
  # read from that same tree. Contributor Lean runs only in the pinned image (C9): the graph checkout
  # keeps no credential and the extraction step is granted no secret; the deploy key reaches only the
  # step that pushes, which takes nothing from the extraction but files that are new outlines of
  # these targets, each re-checked against main before it is pushed.
  #
  # The push races everything else that writes main (merges, gate commits, owners' pushes). It
  # catches up as the post-merge job does (F07-T29, T55): a refused push fetches main and lays again
  # on it every outline that still describes it — none already there (another run wrote it first;
  # theirs stands), and the artifact it names still in that tree with exactly the bytes it outlines.
  # A re-pin of the target since extraction is the record moving in a way that matters: the outlines
  # name a gate main no longer pins, so nothing is pushed and the next run extracts with the new one.
  # On a pin that predates `opn-gate outline`, the pinned gate's own command list has no `outline`
  # and the job ends with a notice (F08-Q8's shape): this file is inert until the re-pin.
  outline:
    name: proof outlines for a merge that built (F19-R6), after its record is pushed
    needs: postmerge
    if: needs.postmerge.outputs.cache == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Find the network commit main pins for the merged target
        id: pin
        env:
          TARGETS: ${{ needs.postmerge.outputs.targets }}
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          pin=""; targets=""
          for target in $TARGETS; do
            if ! printf '%s' "$target" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
              || [ ! -f "targets/$target/gate-spec.json" ]; then
              echo "::warning::outline: '$target' is not a target on main at ${base:0:12}; skipped"
              continue
            fi
            found="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['network_commit'])" "targets/$target/gate-spec.json")"
            if ! printf '%s' "$found" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::warning::outline: $target pins no network commit; skipped"; continue
            fi
            [ -z "$pin" ] && pin="$found"
            if [ "$found" != "$pin" ]; then
              echo "::notice::outline: $target pins another gate than ${pin:0:12}; its next merge outlines it"
              continue
            fi
            targets="$targets $target"
          done
          if [ -z "$pin" ]; then
            echo "outline: nothing to outline"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "run=true"; echo "base=$base"; echo "pin=$pin"; echo "targets=${targets# }"
          } >> "$GITHUB_OUTPUT"
          echo "outline: main at $base; targets${targets}; network pin $pin"

      - name: Check out the network commit main pins for the target (D-35, F07-T33)
        if: steps.pin.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ steps.pin.outputs.pin }}
          path: network-render
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.pin.outputs.run == 'true'
        with:
          version: ${{ env.UV_VERSION }}

      # F19-R5: a failure is named in the report and writes nothing for that artifact; it is a
      # warning here, never a red run, since the next run (or the backfill) retries what is missing.
      - name: Extract the missing outlines in the step-3 sandbox (F19-R5, R6; no secret in this step)
        id: extract
        if: steps.pin.outputs.run == 'true'
        env:
          PYTHONPATH: network-render/gate
          TARGETS: ${{ steps.pin.outputs.targets }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          uv sync --frozen --project network-render --quiet
          if ! help="$(uv run --frozen --project network-render python -m opn_gate.cli --help 2>&1)"; then
            printf '%s\n' "$help" | tail -n 20
            echo "::warning::outline: the pinned gate ${PIN:0:12} did not start; no outline this run (C7)"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! printf '%s' "$help" | grep -Eq '[{,]outline[,}]'; then
            echo "::notice::outline: the pinned network ${PIN:0:12} predates opn-gate outline (F19-T4); nothing is extracted until the re-pin"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for target in $TARGETS; do
            status=0
            uv run --frozen --project network-render python -m opn_gate.cli outline \
              --graph . --commit HEAD --target "$target" --no-build \
              --out "$RUNNER_TEMP/outline-$target" > "$RUNNER_TEMP/outline-$target.json" || status=$?
            cat "$RUNNER_TEMP/outline-$target.json"
            if [ "$status" -ne 0 ]; then
              echo "::warning::outline: $target has an artifact left without an outline (exit $status), named in the report above (F19-R5); the next run or the backfill retries it"
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Commit the outlines and push them (with the write deploy key; F07-T29's catch-up)
        if: steps.extract.outputs.run == 'true'
        env:
          OPN_GRAPH_DEPLOY_KEY: ${{ secrets.OPN_GRAPH_DEPLOY_KEY }}
          TARGETS: ${{ steps.pin.outputs.targets }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/deploy_key"' EXIT  # C8: on every path out of this step
          helper="$RUNNER_TEMP/outline_publish.py"
          cat > "$helper" <<'PY'
          """F19-T4: commit the outlines this job extracted and push them, catching up while main moves.

          Pure functions over git, so the network repo's tests run this file as it stands
          (test_finding_outline_job.py). It reads the checkout and main with git and nothing else: no
          network but the push and the fetch, no contributor code, no secret but the deploy key the
          push already has in its environment.

          `collect` takes from the extraction only what it may write: new files under
          targets/<target>/outlines/<sha256>.json for the targets this job outlined, and no change to
          any tracked file. `publish` pushes one commit `outline: ...`; when main has moved it fetches,
          keeps every outline that still describes main as it now is (none there already, and the
          artifact it names in that tree with the bytes it outlines), lays them on main and pushes
          again. A re-pin of a target means the outlines name a gate main no longer pins: nothing is
          pushed, and the next run extracts with the new gate."""
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys

          OUTLINE_RE = re.compile(r"^targets/([A-Za-z0-9][A-Za-z0-9._-]*)/outlines/([0-9a-f]{64})\.json$")
          PUBLISH_ATTEMPTS = 6


          def git(*args, check=True):
              return subprocess.run(["git", *args], check=check, capture_output=True, text=True)


          def collect(targets, porcelain_targets, porcelain_tracked):
              """(outline paths to commit, offending lines). `porcelain_targets` is `git status
              --porcelain --untracked-files=all -- targets`, `porcelain_tracked` the same for every
              tracked file in the checkout: the extraction may add outlines and nothing else."""
              files, bad = [], [line for line in porcelain_tracked.splitlines() if line.strip()]
              for line in porcelain_targets.splitlines():
                  if not line.strip():
                      continue
                  status, path = line[:2], line[3:]
                  found = OUTLINE_RE.match(path)
                  if status == "??" and found and found.group(1) in targets:
                      files.append(path)
                  elif line not in bad:
                      bad.append(line)
              return sorted(files), bad


          def describes(path, data, *, exists, blob):
              """Whether the outline at `path` (bytes `data`) may be laid on a main whose files
              `exists(path)` and `blob(path)` read: none there yet, it names its own target and
              hash, and the artifact it names is there with exactly the bytes it outlines."""
              found = OUTLINE_RE.match(path)
              if not found or exists(path):
                  return False
              try:
                  doc = json.loads(data)
                  node, rel, digest = doc["node"], doc["artifact"]["path"], doc["artifact"]["hash"]
              except (ValueError, KeyError, TypeError):
                  return False
              if doc.get("target") != found.group(1) or digest != found.group(2):
                  return False
              if not isinstance(node, str) or not isinstance(rel, str) or ".." in rel.split("/"):
                  return False
              artifact = blob(f"targets/{found.group(1)}/nodes/{node}/{rel}")
              return artifact is not None and hashlib.sha256(artifact).hexdigest() == digest


          def publish(files, *, attempts, push, fetch, pin_moved, keep, commit):
              """Push the commit made of `files` ({path: bytes}); while main has moved under it, lay
              again on main as it now is the outlines that still describe it. Answers `pushed`,
              `nothing-left` (main has them all, or none still applies), `pin-moved` or `gave-up`."""
              for attempt in range(1, attempts + 1):
                  if push():
                      return "pushed"
                  new = fetch()
                  if pin_moved(new):
                      return "pin-moved"
                  files = {path: data for path, data in files.items() if keep(new, path, data)}
                  if not files:
                      return "nothing-left"
                  commit(new, files)
                  print(f"outline: main moved (attempt {attempt}); caught up on {new[:12]}", flush=True)
              return "gave-up"


          def message(files):
              targets = sorted({OUTLINE_RE.match(path).group(1) for path in files})
              return f"outline: {len(files)} for {' '.join(targets)}"


          def run_collect(env):
              targets = set(env["TARGETS"].split())
              files, bad = collect(
                  targets,
                  git("status", "--porcelain", "--untracked-files=all", "--", "targets").stdout,
                  git("status", "--porcelain", "--untracked-files=no").stdout,
              )
              if bad:
                  print("::error::outline: the extraction changed what it may not; nothing is pushed:", file=sys.stderr)
                  for line in bad:
                      print(f"  {line}", file=sys.stderr)
                  return 1
              for path in files:
                  print(path)
              return 0


          def run_publish(env):
              remote, pin = env["REMOTE"], env["PIN"]
              with open(env["LIST"], encoding="utf-8") as listed:
                  paths = [line for line in listed.read().split() if line]
              files = {}
              for path in paths:
                  with open(path, "rb") as f:
                      files[path] = f.read()

              def commit(rev, chosen):
                  if rev is not None:
                      git("checkout", "-q", "-f", "--detach", rev)
                      for path, data in chosen.items():
                          os.makedirs(os.path.dirname(path), exist_ok=True)
                          with open(path, "wb") as out:
                              out.write(data)
                  git("add", "--", *sorted(chosen))
                  git("commit", "-q", "-m", message(chosen))

              def push():
                  return subprocess.run(["git", "push", "-q", remote, "HEAD:main"], check=False).returncode == 0

              def fetch():
                  git("fetch", "-q", remote, "main")
                  return git("rev-parse", "FETCH_HEAD").stdout.strip()

              def pin_moved(rev):
                  for target in env["TARGETS"].split():
                      shown = git("show", f"{rev}:targets/{target}/gate-spec.json", check=False)
                      try:
                          found = json.loads(shown.stdout)["network_commit"] if shown.returncode == 0 else None
                      except (ValueError, KeyError, TypeError):
                          found = None
                      if found != pin:
                          print(f"::notice::outline: main re-pinned {target} since extraction; these outlines are not this run's to push")
                          return True
                  return False

              def keep(rev, path, data):
                  def exists(p):
                      return git("cat-file", "-e", f"{rev}:{p}", check=False).returncode == 0

                  def blob(p):
                      shown = subprocess.run(["git", "show", f"{rev}:{p}"], capture_output=True, check=False)
                      return shown.stdout if shown.returncode == 0 else None

                  return describes(path, data, exists=exists, blob=blob)

              commit(None, files)
              attempts = int(env.get("PUBLISH_ATTEMPTS") or PUBLISH_ATTEMPTS)
              outcome = publish(
                  files, attempts=attempts, push=push, fetch=fetch, pin_moved=pin_moved, keep=keep,
                  commit=commit,
              )
              print(f"outline: publish {outcome}")
              if outcome == "gave-up":
                  print(f"::warning::outline: the push was refused {attempts} times; the next run extracts what is still missing")
              return 0


          if __name__ == "__main__":
              command = sys.argv[1]
              if command == "collect":  # collect: the outline paths to commit, one per line
                  sys.exit(run_collect(os.environ))
              if command == "publish":  # publish: commit LIST and push it, catching up while main moves
                  sys.exit(run_publish(os.environ))
              sys.exit(f"unknown command {command!r}")
          PY
          python3 "$helper" collect > "$RUNNER_TEMP/outlines.txt"
          if [ ! -s "$RUNNER_TEMP/outlines.txt" ]; then
            echo "outline: no new outline to commit"; exit 0
          fi
          cat "$RUNNER_TEMP/outlines.txt"
          printf '%s\n' "$OPN_GRAPH_DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          git config user.name "opn-gate"
          git config user.email "gate@openproof.network"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          REMOTE="git@github.com:${GITHUB_REPOSITORY}.git" LIST="$RUNNER_TEMP/outlines.txt" \
            python3 "$helper" publish

      # F20-T10, F20-R17: ask the network's drafter to put words to what this merge created — a
      # gloss of each new statement, witness and relation, and an explainer of each proof whose
      # outline is now on main. Only once the pinned gate knows outlines (a gate that old would also
      # refuse every gloss path, so drafting before the re-pin would spend the model for pull
      # requests that go red). The drafter skips what already has words, so a re-run drafts nothing
      # twice. Without the dispatch token the drafter waits for its next dispatch (C7).
      - name: Ask the network's drafter for this merge's words
        if: always() && steps.extract.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPN_SITE_DEPLOY_TOKEN }}
          TARGETS: ${{ steps.pin.outputs.targets }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "drafter: OPN_SITE_DEPLOY_TOKEN is not set; dispatch gloss-draft.yml by hand"; exit 0
          fi
          for target in $TARGETS; do
            gh workflow run gloss-draft.yml --repo thisisanameforsure/open_proof_network --ref main \
              -f graph_ref=main -f target="$target" -f subjects=new \
              && echo "drafter: dispatched gloss-draft for $target" \
              || echo "::warning::gloss-draft was not dispatched for $target; dispatch it by hand (C7)"
          done
