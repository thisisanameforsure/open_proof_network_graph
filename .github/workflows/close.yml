# The closer (F28-T5; D-12 v3.41, D-4, C8): when every input of a node's merged decomposition is
# proved, the network writes the proof that joins them and submits it like any proof. A node is
# proved only when that pull request merges through the gate; nothing here marks anything.
#
# Woken by the post-merge job when it ends (gate.yml), by hand, and hourly as a catch-up (an
# Actions cron is a hope, not a schedule; the wake is what matters). Each run reads main as it is,
# asks the network commit main pins for every target that is ready to close (`opn-gate close
# --target`), and composes those proofs in the step-3 sandbox with no secret: composing elaborates
# merged contributor Lean, which runs only in the pinned image (C9). A node that already has an open
# closing pull request is skipped, so a re-run opens nothing twice (F28-R8).
#
# The last step is the only one that sees a secret, the merge token (C8: contents and pull requests
# write on this repository alone). It takes from the composing step nothing but files named
# <target>/<node>.lean for nodes that exist on main without a Proof.lean, pushes each to a
# `close/<node>` branch as one commit authored `opn-gate` (the gate's reserved name: the ledger
# credits a join to nobody, D-12 v3.41), opens its pull request with a submission block naming
# `opn-gate`; its gate run wakes the merge actor, which merges `close/` branches as the service's.
# Each proof is prechecked in the sandboxed step first, by the precheck job's own code, and carries
# that unsigned attestation as any plain-git submission may (D-4: kind `none`); a proof that fails
# its precheck is never opened (F28-R10). The last step also closes
# any open closing pull request whose node a direct proof reached first: a composed proof is never
# kept beside a real one (the owner's ruling of 2026-10-15).
#
# A closing proof that settles the root is asked step 9 as any proof of the root is (v3.20). On a
# pin that predates `opn-gate close --target`, the run ends with a notice: this file is inert until
# the re-pin. Without the secret the last step is a dry run that says what it would have opened.
name: close

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 * * * *" # a catch-up only; the post-merge job's wake is the trigger

concurrency:
  group: close
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  close:
    name: closing proofs for nodes whose decomposition is proved (F28)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Find the network pin and the closing pull requests already open
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          pin=""; targets=""
          for spec in targets/*/gate-spec.json; do
            target="$(basename "$(dirname "$spec")")"
            [ -f "targets/$target/graph.json" ] || continue
            found="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['network_commit'])" "$spec")"
            if ! printf '%s' "$found" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::warning::close: $target pins no network commit; skipped"; continue
            fi
            [ -z "$pin" ] && pin="$found"
            if [ "$found" != "$pin" ]; then
              echo "::notice::close: $target pins another gate than ${pin:0:12}; a later run closes it"
              continue
            fi
            targets="$targets $target"
          done
          open="$(gh pr list --repo "$REPO" --state open --limit 200 --json headRefName \
            --jq '[.[].headRefName | select(startswith("close/")) | ltrimstr("close/")] | join(",")')"
          if [ -z "$pin" ]; then
            echo "close: no target"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "run=true"; echo "base=$base"; echo "pin=$pin"; echo "targets=${targets# }"
            echo "open=$open"
          } >> "$GITHUB_OUTPUT"
          echo "close: main at ${base:0:12}; network pin ${pin:0:12}; open closing pull requests: ${open:-none}"

      - name: Check out the network commit main pins (D-35)
        if: steps.pin.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thisisanameforsure/open_proof_network
          ref: ${{ steps.pin.outputs.pin }}
          path: network-render
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.pin.outputs.run == 'true'
        with:
          version: ${{ env.UV_VERSION }}

      - name: Compose and precheck the closing proofs in the step-3 sandbox (F28-R4, R5, R10; no secret in this step)
        id: compose
        if: steps.pin.outputs.run == 'true'
        env:
          PYTHONPATH: network-render/gate
          TARGETS: ${{ steps.pin.outputs.targets }}
          PIN: ${{ steps.pin.outputs.pin }}
          OPEN: ${{ steps.pin.outputs.open }}
        run: |
          set -euo pipefail
          uv sync --frozen --project network-render --quiet
          if ! help="$(uv run --frozen --project network-render python -m opn_gate.cli close --help 2>&1)" \
            || ! printf '%s' "$help" | grep -q -- '--skip'; then
            echo "::notice::close: the pinned network ${PIN:0:12} predates opn-gate close --target (F28-T5); nothing is closed until the re-pin"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          dest="$RUNNER_TEMP/closing"
          mkdir -p "$dest"
          for target in $TARGETS; do
            status=0
            uv run --frozen --project network-render python -m opn_gate.cli close \
              --graph . --commit HEAD --target "$target" --skip "$OPEN" --dest "$dest" --no-build \
              --out "$RUNNER_TEMP/close-$target" > "$RUNNER_TEMP/close-$target.json" || status=$?
            cat "$RUNNER_TEMP/close-$target.json"
            if [ "$status" -ne 0 ]; then
              echo "::warning::close: $target has a node ready to close whose proof was not composed (exit $status), named in the report above (F28-R10); it is not submitted"
            fi
          done
          # Each proof is prechecked as any plain-git submission is (D-4: the unsigned kind `none`,
          # which every target's gate-spec accepts), by the precheck job's own code inside the
          # step-3 image, on a scratch worktree of main. Only a pass is kept, with its attestation
          # beside it; a failed join is reported here and never submitted (F28-R10).
          for proof in "$dest"/*/*.lean; do
            [ -e "$proof" ] || continue
            target="$(basename "$(dirname "$proof")")"; node="$(basename "$proof" .lean)"
            work="$RUNNER_TEMP/precheck-$node"
            rm -rf "$work"; mkdir -p "$work/bundle/targets/$target/nodes/$node"
            cp "$proof" "$work/bundle/targets/$target/nodes/$node/Proof.lean"
            git worktree add -q --detach "$work/graph" HEAD
            python3 -c 'import json,sys; json.dump({"id": "close-" + sys.argv[1], "node_id": sys.argv[1], "target_id": sys.argv[2], "graph_commit": sys.argv[3], "bundle_digest": sys.argv[4]}, open(sys.argv[5], "w"))' \
              "$node" "$target" "$(git rev-parse HEAD)" "$(sha256sum "$proof" | cut -d' ' -f1)" "$work/job.json"
            uv run --frozen --project network-render python -m precheck.job \
              --graph "$work/graph" --job "$work/job.json" --bundle "$work/bundle" --out "$work/out" \
              > "$work/precheck.txt" 2>&1 || true
            verdict="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["verdict"])' "$work/out/result.json" 2>/dev/null || echo error)"
            if [ "$verdict" = "pass" ]; then
              python3 -c 'import json,sys; json.dump(json.load(open(sys.argv[1]))["attestation"], open(sys.argv[2], "w"))' \
                "$work/out/result.json" "$dest/$target/$node.attestation.json"
              echo "close: $node ($target) passed its precheck"
            else
              tail -n 40 "$work/precheck.txt" || true
              echo "::warning::close: the closing proof of $node ($target) did not pass its precheck ($verdict); it is not submitted (F28-R10)"
              rm -f "$proof"
            fi
            git worktree remove --force "$work/graph" || true
          done
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"

      - name: Open the closing pull requests (the only step that sees the token)
        if: steps.compose.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPN_GRAPH_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          DEST: ${{ steps.compose.outputs.dest }}
          BASE: ${{ steps.pin.outputs.base }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/close_open.py"
          cat > "$helper" <<'PY'
          """F28-T5: push the composed closing proofs and open their pull requests.

          Pure functions over the composed files and git, so the network repo's tests run this file
          as it stands (test_finding_close_job.py). It runs no gate and no contributor code: it
          copies text the sandbox wrote into Proof.lean files, pushes them, and asks the host to open
          and close pull requests."""
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          ID_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*$")
          AUTHOR = "opn-gate"
          EMAIL = "opn-gate@users.noreply.github.com"
          PREFIX = "close/"
          FENCE = "`" * 3


          def git(*args, check=True):
              return subprocess.run(["git", *args], check=check, capture_output=True, text=True)


          def gh(*args, check=True):
              return subprocess.run(["gh", *args], check=check, capture_output=True, text=True)


          def proposals(dest):
              """(target, node, proof path, attestation path) for every <target>/<node>.lean the
              composing step kept, each beside its passing precheck <node>.attestation.json; and the
              names that are not of that shape, or a proof with no attestation (refused, never
              pushed)."""
              found, bad = [], []
              for path in sorted(Path(dest).rglob("*")):
                  if path.is_dir():
                      continue
                  rel = path.relative_to(dest).parts
                  name = rel[-1]
                  if (len(rel) == 2 and name.endswith(".attestation.json") and ID_RE.match(rel[0])
                          and ID_RE.match(name[: -len(".attestation.json")])):
                      continue  # read beside its proof
                  if not (len(rel) == 2 and name.endswith(".lean") and ID_RE.match(rel[0])
                          and ID_RE.match(name[:-5])):
                      bad.append("/".join(rel))
                      continue
                  attestation = path.with_name(name[:-5] + ".attestation.json")
                  if not attestation.is_file():
                      bad.append("/".join(rel))
                      continue
                  found.append((rel[0], name[:-5], path, attestation))
              return found, bad


          def plan(found, exists, proved, open_prs):
              """(to open, to close). A proposal opens when its node is on main with no Proof.lean and
              no closing pull request is open for it; an open closing pull request closes when its
              node has a Proof.lean on main (a direct proof merged first)."""
              to_open = [(t, n, p, a) for t, n, p, a in found
                         if exists(t, n) and not proved(t, n) and n not in open_prs]
              to_close = [(n, num, t) for n, (num, t) in sorted(open_prs.items())
                          if t is not None and proved(t, n)]
              return to_open, to_close


          def body(target, node, base, attestation):
              """The pull request's description: what it is, its passing precheck attestation (the
              block the bounce rule reads, D-4), and the submission block naming the gate as
              submitter (D-12 v3.41: the network is the submitter, never an author)."""
              block = {
                  "schema": "submission-meta/v2",
                  "submission_id": hashlib.sha256(f"{target}/{node}@{base}".encode()).hexdigest()[:26].upper(),
                  "identity": {"pseudonym": AUTHOR, "proof_kind": "github"},
                  "artifact_type": "proof",
                  "tooling": {"model": None, "version": None, "harness": "opn-gate close (F28)"},
              }
              return (
                  f"The closing proof of `{node}` ({target}), composed by the network from its merged "
                  "decomposition and the proofs of what it needs (D-12 v3.41). The gate checks it like "
                  "any proof; its precheck below is the unsigned kind any plain-git submission may "
                  "attach. Credit stays with the work it joins.\n\n"
                  f"{FENCE}json\nopn-precheck-attestation\n{attestation}\n{FENCE}\n\n"
                  f"{FENCE}json\nopn-submission\n{json.dumps(block, indent=2)}\n{FENCE}\n"
              )


          def open_closing_prs(repo):
              """Open pull requests on close/ branches: node -> (number, target or None)."""
              out = gh("pr", "list", "--repo", repo, "--state", "open", "--limit", "200",
                       "--json", "number,headRefName,files").stdout
              prs = {}
              for pr in json.loads(out or "[]"):
                  ref = pr["headRefName"]
                  if not ref.startswith(PREFIX):
                      continue
                  target = None
                  for f in pr.get("files") or []:
                      m = re.match(r"^targets/([^/]+)/nodes/([^/]+)/Proof\.lean$", f.get("path", ""))
                      if m:
                          target = m.group(1)
                  prs[ref[len(PREFIX):]] = (pr["number"], target)
              return prs


          def main():
              dest, repo, base = os.environ["DEST"], os.environ["REPO"], os.environ["BASE"]
              dry = not os.environ.get("GH_TOKEN")
              found, bad = proposals(dest)
              for name in bad:
                  print(f"::warning::close: {name} is not <target>/<node>.lean; not pushed")
              git("fetch", "-q", "origin", "main")
              tip = git("rev-parse", "origin/main").stdout.strip()

              def has(t, n, leaf):
                  return git("cat-file", "-e", f"{tip}:targets/{t}/nodes/{n}/{leaf}", check=False).returncode == 0

              open_prs = {} if dry else open_closing_prs(repo)
              to_open, to_close = plan(found, lambda t, n: has(t, n, "Statement.lean"),
                                       lambda t, n: has(t, n, "Proof.lean"), open_prs)
              if dry:
                  for t, n, _, _ in to_open:
                      print(f"::notice::dry run: would open a closing pull request for {n} ({t}); OPN_GRAPH_MERGE_TOKEN is not set")
                  return 0
              for n, num, t in to_close:
                  gh("pr", "close", str(num), "--repo", repo, "--delete-branch", "--comment",
                     f"A proof of `{n}` merged first; a composed closing proof is never kept beside it (D-12 v3.41).")
                  print(f"closed #{num}: {n} was proved directly")
              opened = 0
              helper = ["-c", "credential.helper=", "-c", "credential.helper=!gh auth git-credential"]
              for t, n, path, attestation in to_open:
                  branch = PREFIX + n
                  git("checkout", "-q", "-B", branch, tip)
                  target_file = Path("targets") / t / "nodes" / n / "Proof.lean"
                  target_file.write_text(Path(path).read_text(encoding="utf-8"), encoding="utf-8")
                  git("add", "--", str(target_file))
                  git("-c", f"user.name={AUTHOR}", "-c", f"user.email={EMAIL}",
                      "commit", "-q", "-m", f"close: {n}")
                  remote = os.environ.get("REMOTE") or f"https://github.com/{repo}"
                  git(*helper, "push", "-q", "--force", remote, f"HEAD:refs/heads/{branch}")
                  body_file = Path(os.environ.get("RUNNER_TEMP", ".")) / f"close-{n}.md"
                  text = Path(attestation).read_text(encoding="utf-8").strip()
                  body_file.write_text(body(t, n, tip, text), encoding="utf-8")
                  gh("pr", "create", "--repo", repo, "--base", "main", "--head", branch,
                     "--title", f"close: {n}", "--body-file", str(body_file))
                  opened += 1
                  print(f"opened the closing pull request for {n} ({t})")
              git("checkout", "-q", "--detach", tip)
              # No dispatch: each pull request's gate run wakes the merge actor when it ends.
              print(f"close: opened {opened}, closed {len(to_close)}")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 "$helper"
