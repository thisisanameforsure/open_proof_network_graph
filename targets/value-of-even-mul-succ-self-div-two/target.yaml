schema: target/v3
id: value-of-even-mul-succ-self-div-two
title: The Catch-Up game and conjecture
informal: Let $T_N = \sum_{k=1}^{N} k = \frac{N(N+1)}{2}$. If $T_N$ is even (equivalently
  $N \equiv 0 \pmod 4$ or $N \equiv 3 \pmod 4$), then under optimal play the game
  `Catch-Up($\{1, \ldots, N\}$)` ends in a draw.
