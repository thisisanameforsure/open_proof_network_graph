exhibit: "import Mathlib\n\n/-- The hole `erdos-1050--h1-v2--h1` is no easier than\
  \ the root it was meant to reduce: its sum is\nthe root's with the first two terms\
  \ (−1 and +1) taken off, so the root's statement implies it. -/\ntheorem erdos_1050_circular\
  \ :\n    Irrational (∑' n : ℕ, (1 : ℝ) / ((2 : ℝ) ^ (n + 1) - 3)) →\n      Irrational\
  \ (∑' (n : ℕ), (1 : ℝ) / ((2 : ℝ) ^ (n + (3 : ℕ)) - (3 : ℝ))) := by\n  intro h\n\
  \  have tail : Summable (fun n : ℕ => (1 : ℝ) / ((2 : ℝ) ^ (n + 3) - 3)) := by\n\
  \    refine Summable.of_nonneg_of_le (fun n => ?_) (fun n => ?_)\n      (summable_geometric_of_lt_one\
  \ (by norm_num : (0:ℝ) ≤ 1/2) (by norm_num : (1/2:ℝ) < 1))\n    · have h1 : (1:ℝ)\
  \ ≤ 2 ^ n := one_le_pow₀ (by norm_num)\n      have h2 : (2:ℝ) ^ (n + 3) = 8 * 2\
  \ ^ n := by ring\n      apply div_nonneg zero_le_one\n      rw [h2]; linarith\n\
  \    · have h1 : (1:ℝ) ≤ 2 ^ n := one_le_pow₀ (by norm_num)\n      have h2 : (2:ℝ)\
  \ ^ (n + 3) = 8 * 2 ^ n := by ring\n      rw [h2, one_div_pow]\n      exact one_div_le_one_div_of_le\
  \ (by positivity) (by linarith)\n  have whole : Summable (fun n : ℕ => (1 : ℝ) /\
  \ ((2 : ℝ) ^ (n + 1) - 3)) := by\n    refine (summable_nat_add_iff 2).mp ?_\n  \
  \  convert tail using 2 with n\n  have eq : ∑' n : ℕ, (1 : ℝ) / ((2 : ℝ) ^ (n +\
  \ 1) - 3) =\n      ∑' n : ℕ, (1 : ℝ) / ((2 : ℝ) ^ (n + 3) - 3) := by\n    rw [←\
  \ whole.sum_add_tsum_nat_add 2]\n    norm_num [Finset.sum_range_succ]\n  rw [eq]\
  \ at h\n  simpa using h\n"
