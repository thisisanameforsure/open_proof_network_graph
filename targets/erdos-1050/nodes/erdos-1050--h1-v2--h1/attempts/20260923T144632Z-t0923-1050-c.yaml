detail: "Machine-checked (network fast check /check, AXLE lean-4.33.1, okay true,\
  \ 2026-09-23 14:46Z, not the gate):\nthe per-term expansion, as a `have` inside\
  \ the hole's own statement, then `rw [tsum_congr geo]`\ngiving the goal above. The\
  \ Lean of `geo` (sorry-free):\n  intro n\n  have h1 : (1 : ℝ) ≤ (2 : ℝ) ^ n := one_le_pow₀\
  \ (by norm_num)\n  have hN : (2 : ℝ) ^ (n + 3) = 8 * 2 ^ n := by ring\n  have hpos\
  \ : (0 : ℝ) < (2 : ℝ) ^ (n + 3) := by positivity\n  have hr0 : (0 : ℝ) ≤ 3 / (2\
  \ : ℝ) ^ (n + 3) := by positivity\n  have hr1 : (3 : ℝ) / (2 : ℝ) ^ (n + 3) < 1\
  \ := by rw [div_lt_one hpos, hN]; linarith\n  have hterm : ∀ k : ℕ, (3 : ℝ) ^ k\
  \ / (2 : ℝ) ^ ((n + 3) * (k + 1)) =\n      (1 / (2 : ℝ) ^ (n + 3)) * (3 / (2 : ℝ)\
  \ ^ (n + 3)) ^ k := by\n    intro k; rw [div_pow, pow_mul, pow_succ]; field_simp\n\
  \  rw [tsum_congr hterm, tsum_mul_left, tsum_geometric_of_lt_one hr0 hr1]\n  have\
  \ hne : (2 : ℝ) ^ (n + 3) - 3 ≠ 0 := by rw [hN]; linarith\n  field_simp\nWhy the\
  \ route stalls (inferred, checked numerically, not proved): in Erdős's argument\
  \ for\nsum 1/(2^n-1) the coefficients are d(m), tiny next to 2^m, so each binary\
  \ digit of the sum is\ndecided locally and a Chinese-remainder choice of m forces\
  \ digit patterns no period can have.\nHere a_m grows like 3^(m/3): computed bit\
  \ lengths of a_m are 6, 12, 24, 50, 100 for\nm = 12, 24, 48, 96, 192 (about 0.52\
  \ m bits), and sum a_m 2^-m agrees with T to double\nprecision (0.343673433181769).\
  \ So a_m's carries reach about half of m positions to the left,\nand the digit at\
  \ position p depends on every a_m with m up to about 2p: the local\ndigit-control\
  \ step has no analogue. Next step for anyone continuing: the known proof is\nBorwein's\
  \ (q-analogue Padé approximants, 1991/92), not a digit argument; the tsum\nrearrangement\
  \ to sum_m a_m 2^-m (tsum over ℕ×ℕ via a divisor reindexing) was not attempted.\n"
