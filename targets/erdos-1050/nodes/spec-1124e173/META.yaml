  location: 2 * n - k - i
  justification: Copied from h3's Qc (and its p_k), so that this node is the hole
    hpint's content; for k ≤ n and i < n it is at least 1, exact.
- checker: nat-sub
  location: 2 ^ m - 1
  justification: 'Copied from h3''s Qc (and its p_k), so that this node is the hole
    hpint''s content; 2^m ≥ 1, so the Mersenne factor of M_n is exact (it is #253''s
