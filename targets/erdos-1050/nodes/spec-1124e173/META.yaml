    hpint's content; j ≤ k on range (k + 1), exact.
- checker: nat-sub
  location: n - i
  justification: Copied from h3's Qc (and its p_k), so that this node is the hole
    hpint's content; exact for i ≤ n; for k > n a zero factor gives the Gaussian binomial's
