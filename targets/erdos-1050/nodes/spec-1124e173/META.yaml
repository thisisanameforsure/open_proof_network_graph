  location: Qc n j / (2 ^ (k - j) - 1)
  justification: Copied from h3's Qc (and its p_k), so that this node is the hole
    hpint's content; the divisor is 0 only at j = k, where h3 intends x / 0 = 0 (that
    term is absent from p_k).
- checker: nat-sub
