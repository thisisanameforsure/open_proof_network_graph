- checker: nat-sub
  location: 2 ^ (j + 1) - 3
  justification: j ≥ 2 on Finset.Ico 2 n, so 2^(j+1) ≥ 8 > 3 and the subtraction is
    exact; it is the factor 2^(j+1) - 3 of the annex's D_n.
- checker: nat-sub
  location: 2 ^ m - 1
  justification: 2^m ≥ 1 for every m, so 2^m - 1 is exact; it is the Mersenne factor
    of the annex's D_n.
- checker: off-by-one-range
  location: Finset.Ico 2 n
  justification: 'Intended: the annex''s product runs over 2 ≤ j < n, lower end included,
    upper end excluded.'
