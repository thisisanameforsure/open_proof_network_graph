title: 'Erdős problem 642: Let $f(n)$ be the maximal number of edges in a graph on
  $n$ vertices such that all cycles have more vertices than chords.'
informal: Let $f(n)$ be the maximal number of edges in a graph on $n$ vertices such
  that all cycles have more vertices than chords. Is it true that $f(n)\ll n$? A problem
  of Hamburger and Szegedy. A chord is an edge between two vertices of the cycle which
  are not consecutive in the cycle.
