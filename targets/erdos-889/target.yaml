title: 'Erdős problem 889: Let $v(n,k)$ count the prime factors of $n+k$ which do
  not divide $n+i$ for $0\leq i < k$.'
informal: Let $v(n,k)$ count the prime factors of $n+k$ which do not divide $n+i$
  for $0\leq i < k$. Is it true that $v_0(n)=\max_{k\geq 0}v(n,k)\to \infty$ as $n\to
  \infty$?
