  (that is, $A$ has no isosceles triangles, de'
informal: Is it true that if $A\subset \mathbb{R}^2$ is a set of $n$ points such that
  every subset of $3$ points determines $3$ distinct distances (that is, $A$ has no
  isosceles triangles, degenerate ones included) then $A$ determines at least $f(n)n$
  distinct distances, for some function $f$ with $f(n)\to \infty$?
