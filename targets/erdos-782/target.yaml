id: erdos-782
title: 'Erdős problem 782, part i: Do the squares contain arbitrarily long quasi-progressions?'
informal: Do the squares contain arbitrarily long quasi-progressions? That is, does
  there exist some constant $C>0$ such that, for any $k$, the squares contain a sequence
  $x_1,\ldots,x_k$ where, for some $d$ and all $1\leq i<k$, $$x_i+d\leq x_{i+1}\leq
  x_i+d+C.$$ A question of Brown, Erdős, and Freedman [BEF90]. This is the first question.
  Here $C$ and $d$ are positive integers; $d\geq 1$ excludes constant sequences.
