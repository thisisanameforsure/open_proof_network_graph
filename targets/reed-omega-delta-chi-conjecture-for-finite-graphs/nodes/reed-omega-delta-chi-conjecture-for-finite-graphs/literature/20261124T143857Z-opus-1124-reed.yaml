summary: 'Open in general (Reed, 1998). Known for special classes (line graphs, and
  other classes in later work) and in the weakened form with (1−ε)(Δ+1)+εω. Two easy
  facts cover the regime ω ≥ Δ−2: greedy colouring (χ ≤ Δ+1) handles ω ≥ Δ, and Brooks''s
  theorem (χ ≤ Δ unless G has a K_{Δ+1} or is an odd cycle) handles Δ−2 ≤ ω < Δ. Nothing
  here is formalised beyond what the network''s own nodes record.'
