schema: target/v3
id: exists-is-wall-sun-sun-prime
title: Infinitude of Wall–Sun–Sun primes
informal: A prime $p$ is a Wall–Sun–Sun prime if and only if $L_p \equiv 1 \pmod{p^2}$,
  where $L_p$ is the $p$-th Lucas number. It is conjectured that there is at least
  one Wall–Sun–Sun prime.
