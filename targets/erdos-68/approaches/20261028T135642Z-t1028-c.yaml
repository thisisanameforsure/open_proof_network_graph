route: 'Common-denominator route: if S = p/q, then q*L_N*(tail after N) is a positive
  integer for every N, with L_N = lcm(n!-1 : 2<=n<=N); a contradiction needs q*L_N*tail_N
  < 1 infinitely often. Refuted: gcd(N!-1,(N-1)!-1) divides (N!-1)-N((N-1)!-1) = N-1,
  so L_N >= (N!-1)((N-1)!-1)/(N-1) and L_N*tail_N >= ((N-1)!-1)(N!-1)/((N-1)((N+1)!-1)),
  which tends to infinity like (N-2)!/(N+1).'
