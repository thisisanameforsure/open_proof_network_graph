route: 'attack the residue step directly: fract(N!S) is decided by r_m = (m+1)...N
  mod (m!-1) for m between n_0(N) (m! > N) and n*(N) ~ N/2; try to force them on a
  subsequence. (a) r_m = 0 whenever N >= m!-1, so congruences on N force nothing;
  (b) Wilson at the prime p = n!-1 (not at N+1): for N = p-j the n-th residue is (-1)^j/(j-1)!
  mod p, one term pinned to any of n+1 values; (c) the two-sided form (digits of T
  = S-(e-2) eventually in {0, N-1, N}) has no checkable consequence'
