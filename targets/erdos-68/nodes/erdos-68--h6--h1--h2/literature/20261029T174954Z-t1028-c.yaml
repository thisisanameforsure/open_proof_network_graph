summary: 'No proof is known, and the step every recorded attack dies at is a named
  open problem. The statement: with S = sum_{n>=2} 1/(n!-1), for infinitely many N,
  2/(N+1) <= {N!·S} < 1 - 1/(N+1); equivalently (#1212, exact) the digit a_{N+1} =
  floor((N+1){N!·S}) of S in the factorial number system lies in [2, N-1] infinitely
  often. Since e-2 has every such digit 1, this is the statement (up to two edges
  of width < 1/N; #1227) that T = S - (e-2) = sum_{n>=2} 1/(n!(n!-1)) has infinitely
  often a factorial digit that is neither 0 nor one of the two top values; so a proof
  also shows S - e is irrational, strictly more than Erdős 68 asks. Where it reduces
  to (#1227, #1233): {N!·S} = {sum_{m<=n*(N)} r_m/(m!-1)} + O(1/N) with r_m = (m+1)(m+2)···N
  mod (m!-1) and n*(N) ~ N/2 + N/log N; the terms above n*(N) sum to < 1/N, r_m =
  0 whenever N >= m!-1, and the near-N terms are exact. So the hole is: the sum of
  about N/2 fractions r_m/(m!-1) with unknown numerators is infinitely often not within
  2/N of an integer. Why that is open: for p = m!-1 prime, r_m ≡ N!/m! (mod p), so
  r_m is N! mod p up to a unit, and even the one-term question of where N! lies modulo
  a prime is unsolved: Erdős''s conjecture that 2!,...,(p-1)! are never all distinct
  mod p is open (verified to 10^9), the number of distinct values of n! mod p is conjectured
  to be ~(1-1/e)p (Guy F11) with only a c·sqrt(p) lower bound proved (Grebennikov
  et al. 2024), and the character-sum methods (Garaev–Luca–Shparlinski 2004) control
  averages, never one residue. The hole needs ~N/2 such residues, to different moduli,
  jointly at precision 1/N. For the next contributor: a sub-core that says anything
  about the r_m is a statement about N! mod (m!-1) whose one-term case is open; a
  sub-core that avoids the r_m is the hole up to an edge. The record''s evidence (#1227)
  has it true at density ~0.9 in N for N <= 70. Related: erdos-68--h3--h2 implies
  this node; with erdos-68--h5 (proved) it implies erdos-68--h6--h1 and so the root.'
