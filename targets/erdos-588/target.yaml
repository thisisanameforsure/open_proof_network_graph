id: erdos-588
title: 'Erdős problem 588: Let $f_k(n)$ be minimal such that if $n$ points in $\mathbb{R}^2$
  have no $k+1$ points on a line then there must be at most $f_k(n)$ many lines containing
  at least $k$ points.'
informal: 'Let $f_k(n)$ be minimal such that if $n$ points in $\mathbb{R}^2$ have
  no $k+1$ points on a line then there must be at most $f_k(n)$ many lines containing
  at least $k$ points. Is it true that $$f_k(n) = o(n^2)$$ for $k \geq 4$? The case
  $k = 4$ is Erdős Problem 101. The restriction $k \geq 4$ is needed: see `Erdos588.erdos_588.variants.three_not_isLittleO`.'
