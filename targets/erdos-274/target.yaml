id: erdos-274
title: 'Erdős problem 274: If $G$ is a group, can there exist an exact covering of
  $G$ by more than one coset of different sizes?'
informal: 'If $G$ is a group, can there exist an exact covering of $G$ by more than
  one coset of different sizes? (i.e. each element is contained in exactly one of
  the cosets.) The conjectured answer is no: in every such exact covering, two of
  the subgroups have the same cardinality.'
