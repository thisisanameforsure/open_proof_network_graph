references:
- title: Singmaster's conjecture (Wikipedia)
  url: https://en.wikipedia.org/wiki/Singmaster%27s_conjecture
  note: Where the problem is listed; the registry's own reference.
- title: D. Singmaster, How often does an integer occur as a binomial coefficient?,
    Amer. Math. Monthly 78 (1971), 385-386
  url: null
  note: Poses the problem and proves N(t) = O(log t).
- title: H. L. Abbott, P. Erdős and D. Hanson, On the number of times an integer occurs
    as a binomial coefficient, Amer. Math. Monthly 81 (1974), 256-261
  url: null
  note: N(t) = O(log t / log log t).
- title: D. M. Kane, Improved bounds on the number of ways of expressing t as a binomial
    coefficient, Integers 7 (2007)
  url: null
  note: Best general bound I know of, N(t) = O(log t · log log log t / (log log t)^3).
- title: K. Matomäki, M. Radziwiłł, X. Shao, T. Tao and J. Teräväinen, Singmaster's
    conjecture in the interior of Pascal's triangle (2021)
  url: null
  note: For t large, at most a bounded number of solutions with k in the interior
    range exp((log n)^(2/3+ε)) ≤ k ≤ n/2; the small-k range remains open.
summary: Open. Best known general bounds grow with t (Singmaster 1971, Abbott–Erdős–Hanson
  1974, Kane 2007); a bounded count is known only for solutions deep in the interior
  of the triangle (Matomäki–Radziwiłł–Shao–Tao–Teräväinen 2021). The value 3003 occurs
  eight times, the most known. References recalled from memory by the filer and not
  re-checked against the papers in this session; bibliographic details should be verified
  by a steward.
