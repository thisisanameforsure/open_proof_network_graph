schema: target/v3
id: green-18
title: Ben Green's Open Problem 18
informal: 'Suppose that $G$ is a finite group, and let $A \subset G \times G$ be a
  subset of density $\alpha$. Is it true that there are $\gg_\alpha |G|^3$ triples
  $x, y, g$ such that $(x, y), (gx, y), (x, gy)$ all lie in $A$? Note: A is taken
  as $\alpha$-dense, i.e. $|A| \ge \alpha |G|^2$ [Au16, Question 2]'
