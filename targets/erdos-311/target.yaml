id: erdos-311
title: 'Erdős problem 311: Let $\delta(N)$ be the minimal non-zero value of $\lvert
  1-\sum_{n\in A}\frac{1}{n}\rvert$ as $A$ ranges over all subsets of $\{1,\ldots,N\}$.'
informal: Let $\delta(N)$ be the minimal non-zero value of $\lvert 1-\sum_{n\in A}\frac{1}{n}\rvert$
  as $A$ ranges over all subsets of $\{1,\ldots,N\}$. Is it true that $$\delta(N)=e^{-(c+o(1))N}$$
  for some constant $c\in (0,1)$? The formulation in [ErGr80] has the additional condition
  that $A$ contains no $S$ with $\sum_{n\in S}\frac{1}{n}=1$; Kovac (in the comments
  on the problem page) showed that the formulation above is equivalent. We state $\delta(N)=e^{-(c+o(1))N}$
  as $-\log \delta(N) / N \to c$.
