schema: target/v3
id: green-29
title: Ben Green's Open Problem 29
informal: '**Ben Green''s Open Problem 29 / [Br13, Problem 6.6].** Suppose that $A$
  is a $K$-approximate group (not necessarily abelian). Can one find a set $S$ (not
  necessarily contained in $A$) with $|S| \gg K^{-O(1)} |A|$ and $S^8 \subseteq A^4$?
  The stronger variant requiring $S \subseteq A$ is false; see `green_29.subset_counterexample`.
  The known result with $|S| \gg_K |A|$ is `green_29.variant`.'
