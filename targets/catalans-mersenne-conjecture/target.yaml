id: catalans-mersenne-conjecture
title: Conjectures about Mersenne primes
informal: The first five Catalan-Mersenne numbers $c_0, \ldots, c_4$ are known to
  be prime. Catalan conjectured that they are prime "up to a certain limit". Are all
  Catalan-Mersenne numbers $c_n$ with $n \geq 5$ prime?
