schema: target/v3
id: lebesgue-nagell
title: Catalan's conjecture and related Diophantine equations
informal: '**Lebesgue-Nagell Equation Conjecture** For any odd prime $p$, the only
  integer solutions $(x, y)$ to the equation $x^2 - 2 = y^p$ are $(x, y) = (\pm 1,
  -1)$. *Reference:* Ethan Katz and Kyle Pratt, "On the Lebesgue-Nagell equation $x^2
  - 2 = y^p$", [arXiv:2507.12397](https://arxiv.org/abs/2507.12397)'
