id: erdos-685
title: 'Erdős problem 685, part i: Let $\epsilon > 0$ and let $n$ be large depending
  on $\epsilon$.'
informal: Let $\epsilon > 0$ and let $n$ be large depending on $\epsilon$. Is it true
  that for all $n^{\epsilon} < k \leq n^{1-\epsilon}$ the number of distinct prime
  divisors of $\binom{n}{k}$ is $$(1+o(1))\, k \sum_{k < p < n} \frac{1}{p}?$$ The
  $o(1)$ is uniform in $k$.
