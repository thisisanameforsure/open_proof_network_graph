schema: target/v3
id: infinitely-many-thabit-primes
title: Thabit numbers and Thabit primes
informal: There are infinitely many exponents $n \in \mathbb{N}$ ([OEIS A002235](https://oeis.org/A002235))
  for which the Thabit number $K_n = 3 \cdot 2^n - 1$ is prime ([OEIS A007505](https://oeis.org/A007505));
  since `thabitNumber` is injective, this is equivalent to the infinitude of Thabit
  primes themselves. *Reference:* [Wikipedia](https://en.wikipedia.org/wiki/Thabit_number)
