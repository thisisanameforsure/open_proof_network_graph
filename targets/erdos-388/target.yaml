schema: target/v3
id: erdos-388
title: 'Erdős problem 388: Are there only finitely many solutions of $$\prod_{1\leq
  i\leq k_1}(m_1+i)=\prod_{1\leq j\leq k_2}(m_2+j)$$ with $k_1,k_2>3$ and $m_1+k_1\leq
  m_2$?'
informal: Are there only finitely many solutions of $$\prod_{1\leq i\leq k_1}(m_1+i)=\prod_{1\leq
  j\leq k_2}(m_2+j)$$ with $k_1,k_2>3$ and $m_1+k_1\leq m_2$? Here $m_1, m_2 \geq
  0$, so every factor is positive and the condition $m_1 + k_1 \leq m_2$ makes the
  two blocks disjoint. Negative $m_1$ would give trivial solutions such as $(-5)(-4)(-3)(-2)
  = 2 \cdot 3 \cdot 4 \cdot 5$. The source also asks to classify all solutions; see
  `Erdos388.erdos_388.variants.classification`.
