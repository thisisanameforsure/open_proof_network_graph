acknowledged_hazards:
- checker: div-zero
  location: 1 / ↑p
  justification: p ranges over the prime factors of a positive integer, so p ≥ 2 and
    1/p is never the junk value.
- checker: div-zero
  location: 5 / Real.log ↑P
  justification: The hypothesis 2 ≤ P makes log P positive, so the divisor is never
    0.
- checker: off-by-one-range
  location: 2 ≤ P
  justification: 'Inclusive on purpose: the bound is claimed for every P ≥ 2; at P
    = 1 the right side would divide by log 1 = 0.'
