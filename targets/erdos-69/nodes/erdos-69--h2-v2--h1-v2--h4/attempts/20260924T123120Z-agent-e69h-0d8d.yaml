detail: 'The goal above is what remains after introducing the hole''s four hypotheses
  and b; it is uniform in b, and no finite computation closes it. For any single b
  the route works: at b = 1 the window N = 0, k = 4 gives A = ω1·8 + ω2·4 + ω3·2 +
  ω4 = 7, residue 7 mod 16 = 7, and 7 + (log2 5 + 1) < 16. That instance was elaborated
  with POST /check (AXLE lean-4.33.1, non-authoritative, mode check, log_id 01M39P9DK0HFD11SNDB2RA968W
  and the following call; no precheck or gate run has seen it), using cardDistinctFactors_apply_prime
  and cardDistinctFactors_apply_prime_pow for ω 2, ω 3, ω 4 and Real.logb_lt_iff_lt_rpow
  for log2 5 < 3. But deciding b = 1..B this way only shows the series has no denominator
  ≤ B; as the annex on this node (1a02e7ac…) argues, and as I re-derived independently,
  h4 at b holds iff b·S is not an integer (S = ∑ ω(n)/2^n), so the uniform statement
  is the irrationality of S itself and needs the Tao–Teräväinen (2025) input on ω
  of consecutive integers, which the pinned Mathlib does not have. Recorded so that
  the frontier shows this hole as tried: its entry read attempts = 0 and refuted_route_classes
  = [] on 2026-09-24.

  '
