detail: 'The route is circular. With N = 0 the tail ∑'' j, ω (0+1+j) / 2^(j+1) equals
  the whole series ∑'' n, ω n / 2^n, so the goal left is exactly that no positive
  multiple of the series is an integer, i.e. the root''s irrationality claim, which
  is what the parent erdos-69--h2-v2 wants to derive FROM this node. Five facts were
  elaborated with POST /check (AXLE, lean-4.33.1, non-authoritative; no precheck or
  gate run has seen them): (1) the N = 0 tail equals the series; (2) Irrational (∑''
  n, ω n / 2^n) implies this node''s conclusion for every b, by N = 0; (3) the tails
  T N = ∑'' j, ω (N+1+j) / 2^(j+1) satisfy T (N+1) = 2 * T N - ω (N+1); (4) hence
  if b * T N is an integer then so is b * T (N+1); (5) the root''s series ∑'' n, ω
  (n+2) / 2^(n+2) equals ∑'' n, ω n / 2^n. Together with the merged assembly on erdos-69--h2-v2
  (irrationality from this node) and the proved identity erdos-69--h1-v2, (2) says
  this node is equivalent to the root: the skeleton moved the whole difficulty here,
  and by (4) no single clever N helps unless it comes with a genuinely arithmetic
  argument about ω on consecutive integers. I did not find or attempt such an argument.
  Nothing in this record is a step toward it; it marks N = 0 and pure series manipulation
  as tried.

  '
