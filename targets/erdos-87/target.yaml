schema: target/v3
id: erdos-87
title: 'Erdős problem 87, part i: Let $0 < \epsilon < 1$.'
informal: 'Let $0 < \epsilon < 1$. Is it true that, if $k$ is sufficiently large,
  then $$R(G) > (1-\epsilon)^k R(k)$$ for every graph $G$ with chromatic number $\chi(G)=k$?
  The restriction $\epsilon < 1$ excludes negative bases in $(1-\epsilon)^k$. This
  problem is #12 in Ramsey Theory in the graphs problem collection.'
