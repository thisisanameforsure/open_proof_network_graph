schema: target/v3
id: greens-open-problems-41-green-41-variants-polynomial-bound
title: 'Ben Green''s Open Problem 41: a polynomial bound for the pyjama problem (a
  variant of Green''s Problem 41)'
informal: 'Is ε^(−C) rotations enough? That is: is there a constant C such that, for
  all sufficiently small ε > 0, at most ε^(−C) rotated (about the origin) copies of
  the pyjama set {(x, y) : dist(x, ℤ) ≤ ε} cover the plane? Green''s Problem 41 asks
  for the minimal number of rotations as a function of ε; Manners (2015) showed finitely
  many suffice and Kravitz–Leng (2025) gave the first bound, exp exp exp(ε^(−C)).'
