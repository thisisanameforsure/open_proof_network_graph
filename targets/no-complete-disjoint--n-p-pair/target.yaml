schema: target/v3
id: no-complete-disjoint--n-p-pair
title: Complete disjoint NP pairs
informal: '**There is no complete disjoint NP pair** (Razborov [Ra94]; Pudlák''s conjecture
  `DisjNP` [Pu17]). No disjoint NP pair is complete under polynomial-time many-one
  reductions of pairs. This is the strongest of the "incompleteness in the finite
  domain" conjectures: it implies that no length-optimal propositional proof system
  exists [Ra94, KMT03], hence `NP ≠ coNP` and `P ≠ NP`. Equivalently [Pu17], for every
  consistent polynomial-time axiomatized theory `T ⊇ S¹₂` some disjoint NP pair is
  not provably disjoint in `T`.'
