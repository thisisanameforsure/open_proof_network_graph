id: bing-borsuk-conjecture
title: The Bing-Borsuk Conjecture
informal: 'The Bing-Borsuk Conjecture: every $n$-dimensional homogeneous absolute
  neighborhood retract is a topological $n$-manifold. A topological space $X$ is an
  $n$-dimensional manifold when `T2Space X ∧ Nonempty (ChartedSpace (Fin n → ℝ) X)`.
  The hypothesis `[MetrizableSpace X]` implies `T2Space X` so this does not appear
  in the conclusion.'
