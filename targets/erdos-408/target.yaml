schema: target/v3
id: erdos-408
title: 'Erdős problem 408, part i: Let $\phi(n)$ be the Euler totient function and
  $\phi_k(n)$ be the iterated $\phi$ function, so that $\phi_1(n)=\phi(n)$ and $\phi_k(n)=\phi(\phi_{k-1}(n))$.'
informal: 'Let $\phi(n)$ be the Euler totient function and $\phi_k(n)$ be the iterated
  $\phi$ function, so that $\phi_1(n)=\phi(n)$ and $\phi_k(n)=\phi(\phi_{k-1}(n))$.
  Let $$f(n) = \min\{k : \phi_k(n)=1\}.$$ Does $f(n)/\log n$ have a distribution function?
  We ask for a distribution function $F$ (non-decreasing, with $F(-\infty) = 0$ and
  $F(+\infty) = 1$) such that, for every continuity point $c$ of $F$, the set $\{n
  : f(n)/\log n \leq c\}$ has natural density $F(c)$. For $n \leq 1$ the quotient
  is $0$ in Lean, which does not affect densities. Erdős, Granville, Pomerance and
  Spiro [EGPS90] proved that the answer is yes, conditional on a form of the Elliott–Halberstam
  conjecture.'
