id: burning-number-conjecture
title: The burning number conjecture
informal: '**The burning number conjecture** (Bonato–Janssen–Roshanbin [BJR16]). Every
  connected graph on `n` vertices can be burned in at most `⌈√n⌉` rounds: fires started
  at one new vertex per round, each spreading to all neighbouring vertices every round,
  can burn the whole graph in `⌈√n⌉` rounds.'
