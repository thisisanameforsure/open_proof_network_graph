schema: target/v3
id: conjecture-1-3-to-2-3
title: The $\frac 1 3$–$\frac 2 3$ conjecture
informal: Does every finite partially ordered set that is not totally ordered contain
  two elements $x$ and $y$ such that the probability that $x$ appears before $y$ in
  a random linear extension is between $\frac 1 3$ and $\frac 2 3$? The set of all
  total order extensions is represented as order preserving bijections $P$ of $1,
  ..., n$.
