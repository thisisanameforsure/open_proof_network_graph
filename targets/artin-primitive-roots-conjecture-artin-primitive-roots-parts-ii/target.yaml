schema: target/v3
id: artin-primitive-roots-conjecture-artin-primitive-roots-parts-ii
title: Artin's conjecture on primitive roots
informal: '**Artin''s Conjecture on Primitive Roots**, second half. Write $a = a_0
  b^2$ where $a_0$ is squarefree. Under the conditions that $a$ is not a perfect power
  and $a_0\not\equiv 1\pmod{4}$ (sequence A85397 in the OEIS), the density of the
  set $S(a)$ of primes $p$ such that $a$ is a primitive root modulo $p$ is independent
  of $a$ and equals Artin''s constant.'
