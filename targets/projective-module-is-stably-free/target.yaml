schema: target/v3
id: projective-module-is-stably-free
title: Algebraic consequences of the Farrell–Jones conjecture
informal: '**Vanishing of the reduced projective class group for integral group rings.**
  If `G` is torsion-free, that is, if its only element of finite order is `1`, then
  every finitely generated projective module over `ℤ[G]` is stably free. This is the
  stable-freeness form of the vanishing of $\widetilde K_0(\mathbb{Z}[G])$, which
  is the conclusion of Theorem 0.2 (ii) of [BLR08] for the regular ring $\mathbb{Z}$.
  That theorem assumes the K-theoretic Farrell–Jones conjecture for `G` with coefficients
  in `ℤ`.'
