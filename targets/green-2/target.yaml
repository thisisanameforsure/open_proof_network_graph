id: green-2
title: Ben Green's Open Problem 2
informal: Let $A \subset \mathbf{Z}$ be a set of $n$ integers. Is there a set $S \subset
  A$ of size $(\log n)^{100}$ such that the restricted sumset$S \hat{+} S$ is disjoint
  from $A$?
