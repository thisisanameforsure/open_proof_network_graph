id: erdos-623
title: 'Erdős problem 623: Let $X$ be a set of cardinality $\aleph_\omega$ and $f$
  be a function from the finite subsets of $X$ to $X$ such that $f(A)\not\in A$ for
  all $A$.'
informal: Let $X$ be a set of cardinality $\aleph_\omega$ and $f$ be a function from
  the finite subsets of $X$ to $X$ such that $f(A)\not\in A$ for all $A$. Must there
  exist an infinite $Y\subseteq X$ that is independent - that is, for all finite $B\subset
  Y$ we have $f(B)\not\in Y$?
