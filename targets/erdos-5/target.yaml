id: erdos-5
title: 'Erdős problem 5: Let $C\geq 0$.'
informal: 'Let $C\geq 0$. Is there an infinite sequence of $n_i$ such that $$\lim_{i\to
  \infty}\frac{p_{n_i+1}-p_{n_i}}{\log n_i}=C?$$ We formalise "an infinite sequence
  of $n_i$" as a strictly monotone sequence of indices `n : ℕ → ℕ`. Note that the
  numerator is the gap between the two *consecutive* primes $p_{n_i}$ and $p_{n_i+1}$,
  which is `primeGap (n i)`, and not the gap between the primes indexed by two consecutive
  members of the sequence.'
