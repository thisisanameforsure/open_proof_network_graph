id: balanced-primes-order
title: Balanced prime conjecture
informal: Let $p_k$ be the $k$-th prime number. Are there infinitely many $n$ such
  that $p_n = \dfrac{\sum_{i = 1} ^ k p_{n - i} + p_{n + i}}{2*k}$?
