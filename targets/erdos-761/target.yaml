id: erdos-761
title: 'Erdős problem 761, part i: The dichromatic number of $G$, denoted by $\delta(G)$,
  is the minimum number $k$ of colours required such that, in any orientation of the
  edges of $G$, there is a $k$-colour'
informal: 'The dichromatic number of $G$, denoted by $\delta(G)$, is the minimum number
  $k$ of colours required such that, in any orientation of the edges of $G$, there
  is a $k$-colouring of the vertices of $G$ such that there are no monochromatic oriented
  cycles. Must a graph with large chromatic number have large dichromatic number?
  This question is due to Erdős and Neumann-Lara. We read it for finite graphs: for
  every $k$ there is $m$ such that every finite graph with $\chi(G)\geq m$ has $\delta(G)\geq
  k$.'
