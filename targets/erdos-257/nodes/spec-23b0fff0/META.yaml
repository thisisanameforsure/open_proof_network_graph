acknowledged_hazards:
- checker: div-zero
  location: 1 / (2 ^ ↑n - 1)
  justification: The divisor is zero only at n = 0, where Lean's junk value makes
    the term 0, the convention every node of this target uses.
- checker: div-zero
  location: ↑p / ↑q
  justification: q is a natural number with the hypothesis 0 < q, so the division
    is by a positive real; p / q is the rational value of the sum.
- checker: div-zero
  location: ↑{a | a ∈ A ∧ a ∣ j + i + 1}.ncard / 2 ^ (i + 1)
  justification: The divisor 2^(i+1) is a positive real for every natural i.
- checker: nat-sub
  location: j - m
  justification: m ranges over Finset.range (j + 1), so m ≤ j and the natural-number
    subtraction j - m is exact; 2^(j-m) is the weight of the m-th coefficient scaled
    to position j.
- checker: off-by-one-range
  location: Finset.range (j + 1)
  justification: The finite sum runs over m = 0, …, j inclusive, the coefficients
    up to and including position j; the m = 0 term is 0 because the counted set is
    guarded by 0 < m.
