exhibit: "import Mathlib\n\n/-! Exhibit: the statement of `variant-5274cf38--h1--h1`\
  \ is false at `P = 1`, because\n`p % 1 = 0` for every `p`, so no nonempty set of\
  \ primes meets `p % P = 1`. The intended\nhypothesis is `2 ≤ P` (or the congruence\
  \ `p ≡ 1 [MOD P]`). -/\n\ntheorem exhibit_variant_5274cf38__h1__h1_false :\n   \
  \ ¬ (∀ (P : ℕ), (0 : ℕ) < P →\n      ∃ (m₀ : ℕ), ∀ (m : ℕ), m₀ ≤ m →\n        ∃\
  \ (S : Finset ℕ), S.card = m * m ∧\n          ∀ p ∈ S, Nat.Prime p ∧ p % P = (1\
  \ : ℕ) ∧ (2 : ℕ) ^ m < p ∧ p ≤ (2 : ℕ) ^ (m + m * m)) := by\n  intro h\n  obtain\
  \ ⟨m₀, hm⟩ := h 1 Nat.one_pos\n  obtain ⟨S, hc, hS⟩ := hm (m₀ + 1) (Nat.le_succ\
  \ m₀)\n  have hpos : 0 < S.card := by rw [hc]; positivity\n  obtain ⟨p, hp⟩ := Finset.card_pos.mp\
  \ hpos\n  have h1 := (hS p hp).2.1\n  simp [Nat.mod_one] at h1\n"
