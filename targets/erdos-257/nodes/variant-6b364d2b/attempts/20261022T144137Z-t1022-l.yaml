detail: 'Not attempted in Lean; recorded so the next contributor does not pay to rediscover
  why. The first two steps are elementary and could be proved here: (1) the Lambert
  identity Σ_p 1/(2^p - 1) = Σ_{n ≥ 1} ω(n)/2^n (expand each term as a geometric series
  and swap sums; D''s helper on the board does it for general A); (2) if the sum equals
  a/b, then for every N the tail τ_N = Σ_{k ≥ 1} ω(N+k)/2^k lies in (1/b)ℤ, since
  2^N·(a/b) minus the integer Σ_{n ≤ N} ω(n) 2^(N-n) is τ_N. A partial with those
  two as proved steps leaves one hole, "for every b ≥ 1 there is N with τ_N ∉ (1/b)ℤ",
  and that hole is not smaller than the node: it is the whole of the paper''s analytic
  content (quantitative control of linear combinations of ω(n+1), …, ω(n+H) over n,
  which in the paper rests on correlation estimates for multiplicative functions).
  Splitting it further after the paper''s own propositions would need ω-correlation
  and logarithmic-density statements that Mathlib does not have and that could not
  be stated faithfully without the paper open line by line; a hole stated loosely
  would be manufactured content. So no partial was filed. The honest next step is
  a contributor who reads §5 and states its propositions as holes, each with its page
  and equation number; the elementary steps (1) and (2) above are then private helpers
  of the assembly.

  '
