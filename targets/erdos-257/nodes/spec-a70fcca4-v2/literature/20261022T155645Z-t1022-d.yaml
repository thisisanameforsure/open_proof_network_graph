  url: https://www.erdosproblems.com/forum/thread/257
  note: For base 2 the subsum set has empty interior but positive measure, so heuristically
    it 'likely contains' dyadic rationals; this cannot be made rigorous by measure
    alone, since Boes–Darst–Erdős give fat Cantor sets with no rationals. For bases
    t ≥ 3 the subsum sets have measure zero.
summary: 'Open: nothing in print decides whether 1/2 (or any rational) is an infinite
  subset sum. If true, it refutes Erdős 257. Evidence: the greedy walk for 1/2 survives
  to depth 10^8 (Hong, unrefereed); the subsum set has measure 1 (Nitecki Thm 4 with
  Kovač–Tao Remark 4.1), so a ''random'' real lies in it with probability about 0.62,
  but the rationals are a null set and positive measure alone decides nothing. Kovač
  (forum, Aug 2025) expects the base-2 set to contain dyadic rationals such as 1/2,
  heuristically; for bases t ≥ 3 the set is null and he expects no rationals.'
