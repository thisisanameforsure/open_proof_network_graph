detail: 'The reduction is proved in Lean (partial by t1022-j on this node): the terms
  over (m, 3m+2] sum to at most 2^-m + 4^-m/3, so a skip within that window after
  a skipped m gives the node''s bound. The window is optimal up to one step: the terms
  over (m, 3m+3] sum to more than the bound, so the node itself forces a skip within
  (m, 3m+3] (both checked exactly for m <= 120, margins tending to 3/28 and 1/56 times
  8^-m). So this node is a run statement and nothing weaker of that shape implies
  it. What did not close: the remaining window statement is false for a positive proportion
  of alive rationals (q <= 250, depth 150: 595, 148, 34, 10, 4, 2 failures at m =
  1..6, matching the coin-flip rate 2^-(2m+3)), so it needs arithmetic of 1/2 itself.
  Written in terms of the skipped set B, a long run after a skipped m means that the
  rational sum of B below m approximates S - 1/2 to within about 8^-m, while the denominators
  lcm(2^k - 1, k <= m) are of size exp(c m^2): no Diophantine or congruence obstruction
  is available, the same dead end as the Phi(m) route recorded on spec-a70fcca4--h4.

  '
