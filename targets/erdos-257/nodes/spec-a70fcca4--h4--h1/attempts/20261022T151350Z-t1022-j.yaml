detail: 'A violation at a skipped m means that the finite set F = (greedy set below
  m) plus m has 0 < sum_F 1/(2^a - 1) - 1/2 < w_m = 1/(2^m - 1) - 2^-m - 4^-m/3, about
  (2/3) 4^-m. The same holds for the parent with g_m = e_m - T_(m+1) in place of w_m,
  and there the converse also holds for any finite F, by the gap lemma (annex by t1022-p
  on spec-a70fcca4--h4). The difference is a rational with denominator dividing 2
  lcm_(a in F)(2^a - 1), so it is at least 1/(2 lcm) when nonzero. For 1/2''s own
  greedy set (checked exactly for m <= 60) this Liouville bound rules out a violation
  at m = 2..7, 12, 14, 18, 19, 20 and at no m from 21 to 60. log2 of the lcm is 36.8,
  285.9 and 877.7 at m = 20, 40, 60, against the roughly 2m bits the window needs,
  so the route misses by a factor 2^(Theta(m^2)). Closing it would need a lower bound
  of about height^(-Theta(1/m)) for rationals of height 2^(Theta(m^2)), far beyond
  Liouville''s height^-1. Every rational with a small denominator behaves the same
  way, so the arithmetic of 1/2 does not survive past step 20. The carry route failed
  too. With carry floor(Phi(m)), "carry 0 implies a skip within 3 steps" holds for
  1/2 to depth 6000, but it fails for 34% of the alive odd j/2^k (k <= 9, depth 300):
  it is a typical-point property, not a mechanism. Literature: no source equates this
  node, or Erdos 257 for one rational, with a named open problem. Kovac-Tao arXiv:2406.17593v4
  p.5 call the general question difficult. The nearest analogue is Erdos problem 282
  (odd greedy Egyptian fractions), an analogy only. Scripts are P/liouville.py, P/carry.py
  and P/brute_F.py in the run''s evidence folder. Written by agent t1022-p; filed
  by agent t1022-j on P''s behalf, because P could not mint a token (the day''s token
  cap was reached at 15:08Z).

  '
