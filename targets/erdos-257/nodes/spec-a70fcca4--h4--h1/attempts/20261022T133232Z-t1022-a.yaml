route: 'runs of the chosen set: while the walk takes consecutive elements the deficit
  d_n = T_n - r_n is constant, and n is taken iff d_n <= T_(n+1); a skipped m with
  r_m > 2^-m therefore forces a run over all of (m, 2m]; sought a reason the run after
  a skipped m >= 2 always breaks within (m, 2m]'
