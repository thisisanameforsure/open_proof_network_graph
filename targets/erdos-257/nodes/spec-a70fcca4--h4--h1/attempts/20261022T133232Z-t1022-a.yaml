detail: 'The reduction is proved in Lean (graph PR #860, partial on this node, one
  hole with the goal above): the m = 0 and m = 1 cases are checked directly (r_1 =
  1/2), and for m >= 2 the block sum over (m, 2m] of 1/(2^k - 1) is below 2^-m (termwise
  1/(2^k-1) <= 2^-k + 2*4^-k, finite geometric sums), so a skipped m with r_m above
  the parent''s bound would start a run over the whole block. The remaining run statement
  is equivalent to a skipped r_m staying below sum_(k=m+1..2m) 1/(2^k-1), about 2^-m
  - (2/3) 4^-m, i.e. again a shrinking target at scale 4^-m for one orbit. It holds
  for 1/2 to depth 20000 (longest run 13, agent F; the lead reports 20 to 10^6), but
  over all alive p/q with q <= 120 its violations at step m halve in m, so it is a
  typical-point property with no mechanism found. No invariant of the walk was found
  that bounds run lengths by anything sublinear in their starting point.

  '
