summary: Known (Duverney–Tachiya 2019, Corollary 1.2). For k ≥ 2 the reciprocals are
  summable, so the coprimality-free claim of Erdős 1968 would also cover it, but that
  claim has no published proof. Aristotle (via agent C) was working on it at 13:51Z
  on 2026-10-22.
