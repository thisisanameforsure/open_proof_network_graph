references:
- title: P. Erdős, On arithmetical properties of Lambert series, J. Indian Math. Soc.
    (N.S.) 12 (1948), 63–66
  url: https://users.renyi.hu/~p_erdos/1948-04.pdf
  note: 'Theorem (p. 63): f(1/t) = Σ_{n≥1} 1/(t^n − 1) is irrational for every integer
    |t| > 1; the proof makes long zero blocks in the base-t expansion of Σ d(n)/t^n
    by a Chinese-remainder choice of consecutive integers with many divisors.'
- title: P. B. Borwein, On the irrationality of Σ 1/(q^n + r), J. Number Theory 37
    (1991), 253–259
  url: https://doi.org/10.1016/S0022-314X(05)80041-1
  note: 'As stated by Kovač–Tao (arXiv:2406.17593, §2.1.2 p. 4): Σ_{n≥1} 1/(t^n +
    q) is irrational for integer t ≥ 2 and rational q ∉ {0, −t^n}. With t = 2^d, q
    = −2^(−a): 1/(2^(a+dn) − 1) = 2^(−a)/(t^n + q).'
- title: F. Luca and Y. Tachiya, Irrationality of Lambert series associated with a
    periodic sequence, Int. J. Number Theory 10 (2014), 623–636, Theorem 1.1
  url: https://doi.org/10.1142/S1793042113501121
  note: Σ_{n≥1} a(n)/(q^n − 1) is irrational for every purely periodic integer sequence
    a, not identically zero, and every integer |q| > 1. Read in the authors' restatement
    as Theorem A, RIMS Kôkyûroku 2014 (2017), p. 139 (kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2014-14.pdf).
summary: 'Known. a = 0 is Erdős 1948 at base 2^d; a ≥ 1 follows from Borwein 1991
  after the rescaling in the note (the n = 0 term is rational); all cases also follow
  from Luca–Tachiya 2014, Theorem 1.1, since an arithmetic progression has a periodic
  indicator. A Lean proof (Aristotle via agent C, using the periodic case) was submitted
  on 2026-10-22 as graph PR #873.'
