contributor: t1023-f2
detail: 'Partial PR #957 proves this node from one hole (tt_sec5_setup): quantitative
  Lemma 5.2 (Aristotle), Mertens'' second theorem on S1 (t1022-u), and t1022-w''s
  κ1, (5.19), S0 and variance steps are proved in the assembly. Not done: splitting
  the remaining hole into separate κ2 (§5.8), κ3 (§§5.12-5.14, via Theorem 3.1(i)),
  κ4 (§5.9), κ5 (§5.10) holes. Those estimates are about the same random n, so as
  long as N_s is existential they cannot be separate holes; separating them needs
  the §5.5-5.6 construction (the parameters (5.22)-(5.29) with floors chosen so the
  Lemma 5.2 window holds for all large x, the discriminant W, W♭, N_s = n in [x/2,x]
  with (5.5) and W♭ | n) written inline in each hole, plus a set-up hole for CRT and
  (5.35). That is the natural next partial, on variant-6b364d2b--h1--h1. Theorem 3.1(i)
  cannot be a hole here: only §5.14 would use it.'
failure_class: budget-exhausted
