summary: 'Open. The question is whether every infinite A gives an irrational sum;
  nothing in print decides it. Known cases, all affirmative: A = N (Erdős 1948, the
  Erdős–Borwein constant); every arithmetic progression dk and the even and the odd
  integers (Erdős 1948 at base 2^d, Borwein 1991, Tachiya 2004); any A with pairwise
  coprime elements and summable reciprocals (Erdős 1968, who says coprimality can
  be dropped but gives no details; a Lean proof of the coprimality-free case by W.
  Cook is linked from the registry file and has not been independently reviewed);
  the primes and the prime powers (Tao–Teräväinen 2025, Theorem 1.3, after Pratt 2024
  conditional on Hardy–Littlewood). Structure (Kovač–Tao 2024, Remark 4.1): each term
  exceeds the sum of all later terms, so the subset sums form a Cantor set of positive
  measure in which every point has exactly one representation; a rational with an
  even denominator can only be a sum over an infinite A, since finite sums have odd
  denominators. Kovač (forum, Aug 2025) expects the answer to be negative for base
  2 because the Cantor set is fat, while noting fat Cantor sets with no rationals
  exist (Boes–Darst–Erdős 1981), so no proof follows. Erdős''s stronger 1988 speculation
  with bounded perturbations 2^n - t_n is false (Kovač–Tao 2024, Theorem 2.5). Mixed
  bases admit rational sums (Kovač–Tao, Theorem 2.3), so the single base is essential.
  No AI system is recorded as having settled it (AlphaProof Nexus attempted erdos_257
  in 2026 and did not solve it). The formal statement is the affirmative reading;
  if Kovač''s expectation is right, the node''s theorem is false and a disproof would
  be an explicit infinite A with a rational sum, for which the unique expansion of
  1/2 (greedy) is the natural candidate and has been computed without stalling to
  depth 10^8 by Hong (2026, unrefereed).'
