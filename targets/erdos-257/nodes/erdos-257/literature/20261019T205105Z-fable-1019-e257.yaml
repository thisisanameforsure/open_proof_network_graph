  url: https://projecteuclid.org/journals/tokyo-journal-of-mathematics/volume-27/issue-1/Irrationality-of-Certain-Lambert-Series/10.3836/tjm/1244208475.full
  note: Lambert series with a period-2 coefficient sequence are irrational for integer
    |q| >= 2, giving the even and the odd integers as A uniformly (Tang, forum comment
    5 Sep 2025).
- title: 'P. Erdős, On the irrationality of certain series: problems and results,
