- title: 'T. F. Bloom, Erdős Problem #257, erdosproblems.com (page last edited 15
    Apr 2026; 7 forum comments)'
  url: https://www.erdosproblems.com/257
  note: 'Lists the problem as open in general. Remarks: A = N is Erdős 1948; primes
    and prime powers are Tao–Teräväinen 2025; Erdős 1968 covers pairwise coprime A
    with summable reciprocals; the t_n-perturbed speculation of Erdős 1988 is false
    (Kovač–Tao 2024).'
- title: P. Erdős, On arithmetical properties of Lambert series, J. Indian Math. Soc.
    (N.S.) 12 (1948), 63–66
  url: https://users.renyi.hu/~p_erdos/1948-04.pdf
  note: 'Theorem: for every integer |t| > 1, sum_n 1/(t^n - 1) = sum_n d(n)/t^n is
    irrational: the case A = N. Method: CRT choice of a block of consecutive integers
    with d(x+j) divisible by high powers of t, giving long zero blocks in the base-t
    expansion.'
- title: P. Erdős, On the irrationality of certain series, Math. Student 36 (1968),
    222–226
  url: https://www.renyi.hu/~p_erdos/1969-09.pdf
  note: 'Theorem: if the n_i are pairwise coprime and sum 1/n_i < oo then sum_i 1/(t^{n_i}
    - 1) is irrational for every t >= 2. Erdős writes that coprimality can be dropped
    by a more complicated argument (details not given) and that he knows no infinite
    A with a rational sum ''though it seems possible that this can happen''.'
- title: T. Tao and J. Teräväinen, Quantitative correlations and some problems on
    prime factors of consecutive integers, arXiv:2512.01739 (2025), Theorem 1.3
  url: https://arxiv.org/abs/2512.01739
  note: sum_p 1/(2^p - 1) = sum_n omega(n)/2^n is irrational (A = primes); the paper
    states the extension to prime powers (sum Omega(n)/2^n) and to any base b >= 2.
- title: V. Kovač and T. Tao, On several irrationality problems for Ahmes series,
    arXiv:2406.17593 (2024), Acta Math. Hungar. (2025)
  url: https://arxiv.org/abs/2406.17593
  note: 'Theorem 2.3: with two or more bases t_1 < ... < t_m and sum 1/(t_k - 1) >
    1 a rational mixed sum exists, so the single-base condition of #257 is sharp.
    Remark 4.1: for one base the tail is smaller than the term, so the subset sums
    form a Cantor set and at most countably many A could be counterexamples. Theorem
    2.5: Erdős''s 1988 speculation with bounded perturbations t_n is false.'
- title: P. B. Borwein, On the irrationality of sum 1/(q^n + r), J. Number Theory
    37 (1991), 253–259
  url: https://doi.org/10.1016/S0022-314X(05)80041-1
  note: Irrationality of sum_n 1/(q^n + r) for integer q >= 2 and rational r (r !=
    -q^n), by Padé approximants; with Erdős 1948 at base 4 it settles the even and
    the odd integers as A (Kovač, forum comment 5 Sep 2025).
- title: Y. Tachiya, Irrationality of certain Lambert series, Tokyo J. Math. 27 (2004),
