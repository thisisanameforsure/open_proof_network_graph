summary: 'Open. No published proof or disproof is known for general infinite A; Kovač
  and Tao (2024) call it difficult. Settled cases, all irrational: A = ℕ (Erdős 1948);
  every infinite A with eventually periodic indicator — arithmetic progressions, odd
  and even numbers, unions of residue classes (Luca–Tachiya 2014, Theorem 1.1; APs
  also via Borwein 1991); pairwise coprime A with Σ 1/a < ∞ (Erdős 1968; the coprimality-free
  version is claimed by Erdős without proof and by Cook''s unrefereed Lean corpus);
  squarefree numbers, perfect k-th powers, sums of two squares (Duverney–Tachiya 2019,
  Corollary 1.2); the primes (Tao–Teräväinen, Theorem 1.3). Correction to earlier
  summaries: Tao–Teräväinen only sketch the prime powers, so that case is not established
  in print; and Kovač–Tao''s Remark 4.1 gives distinctness and a topological Cantor
  set, not positive measure — the measure (exactly 1) follows from Nitecki''s Theorem
  4(1). Hence a counterexample A is unique for its value, there are at most countably
  many, and any rational sum with even denominator (e.g. 1/2) would need an infinite
  A. Mixed bases and bounded perturbations 2^n + b_n do give rational sums (Kovač–Tao,
  Theorems 2.3, 2.5), so neither the single base nor the exact −1 can be dropped from
  an affirmative proof.'
