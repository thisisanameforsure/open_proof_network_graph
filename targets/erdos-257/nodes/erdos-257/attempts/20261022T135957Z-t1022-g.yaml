route: Extend the denominator (Liouville) route of variant-1629563f from one divisibility
  chain to unions of several. For A a union of chains c_1, ..., c_r, the common denominator
  of the partial sum below m is the product of 2^(P_i(m)) - 1, where P_i(m) is the
  largest element of chain i below m, so the criterion applies as soon as the margin
  m - P_1(m) - ... - P_r(m) is unbounded along elements m of A.
