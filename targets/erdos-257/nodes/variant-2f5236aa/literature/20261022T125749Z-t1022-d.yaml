summary: 'Known since Erdős 1948 (the Erdős–Borwein constant 1.6067… is irrational);
  no proof is on this network. A Lean proof is claimed in W. Cook''s unrefereed corpus
  (Lean/Mathlib 4.29, a large development) and is not portable as one file. Erdős''s
  proof: choose, by the Chinese remainder theorem, a block of consecutive integers
  x+1, …, x+k whose divisor counts are divisible by high powers of 2; this forces
  long runs of zeros in the binary expansion of Σ d(n)/2^n without it terminating.'
