summary: 'Open. Given --h1 (a representation of a rational is the greedy one), this
  hole is equivalent to the root: it says the greedy representation of every rational
  is finite. Known cases of the root (A = ℕ, eventually periodic A, pairwise coprime
  A with Σ1/a < ∞, squarefree numbers, perfect powers, primes) each show only that
  particular A is not the greedy representation of a rational; none controls the greedy
  walk of a given rational.'
