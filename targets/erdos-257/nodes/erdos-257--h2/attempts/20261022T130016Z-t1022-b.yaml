outcome: refuted-route
route: 'Liouville''s denominator argument on the set G: if G sums to p/q then, for
  every m in G, q·L·(tail of G from m) is a positive integer, where L is any common
  multiple of the 2^a - 1 over a in G below m, while the tail is below 4·2^(-m); so
  2^m < 4q·L at every element m of G. This closes the hole for every G that is eventually
  lacunary of ratio two (proved in full: variant-d144ccc1, with the criterion variant-1629563f)
  and for nothing denser.'
