  location: ↑{a | a ∈ A ∧ a ∣ y + k + i + 1}.ncard / 2 ^ (i + 1)
  justification: The divisor 2^(i+1) is a positive real for every natural i.
- checker: nat-sub
  location: k - (i + 1)
  justification: i ranges over Finset.range k, so i + 1 ≤ k and the natural-number
    subtraction is exact; 2^(k-(i+1)) is the weight of the coefficient at position
    y+i+1 scaled to position y+k.
