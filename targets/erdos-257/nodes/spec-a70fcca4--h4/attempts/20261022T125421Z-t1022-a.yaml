route: 'arithmetic invariant on the scaled remainder: x_m = 2^m r_m = I_m - Phi(m)
  with I_m an integer and Phi(m) = sum over chosen a < m of 2^(m mod a)/(2^a - 1);
  sought a congruence or size reason keeping Phi(m) at least ~2^-m away from integers
  at skipped steps'
