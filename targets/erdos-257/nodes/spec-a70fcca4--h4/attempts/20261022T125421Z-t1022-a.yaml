  h0 : r 0 = 1 / 2

  hrs : ∀ (m : ℕ), r (m + 1) = if 1 / (2 ^ m - 1) ≤ r m then r m - 1 / (2 ^ m - 1)
  else r m

  m : ℕ

  hm : 2 ≤ m

  hlt : r m < 1 / (2 ^ m - 1)

  ⊢ ∃ n, m < n ∧ n ≤ 2 * m ∧ r n < 1 / (2 ^ n - 1)

