references:
- title: F. Luca and Y. Tachiya, Irrationality of Lambert series associated with a
    periodic sequence, Int. J. Number Theory 10 (2014), 623–636, Theorem 1.1
  url: https://doi.org/10.1142/S1793042113501121
  note: Σ_{n≥1} a(n)/(q^n − 1) is irrational for every purely periodic integer sequence
    a, not identically zero, and every integer |q| > 1. Read in the authors' restatement
    as Theorem A, RIMS Kôkyûroku 2014 (2017), p. 139 (kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2014-14.pdf).
- title: F. Luca and Y. Tachiya, Linear independence results for the values of divisor
    functions series, RIMS Kôkyûroku 2014 (2017), 138–150, Example 2 (p. 140)
  url: https://www.kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2014-14.pdf
  note: 'The odd integers: 1 and Σ 1/(q^(2n−1) − 1) (with further divisor sums) are
    linearly independent over ℚ.'
summary: 'Known: Luca–Tachiya 2014, Theorem 1.1, applied to the indicator of a purely
  periodic set; an eventually periodic infinite set differs from a nonempty purely
  periodic set in finitely many places, which adds a rational number. The reduction
  from eventually periodic to purely periodic is elementary (D is filing it as a partial
  with Luca–Tachiya''s case as the hole). On 2026-10-22 Aristotle (via agent C) produced
  a Lean proof of the purely periodic case.'
