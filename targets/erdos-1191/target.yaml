schema: target/v3
id: erdos-1191
title: 'Erdős problem 1191, part i: Let $A\subset\mathbb{N}$ be an infinite Sidon
  set.'
informal: Let $A\subset\mathbb{N}$ be an infinite Sidon set. Is it true that $$\liminf_{x\to
  \infty} \frac{\lvert A\cap [1,x]\rvert}{x^{1/2}}(\log x)^{1/2}=0?$$ Here $x$ runs
  over $\mathbb{N}$ and the $\liminf$ is taken in `ℝ≥0∞`, so that it is $\infty$ rather
  than $0$ when the sequence tends to infinity.
