id: erdos-813
title: 'Erdős problem 813: Let $h(n)$ be minimal such that every graph on $n$ vertices
  where every set of $7$ vertices contains a triangle must contain a clique on at
  least $h(n)$ vertices.'
informal: Let $h(n)$ be minimal such that every graph on $n$ vertices where every
  set of $7$ vertices contains a triangle must contain a clique on at least $h(n)$
  vertices. Estimate $h(n)$. In particular, do there exist constants $c_1, c_2 > 0$
  such that $$n^{1/3+c_1} \ll h(n) \ll n^{1/2-c_2}?$$ The lower half has a positive
  answer (`Erdos813.erdos_813.variants.lower`); the upper half is `Erdos813.erdos_813.variants.upper`.
