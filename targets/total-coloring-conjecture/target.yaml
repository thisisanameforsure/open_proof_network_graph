id: total-coloring-conjecture
title: The total colouring conjecture (Behzad 1965, Vizing 1968)
informal: '**The total colouring conjecture (Behzad 1965, Vizing 1968).** Every finite
  simple graph $G$ has a total colouring with at most $\Delta(G) + 2$ colours, i.e.
  $\chi''''(G) \le \Delta(G) + 2$, where $\Delta(G)$ is the maximum degree.'
