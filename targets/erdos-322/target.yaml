title: 'Erdős problem 322: Let $k\geq 3$ and $A\subset \mathbb{N}$ be the set of $k$th
  powers.'
informal: Let $k\geq 3$ and $A\subset \mathbb{N}$ be the set of $k$th powers. What
  is the order of growth of $1_A^{(k)}(n)$, i.e. the number of representations of
  $n$ as the sum of $k$ many $k$th powers? Does there exist some $c>0$ and infinitely
  many $n$ such that $$1_A^{(k)}(n) >n^c?$$
