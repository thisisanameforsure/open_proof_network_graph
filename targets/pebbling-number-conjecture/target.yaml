title: Pebbling number conjecture
informal: 'The pebbling number conjecture: the pebbling number of a Cartesian product
  of connected graphs is at most equal to the product of the pebbling numbers of the
  factors. See [Asplund, Hurlbert, and Kenter](https://arxiv.org/abs/1801.07808).'
