id: erdos-78
title: 'Erdős problem 78: Let $R(k)$ be the Ramsey number for $K_k$.'
informal: 'Let $R(k)$ be the Ramsey number for $K_k$. Give a constructive proof that
  $R(k) > C^k$ for some constant $C > 1$. Equivalently, give an explicit construction
  of graphs on $n$ vertices which contain no clique and no independent set of size
  $\geq c \log n$, for some constant $c > 0$. We formalise "explicit" as: the adjacency
  relation of the graph on $n$ vertices is decided by a single algorithm that runs
  in time polynomial in $n$ (see `explicitGraph`). This is the weakest reasonable
  notion ("weakly explicit"); even this is open. The strongly explicit version, with
  time polynomial in $\log n$, is `erdos_78.variants.strongly_explicit`. This problem
  is #4 in Ramsey Theory in the graphs problem collection.'
