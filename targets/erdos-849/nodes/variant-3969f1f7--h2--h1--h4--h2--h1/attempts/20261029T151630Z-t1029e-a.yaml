detail: 'The remaining hole --h1 is Stroeker–de Weger 1999 Theorem 3 (all integral
  points of (39), a rank-1 elliptic curve). Its proof is a linear form in elliptic
  logarithms (David''s bound) plus LLL reduction. Nothing in Mathlib formalises integral
  points on elliptic curves, and no elementary argument is known to me: (39) has real
  points along an asymptote of irrational slope (the real root of t³ + t² − 1 = 0
  governs k/(n−k)), so congruence or size arguments alone do not close it. Numerically
  no integral point beyond the eight with |u|,|v| < 2000 (C) and none with n−k−2 <
  300000 (A).'
