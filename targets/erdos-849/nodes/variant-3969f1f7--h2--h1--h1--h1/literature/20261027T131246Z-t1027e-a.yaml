summary: 'Known. The pair (2,3): Avanesov (1966) determined every integer solution
  of C(n,2) = C(m,3) (an elliptic curve); in the half triangle they are (16,10), (56,22),
  (120,36), values 120, 1540, 7140. Not formalised; a formalisation needs integral
  points on an elliptic curve.'
