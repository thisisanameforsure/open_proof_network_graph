  note: 'Proposition 1.9 (distance estimate): for ε > 0 and two solutions (n,m), (n'',m'')
    of C(n,m) = t in the left half, m'' − m ≪_ε exp(log^{2/3+ε}(n+n'')); and if m,
    m'' ≥ exp(log^{2/3+ε}(n+n'')) then also n'' − n ≪_ε exp(log^{2/3+ε}(n+n'')). Proved
    in Section 3 from the equidistribution estimate Proposition 1.12 (Section 4);
    DOI 10.1093/qmath/haac006.'
summary: 'Known (2022), not formalised. This hole is Proposition 1.9 of Matomäki–Radziwiłł–Shao–Tao–Teräväinen
  with ε = 1/20 (exponent 2/3 + 1/20 = 43/60), the implied constant written as an
  explicit C ≥ 0, and weakened to values a above a threshold a_1 (the proposition
  holds for every t); the paper''s signed differences m'' − m and n'' − n are stated
  as absolute values, which is the same by swapping the two solutions. It is the paper''s
  main work: a non-Archimedean argument counting solutions through the distribution
  of the fractional parts of n/p and m/p over random primes p (their Proposition 1.12,
  equidistribution), with the Taylor-expansion step kept for Proposition 1.10. Nothing
  of it is in Mathlib.'
