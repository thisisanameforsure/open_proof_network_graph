detail: Not decomposed, by choice. Prop 1.12 is a named statement and could be a hole,
  but the §3 argument from it to Prop 1.9 is the body of that section (exponential
  sums over primes of a phase built from the two solutions, with the parameter P between
  exp(log^{2/3+ε/2} n') and twice that) and has no stated intermediate results of
  its own, so any hole for it would be invented rather than cited. Mathlib has no
  exponential sums over primes, no Vaughan identity and no Vinogradov bound; the nearest
  formalised material is the prime number theorem. The node stays as Prop 1.9 itself,
  with its elementary companions --h3--h1--h2 and --h3--h1--h3 proved separately.
