  note: 'Theorem 1.3: for every ε > 0 and t sufficiently large depending on ε, C(n,m)
    = t has at most two solutions with exp(log^{2/3+ε} n) ≤ m ≤ n/2; take ε = 1/6.
    Remark 1.4: two is attained infinitely often (Lind''s family). Remark 1.7: the
    threshold is effective but unoptimised.'
summary: 'Known (2022), not formalised: for every sufficiently large a, at most two
  rows n hold a with exp((log n)^{5/6}) ≤ k ≤ n/2. This is Theorem 1.3 of Matomäki–Radziwiłł–Shao–Tao–Teräväinen
  with ε = 1/6 (they count solutions (n,k); each row of this set gives one, so rows
  ≤ solutions ≤ 2). The proof uses equidistribution of fractional parts over random
  primes and Kane-type estimates (their Propositions 1.9, 1.10, 1.12); far from Mathlib.
  Two is attained (Lind''s C(104,39) = C(103,40) lies in this region in both rows).'
