summary: 'Known: Bugeaud, Mignotte, Siksek, Stoll and Tengely (2008, Theorem 2) find
  every integral solution of Y(Y−1)/2 = X(X−1)(X−2)(X−3)(X−4)/120. This node is that
  theorem multiplied by 120. The proof uses linear forms in logarithms and a Mordell–Weil
  sieve, and has not been formalised.'
