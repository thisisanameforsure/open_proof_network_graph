references:
- title: T. Yamada, Necessary conditions for binomial collisions, arXiv:2002.07043
    (2020)
  url: https://arxiv.org/abs/2002.07043
  note: 'Theorem 1.1: if C(2N+δ, N−M) = C(2N+L, N−K) with δ ∈ {0,1}, 0 ≤ M < K < N/2
    and M ≤ 0.735K, then L > N(1.3132 log²(2N) − 2.00271). The proof uses N ≥ 500000,
    taken from BBdW 2017. A preprint; no journal version was found on 2026-10-29.'
- title: 'A. Blokhuis, A. E. Brouwer, B. M. M. de Weger, Binomial collisions and near
    collisions, Integers 17 (2017) #A64'
  url: https://arxiv.org/abs/1707.06893
  note: The search over n ≤ 10^6 that gives N ≥ 500000 for any unknown collision.
summary: 'Known, from a preprint: this node is the case L ≤ N of Yamada''s Theorem
  1.1. For N ≥ 500000 the bound N(1.3132 log²(2N) − 2.00271) is far above N, so the
  theorem rules out every collision in the node''s range. The proof uses explicit
  prime-gap results, estimates for the largest prime factor of a product of consecutive
  integers, and an explicit Stirling formula. It has not been formalised, and the
  preprint has not been refereed as far as is known.'
