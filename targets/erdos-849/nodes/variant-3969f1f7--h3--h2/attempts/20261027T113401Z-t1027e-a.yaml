detail: 'Not decomposed, by choice. Cor 2.3 is a named statement and could be a hole,
  but the only named inputs beyond it are about f_t, the real function with C(f_t(m),
  m) = t (the binomial coefficient continued to real n through the Gamma function):
  Prop 2.1 bounds f_t, f_t'' and f_t''''. Stating those faithfully needs that definition
  on the record first, and the step from the nearby-solution hypothesis to m ≥ n^{9/10}
  is a lemma extracted from the proof of Prop 1.10, not a stated result, so a hole
  for it would be invented rather than cited. The node therefore stays as Prop 1.10
  itself; its sibling --h3--h1 is decomposed one level further because its inputs
  (Prop 1.9, (1.5), (1.7)) are stated results and elementary facts.'
