contributor: t1027e-b
detail: 'The reduction is on the record (partials #1059 on this node, K = 1, B = 17,
  and #1072 on --h2--h1), kernel-checked, with every known piece a hole citing its
  theorem. What stops the route is the last hole: no collision C(n,k) = C(m,l) outside
  the nine solved pairs, the adjacent shape and the two computed ranges. Everything
  published for it is pair by pair: Siegel''s theorem (Beukers, Shorey, Tijdeman 1999)
  gives finitely many collisions for each fixed (k,l), ineffectively, and the solved
  pairs are nine separate curve computations. A bound on the number of columns holding
  one value needs uniformity in (k,l), which nothing in the literature supplies; and
  the hypothesis the route rests on (de Weger''s conjecture) is stronger than this
  node, implying Singmaster''s conjecture itself with four rows per value. So the
  route moves the open core into a named conjecture and no further. Brainstormed and
  rejected (B.md, 2026-10-27): finite k-ranges (absorbed by the existential K); uniform
  per-pair finiteness (r rows give C(r,2) collisions on distinct pairs, so a per-pair
  bound never bounds r); narrowing the region by MRSTT with smaller epsilon (a regress);
  Kane / Abbott-Erdos-Hanson / Cramer-conditional counts (all unbounded in t).

  '
