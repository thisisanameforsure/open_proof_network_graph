detail: 'The search (annex 9eb099be...cd25 on this node) covers every value up to
  10^37 with a row at k >= 4 and every value up to 10^28 for the (3,2) pair, and finds
  only the known coincidences: at most 3 middle rows (K = 1), 3 only for 3003; consistent
  with (K,B) = (1,3), (2,2), (5,1). But the statement quantifies over all a, and no
  finite search reaches it: a computation can only test candidate (K,B), never prove
  one. Combining the search with the completely solved pairs (k,l) (Avanesov; Pintér
  and de Weger; Bugeaud et al.; Stroeker and de Weger; Mordell) also fails, since
  those are finitely many pairs and the middle region has unboundedly many k as n
  grows. What would close it: an unconditional bound in 2 <= k <= exp((log n)^(2/3+e)),
  which Matomäki et al. (Quart. J. Math. 73 (2022), Remark 1.5) obtain only under
  de Weger''s conjecture. The exponent 5/6 is a choice: their Theorem 1.3 holds for
  every e > 0, so the true open region is K < k < exp((log n)^(2/3+e)) for every e
  > 0, and narrowing the exponent further changes nothing in kind.

  '
