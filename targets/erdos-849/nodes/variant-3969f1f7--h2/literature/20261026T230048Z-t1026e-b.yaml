references:
- title: K. Matomäki, M. Radziwiłł, X. Shao, T. Tao, J. Teräväinen, Singmaster's conjecture
    in the interior of Pascal's triangle, Quart. J. Math. 73 (2022) 1137–1177
  url: https://arxiv.org/abs/2106.03335
  note: 'Remark 1.5: assuming de Weger''s conjecture, at most one solution with 2
    ≤ k ≤ exp(log^{2/3+ε} n) for large values; no unconditional bound in this region
    is known. Remark 1.6: Kane''s arguments give O_ε(log t / (log log log t)^3) solutions
    for exp(log^{1/2+ε} n) ≤ k ≤ n^{5/6} — growing, so not a bound B.'
- title: 'A. Blokhuis, A. E. Brouwer, B. de Weger, Binomial collisions and near collisions,
    Integers 17 (2017) #A64'
  url: https://arxiv.org/abs/1707.06893
  note: 'Conjecture 2.1 (de Weger 1997): no collisions beyond the known list; Theorem
    2.2: none new with C(n,k) ≤ 10^60 or n ≤ 10^6. Collision equations C(n,k) = C(m,l)
    are completely solved for (k,l) = (2,3), (2,4), (2,5), (2,6), (2,8), (3,4), (3,6),
    (4,6), (4,8) (Avanesov 1966; Pintér 1995, de Weger 1996; Bugeaud–Mignotte–Siksek–Stoll–Tengely
    2008; Stroeker–de Weger 1999; Mordell 1963) — finitely many fixed pairs, which
    cannot bound the count over all k at once.'
- title: D. Singmaster, How often does an integer occur as a binomial coefficient?,
    Amer. Math. Monthly 78(4) (1971) 385–386
  url: https://doi.org/10.1080/00029890.1971.11992769
  note: Singmaster's conjecture (bounded multiplicity) implies this statement.
summary: 'Open: this is the core of Singmaster''s conjecture once the interior is
  handled by Matomäki et al. No unconditional bound on the number of rows holding
  a value with K < k < exp((log n)^{5/6}) is known; it follows from de Weger''s conjecture
  (Matomäki et al., Remark 1.5). Exact searches find at most 3 such rows (K = 1) for
  every value up to 10^37 (only 3003 needs 3), and Blokhuis–Brouwer–de Weger find
  no new collision up to 10^60.'
