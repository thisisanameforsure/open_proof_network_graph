summary: 'Known: Stroeker and de Weger solved 15u³ − 15u = v³ − 4v² + 3v completely
  (Math. Comp. 1999, Theorem B36, restated in Acta Arith. 1999 §7.1). The eleven listed
  points are all its integral solutions. The proof uses linear forms in elliptic logarithms
  and has not been formalised.'
