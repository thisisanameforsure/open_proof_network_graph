summary: 'Known: Stroeker and de Weger (1999, Theorem 3) list every integral point
  of the plane cubic (39) and show there are no others, by linear forms in elliptic
  logarithms and LLL reduction. The proof is not elementary and has not been formalised.
  This node is that theorem stated over ℤ, word for word.'
