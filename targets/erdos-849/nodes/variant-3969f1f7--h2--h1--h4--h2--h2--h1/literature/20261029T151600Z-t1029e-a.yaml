  note: '§7.1, Theorem 4: the only integral solutions of (40) u³−3u²v+4uv²−v³+3u²−7uv+4v²+2u−3v
    = 0 are the nine points listed in this node. (40) comes from C(n,k) = C(n−2,k+1)
    with u = k, v = n, and (1,6) is C(6,1) = C(4,2). The curve has rank 1 and torsion
    of order 2; the proof is by elliptic logarithms.'
