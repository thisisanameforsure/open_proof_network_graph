  note: Theorem 2.2 cites this result for the shape (m,l) = (n−2,k+1).
summary: 'Known: Stroeker and de Weger (1999, Theorem 4) list every integral point
  of the plane cubic (40) and show there are no others, by linear forms in elliptic
  logarithms. The proof is not elementary and has not been formalised. This node is
  that theorem stated over ℤ, word for word.'
