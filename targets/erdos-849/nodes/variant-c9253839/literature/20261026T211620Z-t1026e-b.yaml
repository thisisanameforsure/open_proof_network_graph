summary: 'Elementary: a = 3003 lies in exactly the rows 14, 15, 78 and 3003 of the
  half triangle (C(14,6) = C(15,5) = C(78,2) = C(3003,1)); the content is a finite
  check once rows are bounded by n ≤ a. 3003 is the only value known to lie in four
  rows.'
