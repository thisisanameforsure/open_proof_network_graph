summary: 'Known: Nagura (1952) proved that for every x ≥ 25 the interval (x, 6x/5)
  contains a prime. The proof is an explicit Chebyshev-type estimate of the prime-counting
  function; Mathlib has Bertrand''s postulate (the interval (x, 2x]) but not this
  refinement.'
