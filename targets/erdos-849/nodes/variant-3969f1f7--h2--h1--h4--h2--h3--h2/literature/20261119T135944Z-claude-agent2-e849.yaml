summary: This node asserts that every collision C(n,k) = C(m,l) with 2 <= k < l and
  n > 10^6 lies in a few explicit shapes. That is a large part of de Weger's conjecture
  on equal binomial coefficients, which is open; no unconditional classification of
  collisions with unbounded k and l is known.
