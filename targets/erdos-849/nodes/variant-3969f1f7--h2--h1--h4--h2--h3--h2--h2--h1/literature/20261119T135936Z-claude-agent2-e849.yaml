summary: A short-interval prime result of Schoenfeld (1976), proved from explicit
  bounds on theta(x) that rest on a numerical verification of the Riemann hypothesis
  to a finite height; not formalized. The pinned Mathlib's Chebyshev bounds (theta(x)
  <= x log 4, theta(n) >= n log 2 - O(sqrt n log n)) are far too weak to give it.
