schema: target/v3
id: infinitely-many-leinster-groups
title: Leinster Groups
informal: '**Conjecture:** Are there infinitely many Leinster groups? This asks whether
  there exist infinitely many (non-isomorphic) finite groups that are Leinster groups.
  Formalized via the negation of "Does there exist an n such that all Leinster groups
  have order less than n".'
