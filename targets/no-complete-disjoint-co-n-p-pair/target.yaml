schema: target/v3
id: no-complete-disjoint-co-n-p-pair
title: Complete disjoint NP pairs
informal: '**There is no complete disjoint coNP pair** (Pudlák''s conjecture `DisjCoNP`
  [Pu17]). No disjoint coNP pair is complete under polynomial-time many-one reductions
  of pairs. This implies that `TFNP` has no complete problem and that `SAT` has no
  p-optimal proof system [Pu17, Kh22].'
