title: 'Erdős problem 279: Let $k\geq 3$.'
informal: Let $k\geq 3$. Is there a choice of congruence classes $a_p\pmod{p}$ for
  every prime $p$ such that all sufficiently large integers can be written as $a_p+tp$
  for some prime $p$ and integer $t\geq k$?
