title: 'Erdős problem 137: We say that $N$ is powerful if whenever $p\mid N$ we also
  have $p^2\mid N$.'
informal: We say that $N$ is powerful if whenever $p\mid N$ we also have $p^2\mid
  N$. Let $k\geq 3$. Can the product of any $k$ consecutive positive integers ever
  be powerful?
