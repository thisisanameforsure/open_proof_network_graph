schema: target/v3
id: large-steiner-systems
title: Steiner Systems
informal: Construct an $S(t, k, n)$-Steiner system with $n > k > t > 5$, $t < 10$,
  and $n < 200$. No example of a Steiner system with $t > 5$ is known, despite a 2014
  existence theorem by Keevash showing that such systems must exist for sufficiently
  large $n$. *Reference:* [Large Steiner Systems](https://epoch.ai/frontiermath/open-problems/large-steiner-systems)
