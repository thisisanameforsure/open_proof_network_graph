schema: target/v3
id: beaver-math-olympiad-problem-5
title: Beaver Math Olympiad (BMO)
informal: '[BMO#5](https://wiki.bbchallenge.org/wiki/Beaver_Math_Olympiad#5._1RB0LD_1LC0RA_1RA1LB_1LA1LE_1RF0LC_---0RE_(bbch))
  Let $(a_n)_{n \ge 1}$ and $(b_n)_{n \ge 1}$ be two sequences such that $(a_1, b_1)
  = (0, 5)$ and $$(a_{n+1}, b_{n+1}) = \begin{cases} (a_n+1, b_n-f(a_n)) & \text{if
  } b_n \ge f(a_n) \cr (a_n, 3b_n+a_n+5) & \text{if } b_n < f(a_n) \end{cases}$$ where
  $f(x)=10\cdot 2^x-1$ for all non-negative integers $x$. Does there exist a positive
  integer $i$ such that $b_i = f(a_i)-1$? [BMO#5](https://wiki.bbchallenge.org/wiki/Beaver_Math_Olympiad#5._1RB0LD_1LC0RA_1RA1LB_1LA1LE_1RF0LC_---0RE_(bbch))
  is equivalent to asking whether the 6-state Turing machine [`1RB0LD_1LC0RA_1RA1LB_1LA1LE_1RF0LC_---0RE`](https://wiki.bbchallenge.org/wiki/1RB0LD_1LC0RA_1RA1LB_1LA1LE_1RF0LC_---0RE)
  halts or not. There is presently no consensus on whether the machine halts or not,
  hence the problem is tagged as a `question`. The machine was discovered by [bbchallenge.org](https://bbchallenge.org)
  contributor mxdys on August 7th 2024. The correspondence between the machine''s
  halting problem and the below reformulation has been proven in [Rocq](https://github.com/ccz181078/busycoq/blob/BB6/verify/1RB0LD_1LC0RA_1RA1LB_1LA1LE_1RF0LC_---0RE.v).'
