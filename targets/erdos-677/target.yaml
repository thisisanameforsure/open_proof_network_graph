title: 'Erdős problem 677: Denote by $M(n, k)$ the least common multiple of the finite
  set $\{n+1, \dotsc, n+k\}$.'
informal: Denote by $M(n, k)$ the least common multiple of the finite set $\{n+1,
  \dotsc, n+k\}$. Is it true that for all $m \geq n + k$, we get $M(m, k) \neq M(n,
  k)$?
