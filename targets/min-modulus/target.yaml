schema: target/v3
id: min-modulus
title: Minimum modulus for the unique multiset-sum problem
informal: '**Conjecture 1 (Fonollosa, 2026).** For every $n \geq 2$ and every $N <
  2^n - 2^{\lfloor \log_2 n\rfloor}$, no set of $n$ residues mod $N$ is valid. Equivalently
  the super-increasing set $\{2^k - 1 : 0 \leq k \leq n-1\}$ attains the least valid
  modulus, which is `minModulus n`. `0 < N` excludes `N = 0`, where `ZMod 0` is `ℤ`
  rather than a finite modulus and `{1, 2}` is valid, which would make the statement
  false for a reason unrelated to the question.'
