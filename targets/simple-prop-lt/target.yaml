title: Simple zeros of the Riemann zeta function on the critical line
informal: Is the proportion of simple zeros of `ζ` on the critical line unconditionally
  larger than the Montgomery–Taylor bound `2 - c_MT⁻¹ = 0.6725…`? [Cl26, §7.2] puts
  the ceiling of its method at about `0.682`.
