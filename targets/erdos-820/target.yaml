id: erdos-820
title: 'Erdős problem 820: Let $H(n)$ be the smallest integer $l$ such that there
  exists $k < l$ with $(k^n-1, l^n-1) = 1$.'
informal: Let $H(n)$ be the smallest integer $l$ such that there exists $k < l$ with
  $(k^n-1, l^n-1) = 1$. Is it true that $H(n) = 3$ infinitely often? That is, is $(2^n-1,
  3^n-1) = 1$ for infinitely many $n$ (see `Erdos820.H_eq_three_iff`)? The request
  to estimate $H(n)$ is open-ended and not formalised; the variants below state the
  specific questions that are asked. See also Erdős Problem 770.
