title: 'Erdős problem 853, part i: Let $d_n = p_{n+1} - p_n$, where $p_n$ is the $n$th
  prime.'
informal: Let $d_n = p_{n+1} - p_n$, where $p_n$ is the $n$th prime. Let $r(x)$ be
  the smallest even integer $t$ such that $d_n = t$ has no solutions for $n \le x$.
  Is it true that $r(x) \to \infty$?
