schema: target/v3
id: green-36
title: Green's Open Problem 36
informal: 'Do the following exist, for arbitrarily large $n$? An abelian group $H$
  with $|H| = n^{2+o(1)}$, together with subsets $A_1, ..., A_n, B_1, ..., B_n$ satisfying
  $|A_i||B_i| \ge n^{2-o(1)}$ and $|A_i + B_i| = |A_i||B_i|$, such that the sets $A_i
  + B_i$ are disjoint from the sets $A_j + B_k$ ($j \neq k$)? NOTE: according to [CKS05,
  4.1], the conditions should be $A_i + B_j$ disjoint from $A_j + B_k$ for $i \neq
  k$. See `green_36.variants.cks05`.'
