acknowledged_hazards:
- checker: div-zero
  location: 1 / (↑n - ↑a)
  justification: '`1 / (↑n - ↑a)` is the problem''s summand 1/(n - a) with the subtraction
    in ℝ (no truncation), and its denominator is positive because the hypothesis `a
    < n` on every a ∈ A gives n - a ≥ 1, matching A ⊆ [1, n).'
- checker: div-zero
  location: 1 / ↑p
  justification: p ranges over the primes below n (`(range n).filter Prime`), so p
    ≥ 2 and 1/p is never a division by zero; this is the docstring's Σ_{p<n} 1/p.
- checker: off-by-one-range
  location: 1 ≤ a
  justification: '`1 ≤ a ∧ a < n` is the docstring''s ''A ⊆ [1, n)'': integers from
    1 inclusive to n exclusive.'
