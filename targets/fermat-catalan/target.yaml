schema: target/v3
id: fermat-catalan
title: Fermat-Catalan conjecture
informal: The **Fermat–Catalan conjecture** states that the equation $a^m + b^n =
  c^k$ has only finitely many solutions $(a,b,c,m,n,k)$ with distinct triplets of
  values $(a^m, b^n, c^k)$ where $a, b, c$ are positive coprime integers and $m, n,
  k$ are positive integers satisfying $\frac 1 m + \frac 1 n + \frac 1 k < 1$.
