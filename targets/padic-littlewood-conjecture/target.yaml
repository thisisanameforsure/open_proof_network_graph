schema: target/v3
id: padic-littlewood-conjecture
title: Littlewood conjectures
informal: For real number $\alpha$ and prime $p$, $$ \liminf\_{n \to\infty} n |n|\_{p}\||n\alpha\||
  = 0 $$ where $\||x\|| := \min(|x - \lfloor x \rfloor|, |x - \lceil x \rceil|)$ is
  the distance to the nearest integer, and $|x|\_{p}$ is the $p$-adic norm.
