id: eulers-sum-of-powers-conjecture
title: Euler's sum of powers conjecture
informal: Euler's sum of powers conjecture states that for integers $n > 1$ and $k
  > 1$, if the sum of $n$ positive integers each raised to the $k$-th power equals
  another integer raised to the $k$-th power, then $n ≥ k$. The conjecture is known
  to be false for $k = 4$ and $k = 5$, but remains open for $k ≥ 6$.
