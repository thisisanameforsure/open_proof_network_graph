schema: target/v3
id: erdos-1053
title: 'Erdős problem 1053: Call a number $k$-perfect if $\sigma(n)=kn$, where $\sigma(n)$
  is the sum of the divisors of $n$.'
informal: Call a number $k$-perfect if $\sigma(n)=kn$, where $\sigma(n)$ is the sum
  of the divisors of $n$. Must $k=o(\log\log n)$? A question of Erdős, as reported
  in problem B2 of Guy's collection [Gu04]. The little-$o$ relation is taken as $n
  \to \infty$ within the positive integers for which $\sigma(n) = kn$ for some $k$;
  on this set, $\sigma(n)/n$ is precisely that multiplier $k$.
