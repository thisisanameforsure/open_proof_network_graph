id: wikipedia-sierpinski-number-selfridge-conjecture
title: Sierpiński number
informal: '**The Sierpiński problem (Selfridge''s conjecture).** Is 78557 the smallest
  Sierpiński number? Selfridge conjectured that 78557 is the smallest Sierpiński number.
  He proved in 1962 that 78557 is indeed a Sierpiński number by showing that all numbers
  of the form $78557 \cdot 2^n + 1$ have a factor in the covering set $\{3, 5, 7,
  13, 19, 37, 73\}$.'
