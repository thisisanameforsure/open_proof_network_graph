id: erdos-467
title: 'Erdős problem 467: For every sufficiently large $x$, choose a congruence class
  $a_p\pmod p$ for each prime $p\leq x$.'
informal: For every sufficiently large $x$, choose a congruence class $a_p\pmod p$
  for each prime $p\leq x$. Can the primes be decomposed into two nonempty sets $A$
  and $B$ such that every $n<x$ lies in a chosen class from $A$ and in a chosen class
  from $B$? This follows the interpretation on the Erdős Problems website, which notes
  that the original source omits some crucial quantifiers.
