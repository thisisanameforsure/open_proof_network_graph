schema: target/v3
id: green-86
title: Ben Green's Open Problem 86
informal: 'Let $c > 0$. Let $A$ be a set of $n$ (distinct) integers. Does there exist
  $\theta$ such that no interval of length $\frac{1}{n}$ in $\mathbb{R}/\mathbb{Z}$
  contains more than $n^c$ of the numbers $\theta a \pmod 1$, $a \in A$? We read the
  question for every $c > 0$ and all $n \ge n_0(c)$. For small $n$ it can fail: for
  $A = \{0, 1, 3\}$ and $3^c < 2$, three points with at most one in each interval
  of length $1/3$ must be equally spaced, which is impossible. Intervals are half-open;
  for the question over all $c > 0$ this does not matter, since a closed interval
  of length $1/n$ is covered by two half-open ones. [Gr24] reports that the answer
  is yes for $c > 1/3$ [KRS00], and that [Mo94, Problem 17 (4)] attributes the problem
  to Komlós and Ruzsa.'
