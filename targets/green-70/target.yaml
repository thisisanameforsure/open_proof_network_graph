schema: target/v3
id: green-70
title: Ben Green's Open Problem 70
informal: 'Fix integers $k, \ell$. Is it true that, given a set of $n \geq n_0(k,
  \ell)$ points in $\mathbb{R}^2$, either some $k$ of them lie on a line, or some
  $\ell$ of them are ''mutually visible'', that is to say that line segment joining
  them contains no other point from the set? This question was first raised by Kára,
  Pór and Wood [KPW05]. It is called the big-line-big-clique conjecture [PoWo10, Conjecture
  1]. We read "mutually visible" as "pairwise visible". The cases $k \leq 3$ are trivial:
  a set with no three collinear points has all pairs visible. For the cases $\ell
  \leq 5$, see `green_70.variants.five_visible`.'
