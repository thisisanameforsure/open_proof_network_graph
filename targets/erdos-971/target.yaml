title: 'Erdős problem 971: Let `p(a, d)` be the least prime congruent to `a (mod d)`.'
informal: Let `p(a, d)` be the least prime congruent to `a (mod d)`. Does there exist
  a constant `c > 0` such that for all large `d`, `p(a, d) > (1 + c) * φ(d) * log
  d` for `≫ φ(d)` many values of `a`?
