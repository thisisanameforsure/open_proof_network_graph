title: 'Erdős problem 626, part i: Let $k \geq 4$ and let $g_k(n)$ denote the largest
  $m$ such that there is a graph on $n$ vertices with chromatic number $k$ and girth
  $> m$ (i.e.'
informal: Let $k \geq 4$ and let $g_k(n)$ denote the largest $m$ such that there is
  a graph on $n$ vertices with chromatic number $k$ and girth $> m$ (i.e. containing
  no cycle of length $\leq m$). Does $$\lim_{n\to\infty}\frac{g_k(n)}{\log n}$$ exist?
  By `Erdos626.erdos_626.variants.kostochka` and `Erdos626.erdos_626.variants.erdos_upper`,
  the limit, if it exists, is a positive real number.
