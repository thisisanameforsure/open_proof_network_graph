title: 'Erdős problem 91: Suppose $A\subset \mathbb{R}^2$ has $\lvert A\rvert=n$ and
  minimises the number of distinct distances between points in $A$.'
informal: Suppose $A\subset \mathbb{R}^2$ has $\lvert A\rvert=n$ and minimises the
  number of distinct distances between points in $A$. Prove that for large $n$ there
  are at least two (and probably many) such $A$ which are non-similar.
