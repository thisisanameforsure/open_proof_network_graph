schema: target/v3
id: error-term-improvement
title: Asymptotic density of powerful numbers
informal: Can the exponent $1/6$ in the error term of the Bateman–Grosswald asymptotic
  be improved unconditionally? That is, is there $\delta > 0$ such that $$Q(x) = \frac{\zeta(3/2)}{\zeta(3)}
  x^{1/2} + \frac{\zeta(2/3)}{\zeta(2)} x^{1/3} + O(x^{1/6 - \delta})?$$ Improvements
  are known under the Riemann Hypothesis.
