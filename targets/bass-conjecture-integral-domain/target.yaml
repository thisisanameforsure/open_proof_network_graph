schema: target/v3
id: bass-conjecture-integral-domain
title: Algebraic consequences of the Farrell–Jones conjecture
informal: '**Bass conjecture for commutative integral domains, in idempotent-matrix
  form.** Let `A` be an idempotent matrix over `R[G]`. If the order of `g` is not
  invertible in `R`, then the Hattori–Stallings trace of the projective module represented
  by `A` vanishes at the conjugacy class of `g`. This includes every infinite-order
  `g`, whose `orderOf` is zero. This is Conjecture 0.6 of [BLR08]. By Theorems 0.5
  (ii) and 0.7 of [BLR08] it follows from the Farrell–Jones conjecture with coefficients
  in every field of prime characteristic.'
