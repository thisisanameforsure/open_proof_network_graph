schema: target/v3
id: butson-hadamard-fourth-roots-conjecture
title: Butson-type Hadamard matrices
informal: '**Complex Hadamard conjecture for fourth roots of unity** [Tu70, dLF11]:
  for every integer $m \ge 1$, there exists a $2m \times 2m$ Butson-type Hadamard
  matrix $H(4, 2m)$ with entries in $\{1, -1, i, -i\}$. This quaternary conjecture
  comes from [Tu70, dLF11] (rather than the Wikipedia page above). By Turyn''s doubling
  construction [Tu70], an $H(4, 2m)$ matrix yields a real Hadamard matrix $H(2, 4m)$,
  so this conjecture implies Hadamard''s conjecture.'
