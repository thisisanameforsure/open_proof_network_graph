id: erdos-886
title: 'Erdős problem 886: Let $\epsilon>0$.'
informal: Let $\epsilon>0$. Is it true that, for all large $n$, the number of divisors
  of $n$ in $(n^{1/2},n^{1/2}+n^{1/2-\epsilon})$ is $O_\epsilon(1)$? Erdős attributes
  this conjecture to Ruzsa.
