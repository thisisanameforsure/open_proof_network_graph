id: problem-10-6-variant-1
title: 'Bugeaud Collection of Conjectures and Open Questions: Rapidly Increasing Sequences
  Dense Modulo One'
informal: 'Problem 10.6. Find a very rapidly increasing sequence $(m_n)_{n \ge 1}$
  of positive integers such that $(\{\xi m_n\})_{n \ge 1}$ is dense modulo one for
  every irrational number $\xi$. Note: Furstenberg''s $2^m3^n$ is sublacunary but
  requires two parameters. This is the reading of "very rapidly increasing" as a lower
  bound on the consecutive ratios, and it is the one that remains open. It is not
  answered by runs of consecutive integers, since inside a run $m_{n+1} - m_n = 1$;
  and by `not_isLacunary_of_dense` any answer is pinched between a decaying ratio
  floor and the failure of lacunarity. [Kat16, Cor. 4.9] gives a universally densifying
  sequence of the multiplicative shape $\{2^n 3^e\}$, for which the ratio condition
  reduces to a Diophantine statement about the differences of the exponents $e$ times
  $\log_2 3$ modulo one.'
