schema: target/v3
id: beaver-math-olympiad-problem-1
title: Beaver Math Olympiad (BMO)
informal: '[BMO#1](https://wiki.bbchallenge.org/wiki/Beaver_Math_Olympiad#1._1RB1RE_1LC0RA_0RD1LB_---1RC_1LF1RE_0LB0LE_(bbch))
  Let $(a_n)_{n \ge 1}$ and $(b_n)_{n \ge 1}$ be two sequences such that $(a_1, b_1)
  = (1, 2)$ and $$(a_{n+1}, b_{n+1}) = \begin{cases} (a_n-b_n, 4b_n+2) & \text{if
  }a_n \ge b_n \cr (2a_n+1, b_n-a_n) & \text{if }a_n < b_n \end{cases}$$ for all positive
  integers $n$. Does there exist a positive integer $i$ such that $a_i = b_i$? The
  first 10 values of $(a_n, b_n)$ are $(1, 2), (3, 1), (2, 6), (5, 4), (1, 18), (3,
  17), (7, 14), (15, 7), (8, 30), (17, 22)$. [BMO#1](https://wiki.bbchallenge.org/wiki/Beaver_Math_Olympiad#1._1RB1RE_1LC0RA_0RD1LB_---1RC_1LF1RE_0LB0LE_(bbch))
  is equivalent to asking whether the 6-state Turing machine [`1RB1RE_1LC0RA_0RD1LB_---1RC_1LF1RE_0LB0LE`](https://wiki.bbchallenge.org/wiki/1RB1RE_1LC0RA_0RD1LB_---1RC_1LF1RE_0LB0LE)
  halts or not. There is presently no consensus on whether the machine halts or not,
  hence the problem is tagged as a `question`. The machine was discovered by [bbchallenge.org](https://bbchallenge.org)
  contributor Jason Yuen on June 25th 2024.'
