schema: target/v3
id: exists-is-wieferich-prime-and-is-mirimanoff-prime
title: Can a prime $p$ satisfy $2^{p-1} \equiv 1 \pmod{p^2}$ and $3^{p-1} \equiv 1
  \pmod{p^2}$?
informal: Can a prime $p$ satisfy $2^{p-1} \equiv 1 \pmod{p^2}$ and $3^{p-1} \equiv
  1 \pmod{p^2}$ simultaneously? That is, does there exist a prime $p$ that is both
  a Wieferich prime and a Mirimanoff prime? Wikipedia's list of unsolved problems
  poses this question, citing J. B. Dobson, [On Lerch's formula for the Fermat quotient](https://arxiv.org/abs/1103.3907v6).
  Lenstra gave a heuristic argument against the existence of such a prime (see Dobson,
  Section 9).
