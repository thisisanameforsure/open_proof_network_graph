title: 'Erdős problem 663: Let $k \geq 2$, and let $q(n,k)$ denote the least prime
  which does not divide $\prod_{1 \leq i \leq k}(n+i)$.'
informal: Let $k \geq 2$, and let $q(n,k)$ denote the least prime which does not divide
  $\prod_{1 \leq i \leq k}(n+i)$. Is it true that, if $k$ is fixed and $n$ is sufficiently
  large, then $q(n,k) < (1+o(1))\log n$?
