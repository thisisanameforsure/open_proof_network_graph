summary: Known, and since 2026-11-11 reduced in Lean on this record to one cited theorem.
  For n >= k^2 an exception has no prime factor <= k, so n >= g(k), where g(k) is
  the least n > k+1 with every prime factor of C(n,k) above k, and Konyagin's g(k)
  >= exp(c log^2 k) (1999) exceeds k^3 for large k. On this record the node's first
  route has the single hole erdos-1094--h2--h1--h1 (for large k no C(n,k) with 2k
  <= n < k^3 has all prime factors above k), and that hole now has a route proved
  in Lean except for the Baker-Harman-Pintz prime count erdos-1094--h2--h2--h1, which
  is cited and not formalised. The earlier record on this node (t1009-b, 2026-10-09)
  says "not formalised" and that a formal proof needs an explicit lower bound for
  g(k); the proof here is an existence proof and needed no explicit bound.
