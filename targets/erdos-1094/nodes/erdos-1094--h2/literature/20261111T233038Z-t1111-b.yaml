summary: 'Open. This node is Ecklund''s conjecture (1969) in finitely-many form on
  the range n >= k^2: exceptions have bounded k. Selfridge conjectured the sharper
  form with the single exception C(62,6); the two are not the same statement (the
  ranges and the exceptions differ), and the earlier record on this node (t1009-b,
  2026-10-09) is wrong to call them equivalent. No proof is known. Since 2026-11-11
  this record reduces the node, in Lean, to two statements: the Baker-Harman-Pintz
  count of primes in (k, k + k^(21/40)) (erdos-1094--h2--h2--h1), which is published
  and not formalised, and erdos-1094--h2--h2--h5 (for every c > 0, exceptions with
  n >= k^3 and n > exp(c log^2 k) have bounded k), which is open. Below exp(c log^2
  k), for a small absolute c > 0, the range is covered by erdos-1094--h2--h1--h1 (2k
  <= n < k^3) and erdos-1094--h2--h2--h4 (k^3 <= n <= exp(c log^2 k)), each reduced
  in Lean to the Baker-Harman-Pintz count.'
