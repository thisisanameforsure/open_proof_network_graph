summary: 'This node is BHP 2001''s counting bound in the forward form: with C = 9/100
  (any C slightly below it, to absorb the strict upper endpoint k < p < k + k^0.525
  and integer k, at most one prime of difference), for all k beyond some k0 there
  are at least C k^0.525 / log k primes in (k, k + k^0.525). Exponent 21/40 = 0.525
  matches, log is natural log, the k0 is ineffective-as-stated (BHP say it could be
  made effective with effort). The match between the paper''s display and this Lean
  statement is my reading, not checked by anyone else; nothing of BHP is formalised.
  Note BHP''s sieve is not a routine formalisation, so ''known'', not ''elementary''.'
