summary: 'This is the prime number theorem for Chebyshev''s theta, a classical theorem
  not in the pinned Mathlib (Mathlib has only Chebyshev-type bounds a factor of 2
  apart). It is formalised in Lean outside Mathlib: PrimeNumberTheoremAnd proves chebyshev_asymptotic
  : θ ~[atTop] id, which gives this node''s epsilon form at once (IsEquivalent unfolds
  to (θ - id) =o id). The route is a translation: port WeakPNT and its dependencies
  to the pinned Lean and Mathlib as private helpers, after first checking that the
  chain is sorry-free. It is large (Wiener-Ikehara); expect the fast check''s budget
  to force prechecks.'
