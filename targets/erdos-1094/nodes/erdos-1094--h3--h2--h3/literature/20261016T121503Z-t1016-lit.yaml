summary: 'This node is the upper range of Erdős-Lacampagne-Selfridge''s Theorem 1:
  for k^(7/4) <= n with C n log2 k < k^2, some prime p in (k/2, k) divides C(n,k).
  Published 1993 and not formalised. The proof is Ingham''s count of primes in (x,
  x + x^(3/4)) (deep, not in Mathlib), a pigeonhole to two close primes, and Kummer''s
  theorem for the prime with two multiples in (n - k, n]; everything but Ingham is
  elementary. A translation could split off Ingham as its own hole, shared with erdos-1094--h3--h2--h2.'
