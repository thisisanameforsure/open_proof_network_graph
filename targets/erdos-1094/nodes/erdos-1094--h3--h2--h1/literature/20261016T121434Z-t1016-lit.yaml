references:
- title: E. F. Ecklund, P. Erdős and J. L. Selfridge, A new function associated with
    the prime factors of (n choose k), Math. Comp. 28 (1974) 647-649
  url: null
  note: Proves g(k) > k^(1+c) for an absolute c > 0, where g(k) is the least n > k+1
    with every prime factor of C(n,k) above k. Not read; the statement is as ELS 1993
    and an earlier annex on erdos-1094--h3 quote it.
- title: P. Erdős, C. B. Lacampagne and J. L. Selfridge, Estimates of the least prime
    factor of a binomial coefficient, Math. Comp. 61 (1993) 215-224
  url: https://web.archive.org/web/2020id_/https://www.ams.org/mcom/1993-61-203/S0025-5718-1993-1199990-6/S0025-5718-1993-1199990-6.pdf
  note: Cites EES 1974 for the range n <= k^(1+c) in the proof of its Theorem 1 (p.
    216).
summary: 'This node is the Ecklund-Erdős-Selfridge bound: if 2k <= n and C(n,k) has
  no prime factor <= k, then n > k^(1 + c) for large k. Published 1974 and not formalised.
  The filer has not read the proof; a translator should read EES 1974 first (three
  pages) and judge whether it is elementary (Sylvester-Schur style counting of prime
  powers in k! against the product (n-k+1)...n) before attempting it. Of the three
  ELS ranges this is the likeliest to be within reach.'
