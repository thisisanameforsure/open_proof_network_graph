summary: 'This hole is the Wiener–Ikehara Tauberian theorem, stated exactly in the
  shape Mathlib''s PrimesInAP file once took as a hypothesis (the Prop `WienerIkeharaTheorem`:
  non-negative f, L-series summable on Re s > 1, L(f, s) − A/(s−1) extending continuously
  to Re s ≥ 1, hence (Σ_{n<N} f n)/N → A). It is a classical theorem (Wiener 1932,
  Ikehara 1931) and not in the pinned Mathlib: at the pin the identifier `WienerIkeharaTheorem`
  does not exist, and Mathlib carries no Tauberian theorem of this strength. A Lean
  proof exists outside Mathlib, in PrimeNumberTheoremAnd''s Wiener.lean (over a newer
  Mathlib, with the sorries noted on the parent''s literature record); the route for
  this node is a port of that proof as private helpers under the pinned toolchain,
  which is large. Its sibling hole, the continuation of −ζ''/ζ − 1/(s−1) to Re s ≥
  1, is by contrast a one-line instance of Mathlib''s vonMangoldt.LFunctionResidueClassAux
  at q = 1 (proved, PR #1428).'
