summary: This node covers k^2 <= n < k(k + 3k^0.525) with k(n/k) | k! and minFac C(n,k)
  > n/k. Since n >= k^2 gives n/k >= k, the hypothesis says every prime factor of
  C(n,k) exceeds k, and n < k(k+3k^0.525) < k^3 for k beyond a small bound; so the
  node follows from erdos-1094--h2--h1--h1 (Konyagin's bound g(k) > k^3 for large
  k) without using the divisibility hypothesis. The deduction is mine and unchecked;
  the record is the same published input as --h2--h1--h1, not a separate theorem.
  Nothing is formalised.
