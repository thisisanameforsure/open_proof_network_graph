summary: 'This node is the middle range of Erdős-Lacampagne-Selfridge''s Theorem 1:
  for k^(1+c) < n < k^(7/4) some prime p in (k/2, k) divides C(n,k). Published 1993
  and not formalised. The proof is Ingham''s short-interval prime count (deep, not
  in Mathlib) plus an elementary count of the primes in (k/2, k/2 + k^(7/8)) that
  have no multiple in (n - k, n]. A translation could split it into those two parts
  and prove the counting half outright.'
