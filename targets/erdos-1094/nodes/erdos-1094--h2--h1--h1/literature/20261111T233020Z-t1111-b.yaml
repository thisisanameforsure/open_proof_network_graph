summary: 'Known in the literature, and since 2026-11-11 reduced in Lean on this record
  to one cited theorem. The statement says that for large k no n with 2k <= n < k^3
  has every prime factor of C(n,k) above k. It follows from Konyagin''s theorem g(k)
  >= exp(c log^2 k) (1999), where g(k) is the least n > k+1 with every prime factor
  of C(n,k) above k. The earlier record on this node (t1009-c, 2026-10-09) says "A
  published theorem, not formalised" and that a formal proof needs an explicit bound
  beating k^3; neither sentence describes the record any more. The node now has a
  second route (partial merged as pull request #1293): its assembly is proved, and
  of its five holes four are proved in Lean (the counts on three ranges of n, erdos-1094--h2--h2--h2--h2--h1,
  erdos-1094--h2--h1--h1--h4, erdos-1094--h2--h1--h1--h5, and the small range erdos-1094--h2--h1--h1--h6);
  the fifth is the Baker-Harman-Pintz count of primes in (k, k + k^(21/40)), erdos-1094--h2--h2--h1,
  which is cited and not formalised. The proof is an existence proof and gives no
  explicit constant. Its argument: a prime p with k/2 < p <= k divides C(n,k) as soon
  as two multiples of p lie among n-k+1, ..., n; for the primes just above k/2 where
  that fails, n/p (after a shift) is within a small distance of an integer, and van
  Doorn and Tang''s formalised counting bounds show such p are fewer than the primes
  Baker, Harman and Pintz supply. This is the case w = 2 of the device Trifonov (1998,
  section 4.3) reports from Konyagin''s proof, counted with denominator 1 after a
  shift of n: there, a prime p just above k/2 not dividing C(n,k) has n/p just below
  an integer; here n is first replaced by n - k - floor(K^(21/40)), K = floor(k/2),
  so that the counts already formalised apply (checked against Trifonov''s text by
  t1111-a and t1111-d). The general case, with products wp and rationals of small
  denominator, is the node erdos-1094--h2--h2--h4. Konyagin''s paper itself has not
  been read by anyone who worked on this record.'
