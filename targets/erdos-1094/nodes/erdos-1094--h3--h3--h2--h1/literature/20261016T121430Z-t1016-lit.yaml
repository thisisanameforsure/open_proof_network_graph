summary: 'This node is GR''s Lemma 5.1 at J = 1, weighted by log p, on primes in (k/2,
  11k/20): the fractional parts n/p are equidistributed mod 1 to within delta*k once
  n >= k^2/(C log k). Published (Sander 1992, quoted by Granville-Ramaré 1996) and
  not formalised anywhere known to the filer. A translation would follow Sander: Vaughan''s
  identity, bounds for exponential sums e(hx/p) over primes, then Erdős-Turán (or
  a direct count). It also needs the prime number theorem in the window, which is
  erdos-1094--h3--h3--h1--h1. Deep: the hardest node in the h3 subtree. The node uses
  x = n where GR use n - k; the bound is uniform in x.'
