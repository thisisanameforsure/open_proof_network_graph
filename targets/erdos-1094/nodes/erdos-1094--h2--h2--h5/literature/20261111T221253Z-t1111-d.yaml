references:
- title: E. F. Ecklund, Jr., On prime divisors of the binomial coefficient, Pacific
    J. Math. 29 (1969) 267-270
  url: https://msp.org/pjm/1969/29-2/p05.xhtml
  note: Conjectures that for n > k^2 the binomial coefficient C(n,k) has a prime factor
    p <= n/k. This node is the finitely-many form of that conjecture on a sub-range.
    Cited through erdosproblems.com/384, read 2026-11-11.
- title: 'Erdős problem #1094 (erdosproblems.com), with Selfridge''s conjecture (n
    >= k^2 - 1, single exception C(62,6))'
  url: https://www.erdosproblems.com/1094
  note: Listed open; page read 2026-11-11 (last edited 24 October 2025). No proof
    claim is recorded there.
- title: P. Erdős, C. B. Lacampagne and J. L. Selfridge, Prime factors of binomial
    coefficients and related problems, Acta Arith. 49 (1988) 507-523
  url: https://users.renyi.hu/~p_erdos/1988-26.pdf
  note: 'Section 2 (pp. 521-523): the conjecture lpf C(N,k) <= max(N/k, k) with 14
    exceptions, Selfridge''s conjecture for N >= k^2 - 1, the deficiency, and the
    remark that an exception needs b_j = 1 at the multiple of k. No theorem on this
    range. Read 2026-11-11.'
- title: 'Erdős problem #1095 (erdosproblems.com): g(k), the least n > k+1 with every
    prime factor of C(n,k) above k'
  url: https://www.erdosproblems.com/1095
  note: An exception with n >= k^2 has n >= g(k). Records k^(1+c) < g(k) <= exp((1+o(1))k)
    (Ecklund-Erdős-Selfridge 1974) and g(k) >= exp(c (log k)^2) (Konyagin 1999) as
    the best bounds. Read 2026-11-11.
- title: S. V. Konyagin, Estimates of the least prime factor of a binomial coefficient,
    Mathematika 46 (1999) 41-55
  url: https://doi.org/10.1112/S0025579300007555
  note: g(k) >= exp(c log^2 k) for an absolute c > 0, in the form quoted by erdosproblems.com/1095
    and by van Doorn-Tang p. 2 (on the journal's page the formula is an image); abstract
    and reference list read 2026-11-11, the paper not (paywall). This node's lower
    edge is that bound's shape.
- title: W. van Doorn and Q. Tang, Consecutive integers free of certain prime factors,
    arXiv:2606.19863 (2026)
  url: https://arxiv.org/abs/2606.19863
  note: Theorem 1.1 reaches n <= exp(log^2 k/(20 log log k)); this node starts later,
    at exp(c log^2 k) for every c > 0. Paper read 2026-11-11.
- title: B. Sorenson, J. Sorenson and J. Webster, An algorithm and estimates for the
    Erdős-Selfridge function, ANTS XIV, Open Book Series 4 (2020) 371-385; addendum
    arXiv:1907.08559v3
  url: https://arxiv.org/abs/1907.08559
  note: 'Heuristic model: log g(k) is of order k/log k (constant 0.788 in the addendum).
    So conjecturally this node''s range holds no candidate below about exp(0.79 k/log
    k). Addendum read 2026-11-11.'
- title: Annex 473200f4 on erdos-1094--h2--h2--h3 (2026-11-11)
  url: null
  note: What an exception must look like (floor(n/k) divides C(k-1, n mod k), so n
    < k 2^(k-1) + k) and why the known methods stop; written for the older leaf, it
    applies to this statement word for word.
summary: 'Open. For each c > 0 the statement says that only finitely many k admit
  an n >= k^3 with n > exp(c log^2 k) and every prime factor of C(n,k) above n/k:
  Ecklund''s conjecture in finitely-many form (Selfridge conjectured the sharper form
  with the single exception C(62,6)), restricted to n beyond the shape of the best
  published lower bound for g(k), Konyagin''s exp(c log^2 k) of 1999. Below g(k) the
  statement is implied by lower bounds for g(k) (Erdős problem 1095); from g(k) up
  to k 2^(k-1) no method is known that forces a prime of (k, n/k] to divide one of
  k given consecutive integers; above k 2^(k-1) + k there is no exception (annex 473200f4,
  elementary). I found no paper or forum claim of a proof or of a partial result on
  this range; Erdős-Lacampagne-Selfridge (1988), read today, state it as a conjecture,
  and erdosproblems.com/1094 and /384 list it open.'
