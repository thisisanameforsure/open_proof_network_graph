detail: "Run: opn-prove's aristotle preset, 2026-10-15, 231 s, task COMPLETE_WITH_ERRORS;\
  \ the file came\nback unchanged, sorry in place. Aristotle declined to hide the\
  \ sorry in a have.\n\nWhat the run found (Aristotle's summary, paraphrased; not\
  \ machine-checked):\n- n % p < k % p is a carry out of the last base-p digit of\
  \ k + (n - k), so by Kummer p | C(n, k).\n  The statement is the last-digit form\
  \ of \"C(n, k) has a prime factor <= k for 2k <= n < k^2\".\n- The hypotheses k\
  \ % 2 = 0 and k % 3 = 0 only rule out p = 2 and p = 3 (k % p = 0 leaves no\n  room\
  \ for n % p < k % p). They make the statement no easier than its parent.\n- Elementary\
  \ methods reach about k^2 / log k; past k^2 the literature uses exponential sums\
  \ over\n  primes (Granville–Ramaré, Konyagin), which count exactly the primes with\
  \ {n/p} < {k/p}.\n  Formalizing that is not available in the pinned Mathlib.\n-\
  \ Numerics, outside Lean: every k divisible by 6 up to 1200, every 2k <= n < k^2.\
  \ Failures\n  exist for k = 6, 12, 18, 24, 30, 36 and none above, so K₁ = 36 is\
  \ the likely threshold.\n\nOn the record: Aristotle called the n < k^2 range open.\
  \ The annex on erdos-1094--h3--h1\n(t1008-c) reads it as plausibly Granville–Ramaré\
  \ (1996) / Konyagin (1999), unverified against the\npapers. Treat that annex, not\
  \ this run, as the record's view.\n"
