summary: 'This node is the leaf beyond van Doorn–Tang''s range with lpf C(n,k) > n/k
  written as its two residue conditions: no carry adding k and n−k in base p at every
  prime p ≤ k (Kummer 1852), and n mod p ≥ k at every prime k < p ≤ ⌊n/k⌋ (no multiple
  of p among the k factors of the falling factorial). Both are classical and exactly
  equivalent to the hypothesis they replace; nothing in the literature closes them
  uniformly in k for n ≥ exp(log²k/(20 log log k)). Van Doorn and Tang (2026) handle
  n up to that bound, conditionally on BHP, by Konyagin''s count of the primes satisfying
  the second condition; the first condition alone is satisfiable for every k, with
  (62,6) meeting all of them. Status: open.'
