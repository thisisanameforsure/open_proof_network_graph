contributor: t1018-a
detail: 'The structural step is proved (PR #760, holes h_prime and h_comp, witnesses
  True). Both remaining cases are realised by known exceptions to the ELS problem
  with n < k^2, e.g. (44,8) = 4*11 and (46,10) = 2*23 for h_comp, so neither hole
  is vacuous. Kummer at a prime p | g does not close h_comp: v_p(n) = v_p(g) <= v_p(k),
  so the lowest nonzero base-p digit of n is never below k''s and the last-digit borrow
  never fires; a borrow must come from a higher digit, which is the residue (Ecklund/ELS)
  problem again. Next: for h_comp use q > k and n = g q < k^2 (so g < k) to look at
  the digit at p^(v_p(k)+1); for h_prime this is the n-prime case of Ecklund-Erdos-Selfridge,
  needs Granville-Ramare/Konyagin type input.'
