summary: 'No published result covers this range uniformly in k. Van Doorn and Tang
  (2026) prove lpf C(n,k) ≤ n/k for all large k and k² ≤ n ≤ exp(log²k/(20 log log
  k)) conditionally on Baker–Harman–Pintz, using Konyagin''s counting of m near k
  with n/m near an integer; their method''s parameter stops there. Beyond that range
  the only known constraint is the one every exception satisfies, k⌊n/k⌋ ∣ k! (so
  n < k! + k), which bounds n for each fixed k but not k. The leaf''s extra hypotheses
  (n/gcd(n,k) prime, k ∤ n) are proved reductions on this graph, not literature. Status:
  open.'
