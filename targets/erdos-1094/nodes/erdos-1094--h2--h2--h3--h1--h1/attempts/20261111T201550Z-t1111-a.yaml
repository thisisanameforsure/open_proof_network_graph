node: erdos-1094--h2--h2--h3--h1--h1
outcome: exhausted
route: 'Cut the leaf by a sub-range of n or a family of n = k*B + h (B = n / k, h
  = n % k) in which a prime of (k, B] is forced into n-k+1..n, using only what an
  exception implies at primes up to k: B | C(k-1, h), the carry criterion at primes
  in (k/2, k), and the k-smooth window elements.'
route_class: case-split
schema: postmortem/v2
terminal_goal_state: 'n k : ℕ

  hk : 0 < k

  hn : k * k * k ≤ n

  hT : Real.exp (Real.log ↑k ^ 2 / (20 * Real.log (Real.log ↑k))) < ↑n + 1

  hfac : k * (n / k) ∣ k !

  hmin : (n.choose k).minFac > n / k

  hprime : Nat.Prime (n / n.gcd k)

  hndvd : ¬k ∣ n

  hK : ¬k ≤ 0

  ⊢ False

  '
