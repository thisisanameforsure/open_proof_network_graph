summary: This node is the parent's open core with two provable facts added as hypotheses
  (no window integer has a prime factor in (k, n/k], and the k-smooth parts of the
  window multiply to k!). Both facts are elementary consequences of lpf C(n,k) > n/k
  and are proved on the graph (the sibling erdos-1094--h2--h2--h5--h1 and the parent's
  assembly). What remains is whether, for n above exp(c log² k) with c > 0 arbitrary,
  k consecutive integers can all avoid the primes in (k, n/k]; Konyagin's 1999 method
  shows they cannot for n up to exp(c₀ log² k) for one constant c₀, and no published
  result covers the range beyond. The statement is therefore open in the literature,
  exactly as the parent erdos-1094--h2--h2--h5 is.
