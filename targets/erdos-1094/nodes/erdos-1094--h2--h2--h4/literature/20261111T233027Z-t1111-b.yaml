summary: 'Known in the literature, and since 2026-11-11 reduced in Lean on this record
  to one cited theorem. The statement: there is c > 0 such that for all large k and
  every n with k^3 <= n <= exp(c log^2 k), some prime p <= k divides C(n,k). It is
  the range n >= k^3 of Konyagin''s theorem g(k) >= exp(c log^2 k) (1999), g(k) being
  the least n > k+1 with every prime factor of C(n,k) above k (any smaller constant
  c serves here). On this record its assembly (partial merged as pull request #1309)
  and two of its three holes are proved: the supply of products q p just above k (erdos-1094--h2--h2--h4--h2)
  and the count of integers m with n/m near a fraction of small denominator (erdos-1094--h2--h2--h4--h3,
  from the counting theorem erdos-1094--h2--h2--h2--h3--h1--h1 that van Doorn and
  Tang formalised). The third hole is the Baker-Harman-Pintz count of primes in (k,
  k + k^(21/40)), erdos-1094--h2--h2--h1, cited and not formalised. The proof on this
  record follows Konyagin''s own argument as Trifonov (1998) sketches it from the
  1997 preprint: products wp of a small integer and a prime just above k, and a bound
  for the points where n/u is close to a fraction of small denominator. It differs
  in the exponents, in taking the primes from Baker, Harman and Pintz (2001) where
  he used Baker and Harman (1996), and in starting at n = k^3 where his argument starts
  near k^2/log k. His paper itself has not been read by anyone who worked on this
  record.'
