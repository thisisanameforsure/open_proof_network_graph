id: problem-10-7
title: 'Bugeaud Collection of Conjectures and Open Questions: Confined Powers of Non-Pisot
  Numbers'
informal: Problem 10.7. Let $\varepsilon$ be a positive real number. Are there arbitrarily
  large real numbers $\alpha$ such that $\alpha$ is not a Pisot number and all the
  fractional parts $\{\alpha^n\}$, $n \ge 1$, are lying in an interval of length $\varepsilon
  / \alpha$? [Bug12b]
