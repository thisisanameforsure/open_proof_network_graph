schema: target/v3
id: pierce-birkhoff-conjecture
title: Pierce–Birkhoff conjecture
informal: 'The Pierce-Birkhoff conjecture states that for every real piecewise-polynomial
  function `f : ℝⁿ → ℝ`, there exists a finite set of polynomials `gᵢⱼ ∈ ℝ[x₁, ...,
  xₙ]` such that `f = supᵢ infⱼ(gᵢⱼ)`.'
