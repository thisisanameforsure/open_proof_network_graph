id: erdos-883
title: 'Erdős problem 883, part i: For $A\subseteq \{1,\ldots,n\}$ let $G(A)$ be the
  graph with vertex set $A$, where two integers are joined by an edge if they are
  coprime.'
informal: For $A\subseteq \{1,\ldots,n\}$ let $G(A)$ be the graph with vertex set
  $A$, where two integers are joined by an edge if they are coprime. Is it true that
  if $$|A| > \lfloor n/2 \rfloor + \lfloor n/3 \rfloor - \lfloor n/6 \rfloor$$ then
  $G(A)$ contains all odd cycles of length $\leq n/3 + 1$? A problem of Erdős and
  Sárközy [ErSa97].
