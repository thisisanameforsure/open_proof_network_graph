id: collatz-like
title: Digit $2$ in base $3$ representation of $2^n$
informal: 'For $n > 8$, $2^n$ is not the sum of distinct powers of $3$. Expressed
  here in terms of the base $3$ digits of $2^n$. This conjecture is equivalent to
  the non-halting of a $15$-state $2$-symbol Turing Machine. The Turing Machine version
  is formalized in [cryptids](https://github.com/google-deepmind/cryptids/blob/main/Cryptids/Semantics/ErdosTernary15.lean):
  `ConjectureMachines.ErdosTernary15.halts_erdosTernary15_iff_exists_counterexample`
  proves that this machine halts on the blank tape if and only if some $2^n$ with
  $n > 8$ has no digit $2$ in base $3$. The repository also proves this for Tristan
  Stérin''s $14$-state machine. Source: *Hardness of Busy Beaver Value BB(15)*: https://link.springer.com/chapter/10.1007/978-3-031-72621-7_9
  This is also https://arxiv.org/abs/2107.12475.'
