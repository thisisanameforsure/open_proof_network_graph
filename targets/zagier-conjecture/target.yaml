schema: target/v3
id: zagier-conjecture
title: Zagier's Conjecture on Multiple Zeta Values
informal: '**Zagier''s conjecture** The $\mathbb{Q}$-dimension of the vector space
  spanned by all multiple zeta values of weight $n$ equals $d_n$, where $d_n$ is the
  Zagier dimension sequence satisfying $d_0 = 1$, $d_1 = 0$, $d_2 = 1$, and $d_n =
  d_{n-2} + d_{n-3}$ for $n \geq 3$.'
