id: erdos-461
title: 'Erdős problem 461: Let $s_t(n)$ be the $t$-smooth component of $n$ - that
  is, the product of all primes $p$ (with multiplicity) dividing $n$ such that $p<t$.'
informal: Let $s_t(n)$ be the $t$-smooth component of $n$ - that is, the product of
  all primes $p$ (with multiplicity) dividing $n$ such that $p<t$. Let $f(n,t)$ count
  the number of distinct possible values for $s_t(m)$ for $m\in [n+1,n+t]$. Is it
  true that $$f(n,t)\gg t$$ (uniformly, for all $t$ and $n$)? Erdős and Graham report
  they can show $$f(n,t) \gg \frac{t}{\log t}.$$
