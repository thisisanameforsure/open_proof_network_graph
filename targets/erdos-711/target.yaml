title: 'Erdős problem 711, part i: Let $f(n,m)$ be minimal such that $(m,m+f(n,m))$
  contains distinct integers $a_1,\ldots,a_n$ with $k \mid a_k$ for $1 \leq k \leq
  n$.'
informal: Let $f(n,m)$ be minimal such that $(m,m+f(n,m))$ contains distinct integers
  $a_1,\ldots,a_n$ with $k \mid a_k$ for $1 \leq k \leq n$. Prove that $\max_m f(n,m)
  \leq n^{1+o(1)}$.
