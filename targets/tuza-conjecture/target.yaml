id: tuza-conjecture
title: Tuza's conjecture
informal: 'Tuza''s conjecture (1981): every finite graph $G$ satisfies $\tau(G) \le
  2\nu(G)$, where $\tau(G)$ is its triangle covering number and $\nu(G)$ is its triangle
  packing number. The bound would be sharp, for example for $K_4$ and $K_5$.'
