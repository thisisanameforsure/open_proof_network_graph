schema: target/v3
id: weighing-matrix-conjecture
title: Weighing matrices and the Geramita–Seberry conjecture
informal: '**Weighing matrix conjecture** (Wallis 1972; Geramita–Seberry [GS79]):
  for every positive integer $m \ge 1$ and every weight $0 \le w \le 4m$, there exists
  a weighing matrix $W(4m, w)$ of order $4m$ and weight $w$. At $w = 4m$, this specializes
  to Hadamard''s conjecture.'
