schema: target/v3
id: green-75
title: Ben Green's Open Problem 75
informal: Let $X \subset \mathbb{R}^2$ be a set of $n$ points. Does there exist a
  line $\ell$ through at least two points of $X$ such that the numbers of points on
  either side of $\ell$ differ by at most $100$? This is a form of the Kupitz-Perles
  conjecture [Gr24]. We take $n \geq 2$, since a line through two points of $X$ needs
  two points. If all points of $X$ are collinear, the line through them has no points
  on either side.
