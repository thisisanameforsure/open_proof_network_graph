id: wikipedia-selfridge-selfridge-conjecture
title: Selfridge's conjectures
informal: '**PSW conjecture** (Selfridge''s test) Let $p$ be an odd number, with $p
  \equiv \pm 2 \pmod{5}$, $2^{p-1} \equiv 1 \pmod{p}$ and $F_{p+1} \equiv 0 \pmod{p}$,
  then $p$ is a prime number.'
