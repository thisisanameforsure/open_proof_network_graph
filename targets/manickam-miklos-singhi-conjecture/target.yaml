id: manickam-miklos-singhi-conjecture
title: The Manickam–Miklós–Singhi conjecture (1988)
informal: '**The Manickam–Miklós–Singhi conjecture (1988).** If $n \ge 4k$ and $x_1,
  \dots, x_n$ are real numbers with $x_1 + \dots + x_n = 0$, then at least $\binom{n-1}{k-1}$
  of the $k$-element subsets $S \subseteq \{1, \dots, n\}$ have $\sum_{i \in S} x_i
  \ge 0$. (The bound is attained by $x = (n-1, -1, \dots, -1)$; the condition $n \ge
  4k$ cannot be weakened to $n \ge 3k + 1$ in general.)'
