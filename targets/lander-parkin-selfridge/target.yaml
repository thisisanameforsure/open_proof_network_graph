schema: target/v3
id: lander-parkin-selfridge
title: Lander, Parkin, and Selfridge Conjecture
informal: 'The Lander–Parkin–Selfridge conjecture: if the sum of $n$ positive integer
  $k$-th powers equals the sum of $m$ positive integer $k$-th powers, with all values
  on the left distinct from all values on the right, then $n + m \geq k$. Formally,
  for positive integers $k, n, m \in \mathbb{N}$ and sequences $x : \{0, \ldots, n-1\}
  \to \mathbb{N}$ and $y : \{0, \ldots, m-1\} \to \mathbb{N}$ with $x_i > 0$, $y_j
  > 0$, and $x_i \neq y_j$ for all $i, j$, if $$\sum_{i=0}^{n-1} x_i^k = \sum_{j=0}^{m-1}
  y_j^k,$$ then $k \leq n + m$.'
