schema: target/v3
id: buchi-problem
title: Büchi's problem
informal: '**Büchi''s problem** There exists a positive integer $M$ such that, for
  all integers $x$ and $a$, if $(x+n)^2 + a$ is a square for $M$ consecutive values
  of $n$, then $a = 0$.'
