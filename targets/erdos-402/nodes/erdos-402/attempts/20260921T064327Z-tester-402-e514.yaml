detail: 'The injectivity claim is false: A = {2, 4, 6}, a = 6, b = 2, b'' = 4 gives
  6 / gcd(6,2) = 6 / gcd(6,4) = 3. Checked in Lean on the hosted fast check (the negation
  of the claim closes by decide on this set, then omega). The theorem itself still
  holds on this set, so only the route is dead: the quotients a / gcd(a,b) for a fixed
  a collide, and any pigeonhole has to range over pairs, which is where the Farey
  structure of hole h1 comes in.'
