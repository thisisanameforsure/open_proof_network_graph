id: erdos-ulam-problem
title: The Erdős–Ulam problem
informal: '**The Erdős–Ulam problem (Ulam 1945).** Is there a dense subset of the
  plane whose points are at pairwise rational distances? Conjecturally, no such set
  exists. Solymosi and de Zeeuw [SdZ10] proved that if a rational-distance set has
  infinitely many points on a line or circle, all but finitely many points lie on
  that line or circle.'
