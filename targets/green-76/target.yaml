schema: target/v3
id: green-76
title: Ben Green's Open Problem 76
informal: Let $A$ be a set of $n$ points in the plane. Can one select a set $A'$ of
  $n/2$ points, with the property that any axis-parallel rectangle containing $1000$
  points of $A$ contains at least one point of $A'$? We read "a set of $n/2$ points"
  as at most $\lfloor n/2 \rfloor$ points, and "containing $1000$ points" as containing
  at least $1000$ points. The points of $A'$ need not lie in $A$. If $A' \subseteq
  A$ is required, then the answer is no; see `green_76.variants.subset`.
