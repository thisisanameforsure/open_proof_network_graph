id: vizing-conjecture
title: Vizing's conjecture (1968)
informal: '**Vizing''s conjecture (1968).** For all finite simple graphs $G$ and $H$,
  the domination number of the Cartesian (box) product satisfies $\gamma(G \,\square\,
  H) \ge \gamma(G)\,\gamma(H)$.'
