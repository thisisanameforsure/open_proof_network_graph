id: is-poly-time-prime-factors-list
title: Polynomial-time computability of factoring
informal: '**The integer factorization problem**: Can the prime factorization of a
  positive integer be computed in polynomial time? We state the problem by asking
  if `Nat.primeFactorsList` is polynomial-time computable (assuming typical encodings
  of ℕ and List ℕ into bitstrings). *Reference:* [Wikipedia](https://en.wikipedia.org/wiki/Integer_factorization)'
