id: erdos-483
title: 'Erdős problem 483: Let $f(k)$ be the minimal $N$ such that if $\{1,\ldots,N\}$
  is $k$-coloured then there is a monochromatic solution to $a+b=c$.'
informal: 'Let $f(k)$ be the minimal $N$ such that if $\{1,\ldots,N\}$ is $k$-coloured
  then there is a monochromatic solution to $a+b=c$. Estimate $f(k)$. In particular,
  is it true that $f(k) < c^k$ for some constant $c>0$? The exponential bound is stated
  directly: for every positive number of colours, there is a forcing interval of length
  strictly below $c^k$. This is equivalent to the bound on the least forcing threshold
  and avoids choosing a default value for that threshold.'
