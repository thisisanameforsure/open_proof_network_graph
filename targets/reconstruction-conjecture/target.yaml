schema: target/v3
id: reconstruction-conjecture
title: The reconstruction conjecture
informal: '**The reconstruction conjecture** (Kelly [Ke57], Ulam [Ul60]). Every finite
  simple graph on at least three vertices is determined up to isomorphism by its deck
  of vertex-deleted subgraphs: any two hypomorphic graphs on at least three vertices
  are isomorphic.'
